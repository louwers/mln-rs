[package]
name = "mln-rs-style-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# Generates crates/mln_style's style code. Not released.
publish = false
autotests = false

[lib]
name = "style_codegen"

# `mise run generate:style`
[[bin]]
name = "style-codegen"
path = "src/main.rs"

[dependencies]
mln_style.workspace = true
serde_json.workspace = true

# The C++ repo's `generate.py --check` for plugins, for the style code:
# fails when crates/mln_style's generated files differ from fresh output.
[[test]]
name = "generated_code_test"
path = "src/generated_code_test.rs"

[lints]
workspace = true
