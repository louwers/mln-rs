[package]
name = "mln-rs-expression-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The runner of the shared expression tests; only the tests use it.
publish = false

[lib]
name = "expression_test"

# `cargo run -p mln-rs-expression-test -- [-f filter] [--verbose] [test names...]`
[[bin]]
name = "expression-test"
path = "src/main.rs"

[dependencies]
csscolorparser.workspace = true
feature.workspace = true
geometry.workspace = true
mln_conversion.workspace = true
mln_expression.workspace = true
mln_style.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
serde_json.workspace = true

# The whole expression corpus; fails only on tests that fail but are not
# listed in expected_failures.txt.
[[test]]
name = "corpus_test"
path = "src/corpus_test.rs"

[lints]
workspace = true
