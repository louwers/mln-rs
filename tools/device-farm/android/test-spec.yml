# The test spec of the Android tests' runs on AWS Device Farm (../README.md):
# each job runs the test package's run-tests.sh on an Amazon Linux 2023 test
# host, with the phone attached over adb, and keeps $DEVICEFARM_LOG_DIR as the
# job's customer artifacts. A command in the test phase that fails fails the
# job.
# https://docs.aws.amazon.com/devicefarm/latest/developerguide/custom-test-environment-test-spec.html
version: 0.1

android_test_host: amazon_linux_2023

phases:
  test:
    commands:
      - bash "$DEVICEFARM_TEST_PACKAGE_PATH/run-tests.sh"

artifacts:
  - $DEVICEFARM_LOG_DIR
