[package]
name = "mln-rs-bench-workload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
# What the benchmarks run (src/lib.rs), shared by mln-bench and the desktop
# example's benchmark mode; never released.
publish = false

[lib]
name = "mln_bench_workload"

# `mln-bench compare` builds this package inside the base's workspace too, as
# it builds tools/bench, so it names its dependencies the same way: the
# libraries by path, and other crates by loose requirements.
[dependencies]
mln_map = { package = "mln-rs-map", path = "../../../crates/mln_map" }
mln_style = { package = "mln-rs-style", path = "../../../crates/mln_style" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The manifest's hash, which names the snapshot's directory.
sha2 = "0.11"

[lints]
workspace = true
