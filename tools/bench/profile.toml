# The Cargo profile the benchmarks build with, as a Cargo config file that
# every build of mln-bench passes with `--config`: `mise run bench` builds
# this checkout's harness with it, and `mln-bench compare` builds both sides
# with this one file, so a base whose own manifest lacks the profile, or
# defines it differently, still builds the same way.
#
# Not the release profile: its fat LTO over one codegen unit links the whole
# program again after any change, which takes minutes, and a comparison
# rebuilds after every edit. Here each crate is optimized as in release but
# links without cross-crate LTO, so an edit to one library recompiles that
# library and its dependents in parallel. Both sides of a comparison build
# with this profile, so it measures a change in the code, not a profile.
# Without cross-crate LTO, the compiler inlines less across crates than in
# a release build, so a change whose effect rests on inlining across crates
# needs a release build to confirm it.
#
# Incremental compilation stays off: it partitions code by what earlier
# builds did, so the same source could compile to different instructions in
# two target directories.
#
# The workspace's crates, the harness and the libraries, each compile as
# one codegen unit. Split into several, a crate's code is partitioned by the
# size of all of it, and so is the generic code it instantiates, such as the
# JSON parsing of serde_json: an edit anywhere in a crate, even to a
# function nothing calls, can then change how the compiler inlines the
# code a scenario runs, and its instruction count with it, by more than a
# verdict's threshold. Crates from outside the workspace, which a
# comparison's sides share, keep several units, so that they build faster.
[profile.benchmark]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 1
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
panic = "unwind"

[profile.benchmark.package."*"]
codegen-units = 16

# `mln_bench_fixed_hash` gives the libraries' hash maps a fixed seed
# (mln_util::hash), so that a scenario hashes the same way in every process:
# with a seed from the clock, the order of a map's entries changes the work
# of every run. The harness refuses to run without it, as when a RUSTFLAGS
# environment variable replaces these flags.
[build]
rustflags = ["--cfg", "mln_bench_fixed_hash"]
