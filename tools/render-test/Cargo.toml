[package]
name = "mln-rs-render-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# The runner of the shared render and query tests. Not released.
publish = false
# The one [[test]] below, whose tests/main.rs holds the other files in tests/.
autotests = false

[lib]
name = "render_test"

# `cargo run -p mln-rs-render-test -- --manifestPath tools/render-test/manifests/linux-wgpu.json --output <dir>`
[[bin]]
name = "render-test"
path = "src/main.rs"

[dependencies]
fastrand.workspace = true
feature.workspace = true
geojson.workspace = true
geometry.workspace = true
log.workspace = true
mln_gfx.workspace = true
mln_headless.workspace = true
# SQLite: the ambient cache (cache_path) and mbtiles:// sources, as in C++.
mln_engine = { workspace = true, features = ["font-face-shaper", "sqlite"] }
mln_style.workspace = true
parking_lot.workspace = true
pixelmatch.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
mln_wire.workspace = true
tempfile.workspace = true

# Every integration test, in one binary (tests/main.rs). Each test's report and
# actual/diff images go to target/tmp/<test name>.
[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
