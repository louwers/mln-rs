[package]
name = "mln-rs-render-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The runner of the shared render and query tests; published for the
# difftests (louwers/mln-rs-difftests).
# The [[test]]s below; tests/ also holds their module.
autotests = false

[lib]
name = "render_test"

# `cargo run -p mln-rs-render-test -- --manifestPath tools/render-test/manifests/linux-wgpu.json --output <dir>`
[[bin]]
name = "render-test"
path = "src/main.rs"

[dependencies]
csscolorparser.workspace = true
feature.workspace = true
geojson.workspace = true
geometry.workspace = true
mln_actor.workspace = true
mln_conversion.workspace = true
mln_gfx.workspace = true
mln_headless.workspace = true
mln_image.workspace = true
mln_map.workspace = true
mln_map_types.workspace = true
mln_renderer = { workspace = true, features = ["font-face-shaper"] }
# The ambient cache (cache_path) and mbtiles:// sources, as in C++.
mln_storage = { workspace = true, features = ["sqlite"] }
mln_style.workspace = true
mln_util.workspace = true
pixelmatch.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
postcard.workspace = true
tempfile.workspace = true

# Each test's report and actual/diff images go to target/tmp/<test name>.
#
# The whole shared render suite with each test's expected image as the
# rendered one (`--self-check`).
[[test]]
name = "self_check"
path = "tests/self_check.rs"

# Every render and query test.
[[test]]
name = "render_tests"
path = "tests/render_tests.rs"

# Every test style's layers cross through serde as they went in.
[[test]]
name = "layer_round_trip"
path = "tests/layer_round_trip.rs"

# --jobs against a run in one process.
[[test]]
name = "jobs"
path = "tests/jobs.rs"

[lints]
workspace = true
