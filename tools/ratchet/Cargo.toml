[package]
name = "mln-rs-ratchet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
# Counts the libraries' panic sites and RefCell borrows (`mise run ratchet`);
# never released.
publish = false

[[bin]]
name = "ratchet"
path = "src/main.rs"

[dependencies]
regex.workspace = true
# Reads baseline.toml.
toml_edit = { version = "0.25.18", default-features = false, features = [
  "parse",
] }

[lints]
workspace = true
