# gpu-allocator 0.28.0 from crates.io, its library only, with one change: the
# free-list allocator (src/allocator/free_list_allocator/mod.rs) keeps its free
# chunks ordered by size, so an allocation finds the smallest chunk that fits
# without scanning them all. patches/README.md says when to drop the copy.
[package]
edition = "2021"
rust-version = "1.71"
name = "gpu-allocator"
version = "0.28.0"
authors = ["Traverse Research <opensource@traverseresearch.nl>"]
description = "Memory allocator for GPU memory in Vulkan and DirectX 12"
homepage = "https://github.com/Traverse-Research/gpu-allocator"
documentation = "https://docs.rs/gpu-allocator/"
readme = "README.md"
keywords = ["vulkan", "memory", "allocator"]
categories = ["rendering", "rendering::graphics-api"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Traverse-Research/gpu-allocator"
publish = false

[features]
d3d12 = ["dep:windows"]
default = ["std", "d3d12", "vulkan", "metal"]
hashbrown = ["dep:hashbrown"]
metal = ["dep:objc2", "dep:objc2-metal", "dep:objc2-foundation"]
std = ["presser/std"]
visualizer = ["dep:egui", "dep:egui_extras"]
vulkan = ["dep:ash"]

[lib]
name = "gpu_allocator"
path = "src/lib.rs"

[dependencies]
ash = { version = "0.38", features = ["debug"], optional = true, default-features = false }
egui = { version = ">=0.24, <=0.27", optional = true, default-features = false }
egui_extras = { version = ">=0.24, <=0.27", optional = true, default-features = false }
hashbrown = { version = "0.16.0", optional = true }
log = { version = "0.4", default-features = false }
presser = { version = "0.3", default-features = false }
thiserror = { version = "2.0", default-features = false }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", optional = true, default-features = false }
objc2-foundation = { version = "0.3", optional = true, default-features = false }
objc2-metal = { version = "0.3", optional = true, default-features = false, features = [
    "MTLAccelerationStructure",
    "MTLAllocation",
    "MTLBuffer",
    "MTLDevice",
    "MTLHeap",
    "MTLResidencySet",
    "MTLResource",
    "MTLTexture",
    "std",
] }

[target."cfg(windows)".dependencies]
windows = { version = ">=0.53, <=0.62", optional = true, features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }
