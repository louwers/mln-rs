[package]
name = "mln-rs-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The one [[test]] below, whose tests/main.rs holds the other files in tests/.
autotests = false

[lib]
name = "mln_runtime"
# The doc comments have no examples to run.
doctest = false

# Every integration test, in one binary.
[[test]]
name = "integration"
path = "tests/main.rs"

# The backends that sessions render with, each where its platform has it:
# Metal on Apple's, Vulkan elsewhere but in the browser, D3D12 on Windows,
# OpenGL ES natively and the browser's WebGL2, and WebGPU (wgpu, and in the
# browser the browser's) everywhere. By default the native ones: natively,
# wgpu renders through the same APIs, so it is for hosts that share their
# wgpu device or surfaces. A browser build turns on one of `webgpu` and
# `gl`, so that it carries one backend and its shaders.
[features]
default = ["metal", "vulkan", "d3d12", "gl"]
webgpu = ["dep:mln_webgpu", "dep:wgpu"]
metal = ["dep:mln_mtl"]
vulkan = ["dep:mln_vulkan"]
d3d12 = ["dep:mln_d3d12"]
gl = ["dep:mln_gl"]
# `bench`, the entry points to internal stages that the benchmarks
# (tools/bench) measure. Not API: hidden from the documentation.
bench = [
  "mln_webgpu?/bench",
  "mln_vulkan?/bench",
  "mln_gl?/bench",
  "mln_d3d12?/bench",
  "mln_mtl?/bench",
]

[dependencies]
feature.workspace = true
geo-types.workspace = true
geojson.workspace = true
log.workspace = true
mln_builtins.workspace = true
mln_gfx.workspace = true
# The device's fonts (`text::system_fonts`).
mln_engine = { workspace = true, features = ["system-fonts"] }
mln_style.workspace = true
mln_gl = { workspace = true, optional = true }
mln_webgpu = { workspace = true, optional = true }
parking_lot.workspace = true
serde_json.workspace = true
# The host's WebGPU devices and surfaces.
wgpu = { workspace = true, optional = true }

# The cache database and offline regions (SQLite), which the browser build
# leaves out: the browser's HTTP cache caches its requests. Font faces, the
# device's fonts among them, shaped in-process: natively there is no second
# module to load a shaper from.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mln_engine = { workspace = true, features = ["font-face-shaper", "sqlite"] }

# The browser build's instance: its pump, tile workers in Web Workers and
# canvases.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
mln_web_host.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "HtmlCanvasElement",
  "OffscreenCanvas",
  "WebGl2RenderingContext",
] }
# wgpu's objects are Send and Sync on an instance without threads, as the
# runtime's handles need.
wgpu = { workspace = true, optional = true, features = [
  "fragile-send-sync-non-atomic-wasm",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
mln_mtl = { workspace = true, optional = true }
# The frame pacer's display links, and the run loop of their thread.
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFRunLoop"] }
objc2-foundation = { workspace = true, features = ["NSRunLoop"] }
objc2-quartz-core = { workspace = true, features = [
  "CADisplayLink",
  "CAFrameRateRange",
] }

# The eventfd and timerfd of the frame pacer's choreographer looper.
[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true

[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
mln_vulkan = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
mln_d3d12 = { workspace = true, optional = true }

[dev-dependencies]
glam.workspace = true
# Serves the styles of the resource tests.
httpmock.workspace = true
pollster.workspace = true

# The X11 windows of the surface tests, the host's EGL contexts and textures
# of the device tests, and the mapped dmabufs and sync files of the exported
# ring tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
glow.workspace = true
khronos-egl.workspace = true
libc.workspace = true
winit.workspace = true

# The sync files of the exported ring tests, whose hardware buffers they
# lock.
[target.'cfg(target_os = "android")'.dev-dependencies]
libc.workspace = true

# The D3D11 device of the exported ring tests, which opens the ring's
# textures and fences as a host does, the host's D3D12 textures and fences of
# the borrowed ring tests, and the windows and DirectComposition visuals of
# the Win32 surface tests.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
