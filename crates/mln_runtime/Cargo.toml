[package]
name = "mln-rs-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_runtime"
# The doc comments have no examples to run.
doctest = false

# The backends that sessions render with, each where its platform has it:
# Metal on Apple's, Vulkan elsewhere but in the browser, OpenGL ES natively
# and the browser's WebGL2, and WebGPU (wgpu, and in the browser the
# browser's) everywhere. A browser build turns on one of `webgpu` and `gl`,
# so that it carries one backend and its shaders.
[features]
default = ["webgpu", "metal", "vulkan", "gl"]
webgpu = ["dep:mln_webgpu", "dep:wgpu"]
metal = ["dep:mln_mtl"]
vulkan = ["dep:mln_vulkan"]
gl = ["dep:mln_gl"]

[dependencies]
feature.workspace = true
geo-types.workspace = true
geojson.workspace = true
mln_actor.workspace = true
mln_conversion.workspace = true
mln_gfx.workspace = true
mln_map.workspace = true
mln_math.workspace = true
mln_renderer.workspace = true
mln_storage.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_system_fonts.workspace = true
mln_text.workspace = true
mln_tile_id.workspace = true
mln_gl = { workspace = true, optional = true }
mln_util.workspace = true
mln_webgpu = { workspace = true, optional = true }
parking_lot.workspace = true
serde_json.workspace = true
# The host's WebGPU devices and surfaces.
wgpu = { workspace = true, optional = true }

# The cache database and offline regions, which the browser build leaves
# out: the browser's HTTP cache caches its requests.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mln_storage = { workspace = true, features = ["sqlite"] }
mln_storage_offline.workspace = true

# The browser build's instance: its pump, tile workers in Web Workers and
# canvases.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
mln_web_host.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "HtmlCanvasElement",
  "OffscreenCanvas",
  "WebGl2RenderingContext",
] }
# wgpu's objects are Send and Sync on an instance without threads, as the
# runtime's handles need.
wgpu = { workspace = true, optional = true, features = [
  "fragile-send-sync-non-atomic-wasm",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
mln_mtl = { workspace = true, optional = true }

[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
mln_vulkan = { workspace = true, optional = true }

[dev-dependencies]
# Serves the styles of the resource tests.
httpmock.workspace = true
pollster.workspace = true

# The X11 windows of the surface tests, the host's EGL contexts and textures
# of the device tests, and the mapped dmabufs and sync files of the exported
# ring tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
glow.workspace = true
khronos-egl.workspace = true
libc.workspace = true
winit.workspace = true

# The sync files of the exported ring tests, whose hardware buffers they
# lock.
[target.'cfg(target_os = "android")'.dev-dependencies]
libc.workspace = true

# The D3D11 device of the exported ring tests, which opens the ring's
# textures and fences as a host does, and the windows of the Win32 surface
# tests.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
