[package]
name = "mln-rs-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_util"
# The doc comments have no examples to run.
doctest = false

[dependencies]
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
csscolorparser.workspace = true
feature.workspace = true
flate2.workspace = true
geometry.workspace = true
mln_math.workspace = true
rapidjson.workspace = true
serde.workspace = true
web-time.workspace = true

# Ported C++ gtests of test/util (markers `// gtest: Group.Name`), for
# mln_util and the low crates next to it.
[[test]]
name = "mln_util_gtest"
path = "tests/gtest/main.rs"

# Ports test/util/padding.test.cpp: its expression cases need mln_style.
[[test]]
name = "gtest_padding"
path = "tests/gtest_padding.rs"

[dev-dependencies]
mln_conversion = { package = "mln-rs-conversion", path = "../mln_conversion" }
mln_expression = { package = "mln-rs-expression", path = "../mln_expression" }
mln_style = { package = "mln-rs-style", path = "../mln_style" }
mln_style_types = { package = "mln-rs-style-types", path = "../mln_style_types" }
mln_tile_id = { package = "mln-rs-tile-id", path = "../mln_tile_id" }
nunicode = { package = "mln-rs-nunicode", path = "../../vendor/nunicode" }
postcard.workspace = true
serde_json.workspace = true

[lints]
workspace = true
