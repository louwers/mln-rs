[package]
name = "mln-rs-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license = "BSD-2-Clause AND Zlib"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_util"
# The doc comments have no examples to run.
doctest = false

[dependencies]
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
feature.workspace = true
flate2.workspace = true
foldhash.workspace = true
geo-types.workspace = true
geometry.workspace = true
glam.workspace = true
httpdate.workspace = true
mln_math.workspace = true
parking_lot.workspace = true
mln_wire.workspace = true
thiserror.workspace = true
unicode-properties.workspace = true
web-time.workspace = true

[features]
# `Queue::run_once_at`, which runs a queue's timed tasks by a clock of the
# caller's, for the benchmarks' simulated network (tools/bench). Not API:
# hidden from the documentation.
bench = []

# android: the Java VM of the crates' Android services.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
libc.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# host_bytes: tile workers' vertex and index arrays, kept in JS until upload.
js-sys.workspace = true

# Ports test/util/padding.test.cpp: its expression cases need mln_style.
[[test]]
name = "gtest_padding"
path = "tests/gtest_padding.rs"

[dev-dependencies]
mln_conversion = { package = "mln-rs-conversion", path = "../mln_conversion" }
mln_expression = { package = "mln-rs-expression", path = "../mln_expression", features = [
  "dsl",
] }
mln_style = { package = "mln-rs-style", path = "../mln_style" }
mln_style_types = { package = "mln-rs-style-types", path = "../mln_style_types" }
mln_tile_id = { package = "mln-rs-tile-id", path = "../mln_tile_id" }
serde_json.workspace = true

[lints]
workspace = true
