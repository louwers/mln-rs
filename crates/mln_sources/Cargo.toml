[package]
name = "mln-rs-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_sources"
# The doc comments have no examples to run.
doctest = false

[dependencies]
feature.workspace = true
geojson.workspace = true
mln_conversion.workspace = true
mln_expression.workspace = true
mln_geojson.workspace = true
mln_image.workspace = true
mln_map_types.workspace = true
mln_math.workspace = true
mln_renderer.workspace = true
mln_storage.workspace = true
mln_style.workspace = true
mln_tile.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The built-in layer types, which lay the tests' tiles out.
mln_layers = { package = "mln-rs-layers", path = "../mln_layers" }
# The drivers of the tests' tiles.
mln_renderer = { workspace = true, features = ["testing"] }
mln_storage = { workspace = true, features = ["stub-file-source"] }

[lints]
workspace = true
