[package]
name = "mln-rs-storage-offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_storage_offline"
# The doc comments have no examples to run.
doctest = false

[dependencies]
feature.workspace = true
mln_actor.workspace = true
mln_conversion.workspace = true
mln_renderer.workspace = true
# OfflineDownload writes the region into OfflineDatabase.
mln_storage = { workspace = true, features = ["sqlite"] }
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
regex.workspace = true

# OfflineDownload.ResourceOfflineUsageUnset renders a map after the
# download.
[[test]]
name = "offline_download_map_test"
path = "tests/offline_download_map.rs"

# Ports test/util/mapbox.test.cpp.
[[test]]
name = "gtest_mapbox"
path = "tests/gtest_mapbox.rs"

[dev-dependencies]
# Serves the styles of the DatabaseFileSource region tests.
httpmock.workspace = true
mln_headless = { package = "mln-rs-headless", path = "../mln_headless" }
mln_map = { package = "mln-rs-map", path = "../mln_map" }

[lints]
workspace = true
