[package]
name = "mln-rs-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
# The Unicode tables of text/ (arabic_tables.rs, bidi_mirroring.rs) are
# generated from the Unicode Character Database.
license = "BSD-2-Clause AND Unicode-3.0"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_engine"
# The doc comments have no examples to run.
doctest = false

[features]
default = ["font-face-shaper", "sqlite", "system-fonts"]
# The style's font faces shaped in-process with `text::Shaper`
# (HarfRust), the default FontFaceEngine (src/text/font_face_engine.rs). The
# workspace's packages depend on this crate without its default features,
# and those that render natively (mln-rs-runtime, and mln-rs,
# examples/desktop, tools/render-test and tools/bench) turn this one on. The browser build (examples/web) leaves it
# off: HarfRust, skrifa and the glyph rasterizer go into its second module,
# crates/mln_web_shaper, which its map loads only for styles with font faces.
font-face-shaper = []
# SQLite: OfflineDatabase, the Database file source (the ambient cache and
# offline regions, under ResourceOptions::cache_path), the MBTiles file
# source and offline downloads (`offline`). examples/web leaves it out and
# relies on the browser's HTTP cache, like MapLibre GL JS. Without it, the
# ResourceLoader has neither file source, so it serves no cache-only
# requests and no mbtiles:// URLs (as the C++ MainResourceLoader without
# them).
sqlite = ["dep:rusqlite"]
# `bench`, the entry points to internal stages that the benchmarks
# (tools/bench) measure, and `storage::simulated_network`, the online file
# source over a transport and a clock of the caller's. The crate's own tests
# build the latter without the feature. Not API: hidden from the
# documentation.
bench = []
# `text::system_fonts`: the device's fonts, found through fontconfig,
# Android's font matcher, CoreText or DirectWrite, as font faces for the
# glyphs that no style font has.
system-fonts = [
  "dep:libloading",
  "dep:memmap2",
  "dep:objc2-core-foundation",
  "dep:objc2-core-text",
  "dep:sys-locale",
  "dep:windows",
  "dep:windows-core",
]
# StubFileSource, the file source that the tests of this crate's dependents
# answer requests with.
stub-file-source = []

[dependencies]
ab_glyph_rasterizer.workspace = true
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
buffa.workspace = true
bytes.workspace = true
earcut.workspace = true
etagere.workspace = true
fast-mvt.workspace = true
flate2.workspace = true
geo-types.workspace = true
geo-index.workspace = true
geojson.workspace = true
geometry.workspace = true
glam.workspace = true
httpdate.workspace = true
harfrust.workspace = true
i_overlay.workspace = true
image-webp.workspace = true
log = { workspace = true, features = ["kv"] }
mln_gfx.workspace = true
mln_style.workspace = true
mln_wire = { workspace = true, features = ["geo-types", "glam", "parking_lot"] }
mlt-core.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
pmtiles.workspace = true
png.workspace = true
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true
skrifa.workspace = true
smallvec.workspace = true
thiserror.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-properties.workspace = true
wuff.workspace = true

# Apple's platforms come with SQLite, and an app that links its own copy uses
# its filesystem probes, which Apple counts as disk-space APIs whose use an
# app's privacy manifest must give a reason for. Elsewhere SQLite is built in.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, optional = true, features = ["bundled"] }

# The HTTP transport: the platform's HTTP stack where it has one (NSURLSession
# on Apple platforms, HttpURLConnection on Android, the browser's fetch on
# wasm), else ureq, with the system's trust store.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
# The system fonts, through CoreText.
objc2-core-foundation = { workspace = true, optional = true, features = [
  "CFArray",
  "CFData",
  "CFString",
] }
objc2-core-text = { workspace = true, optional = true, features = [
  "CTFontTraits",
] }

[target.'cfg(target_os = "windows")'.dependencies]
ureq = { workspace = true, features = ["gzip", "native-tls-no-default"] }
# The system fonts, through DirectWrite's font fallback.
windows = { workspace = true, optional = true, features = [
  "Win32_Graphics_DirectWrite",
] }
# For the code that windows' #[implement] generates.
windows-core = { workspace = true, optional = true }

[target.'cfg(not(any(target_family = "wasm", target_vendor = "apple", target_os = "windows", target_os = "android")))'.dependencies]
rustls.workspace = true
ureq = { workspace = true, features = [
  "gzip",
  "platform-verifier",
  "rustls-no-provider",
] }

# JPEG decoding, which the browser does on wasm, and the system fonts' files
# and the device's languages.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
memmap2 = { workspace = true, optional = true }
sys-locale = { workspace = true, optional = true }
zune-jpeg.workspace = true

# The system fonts: fontconfig, and Android's font matcher, loaded at run
# time.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
libloading = { workspace = true, optional = true }

# HttpURLConnection and the app's assets, and the app's languages for the
# system fonts, through the app's Java VM.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

# The browser's fetch.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[dev-dependencies]
# Serves the styles of the DatabaseFileSource region tests, and the
# responses of the network tests.
httpmock.workspace = true
# The built-in registrations of the integration tests' maps.
mln_builtins = { package = "mln-rs-builtins", path = "../mln_builtins" }
# What the unit tests' GeoJSON source type cuts its tiles with
# (src/tests/types/geojson.rs).
mln_geojson.workspace = true
mln_headless = { package = "mln-rs-headless", path = "../mln_headless" }
mln_webgpu = { package = "mln-rs-webgpu", path = "../mln_webgpu" }
pixelmatch = { package = "mln-rs-pixelmatch", path = "../../vendor/pixelmatch" }
proptest.workspace = true
tempfile.workspace = true

# OfflineDownload.ResourceOfflineUsageUnset renders a map after the
# download.
[[test]]
name = "layer_type"
path = "tests/layer_type.rs"
# A layer type that another crate declares on the public layer contract.

[[test]]
name = "style_members"
path = "tests/style_members.rs"
# Extension members that another crate registers, read by a layer's
# renderer.

[[test]]
name = "shared_targets"
path = "tests/shared_targets.rs"
# Built-in layers routed into shared targets by an extension of the test's
# own, and read back.

[[test]]
name = "offline_download_map_test"
path = "tests/offline_download_map.rs"
# StubFileSource answers the download.
required-features = ["sqlite", "stub-file-source"]

[lints]
workspace = true
