[package]
name = "mln-rs-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_engine"
# The doc comments have no examples to run.
doctest = false

[features]
default = ["font-face-shaper"]
# The style's font faces shaped in-process with mln_text's Shaper
# (HarfRust), the default FontFaceEngine (src/text/font_face_engine.rs). The
# workspace's packages depend on this crate without its default features,
# and those that render natively (mln-rs-runtime, and mln-rs,
# examples/desktop, tools/render-test and tools/bench) turn this one on. The browser build (examples/web) leaves it
# off: HarfRust, skrifa and the glyph rasterizer go into its second module,
# crates/mln_web_shaper, which its map loads only for styles with font faces.
font-face-shaper = []
# `bench`, the entry points to internal stages that the benchmarks
# (tools/bench) measure. Not API: hidden from the documentation.
bench = []
# `conformance`, the frames that the backends' tests draw through their
# `Gpu`.
gpu-conformance = ["dep:js-sys"]

[dependencies]
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
earcut.workspace = true
etagere.workspace = true
feature.workspace = true
geo-types.workspace = true
geo-index.workspace = true
geojson.workspace = true
geometry.workspace = true
log.workspace = true
mln_gfx.workspace = true
mln_image.workspace = true
mln_sprite.workspace = true
glam.workspace = true
mln_storage.workspace = true
mln_style.workspace = true
mln_text.workspace = true
mln_tile.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
parking_lot.workspace = true
polylabel.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
mln_wire = { workspace = true, features = ["geo-types", "glam", "parking_lot"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# `conformance::host_writes`: bytes in a JS array.
js-sys = { workspace = true, optional = true }

[dev-dependencies]
mln_storage = { workspace = true, features = ["stub-file-source"] }
mln_webgpu = { package = "mln-rs-webgpu", path = "../mln_webgpu" }
mlt-core.workspace = true
pixelmatch = { package = "mln-rs-pixelmatch", path = "../../vendor/pixelmatch" }
proptest.workspace = true

[lints]
workspace = true
