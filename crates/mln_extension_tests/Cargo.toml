# Small layer and source types written against the facade alone, as an
# author outside the engine writes them, and the tests that render with
# them and with the first-party extension crates, as a caller adds them.
[package]
name = "mln-rs-extension-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mln_extension_tests"
doctest = false

[dependencies]
mln_rs = { workspace = true, features = [
  "webgpu",
  "metal",
  "vulkan",
  "d3d12",
  "gl",
] }

[dev-dependencies]
mln_image_process.workspace = true
mln_location_puck.workspace = true
mln_ngon.workspace = true
parking_lot.workspace = true

[lints]
workspace = true
