# The `org.maplibre.ngon` layer type, written on the layer contract that the
# engine opens to other crates. Its render and query tests (render-tests/)
# run through tools/render-test's runner (tests/render_tests.rs).
[package]
name = "mln-rs-ngon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A layer type for mln-rs that draws a regular polygon at each point of a geometry source"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_ngon"

[dependencies]
bytemuck.workspace = true
geometry.workspace = true
glam.workspace = true
mln_engine.workspace = true
mln_gfx.workspace = true
mln_style.workspace = true
mln_wire.workspace = true

[dev-dependencies]
mln_builtins.workspace = true
# Unpublished: without a version, `cargo package` drops it.
mln_headless = { package = "mln-rs-headless", path = "../mln_headless" }
render_test.workspace = true

[lints]
workspace = true
