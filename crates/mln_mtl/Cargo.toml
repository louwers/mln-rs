[package]
name = "mln-rs-mtl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The [[test]]s below.
autotests = false

[lib]
name = "mln_mtl"
# The doc comments have no examples to run.
doctest = false

# Metal exists on Apple platforms only; elsewhere the crate is empty.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2.workspace = true
bytemuck.workspace = true
mln_gfx.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = [
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDictionary",
  "NSObject",
  "NSRange",
] }
objc2-io-surface.workspace = true
objc2-metal = { workspace = true, features = ["block2", "objc2-io-surface"] }
objc2-quartz-core.workspace = true
parking_lot.workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
mln_gfx = { workspace = true, features = ["gpu-conformance"] }

# Compiles every MSL source extracted from include/mln/shaders/mtl/*.hpp
# with the system's Metal compiler.
[[test]]
name = "msl_compile_test"
path = "tests/msl_compile_test.rs"

# Ports test/renderer/metal_renderable.test.cpp.
[[test]]
name = "gtest_metal_renderable"
path = "tests/gtest_metal_renderable.rs"

# A library device logs the GPU it is on.
[[test]]
name = "log_test"
path = "tests/log_test.rs"

[lints]
workspace = true
