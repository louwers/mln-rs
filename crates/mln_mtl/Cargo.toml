[package]
name = "mln-rs-mtl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_mtl"
# The doc comments have no examples to run.
doctest = false

[features]
# `bench`, how long the GPU took, which the benchmarks (tools/bench) measure.
# Not API: hidden from the documentation.
bench = ["objc2-metal/MTLCounters"]

# Metal exists on Apple platforms only; elsewhere the crate is empty.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2.workspace = true
bytemuck.workspace = true
log.workspace = true
mln_gfx = { workspace = true, features = ["msl"] }
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = [
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDictionary",
  "NSObject",
  "NSRange",
] }
objc2-io-surface.workspace = true
objc2-metal = { workspace = true, features = ["block2", "objc2-io-surface"] }
objc2-quartz-core.workspace = true
parking_lot.workspace = true
raw-window-metal.workspace = true

# The programs, which the tests compile and draw with, and the conformance
# cases that `MetalGpu`'s tests run.
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
mln_engine = { package = "mln-rs-engine", path = "../mln_engine", features = [
  "gpu-conformance",
] }

[lints]
workspace = true
