[package]
name = "mln-rs-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The C API, built as a C library rather than used from Rust, so not
# published to crates.io.
publish = false

[lib]
# The C library's name, which hosts and the ABI suite (tools/c-abi-test) link.
name = "maplibre_native_c"
# And an rlib for a Rust app in the browser that links the library into its
# own wasm module.
crate-type = ["cdylib", "staticlib", "rlib"]
doctest = false

# The runtime's backends (crates/mln_runtime/Cargo.toml), by default the
# native ones. A browser build turns on one of `webgpu` and `gl`
# (`mise run c-web:build`).
[features]
default = ["metal", "vulkan", "d3d12", "gl"]
webgpu = ["mln_runtime/webgpu"]
metal = ["mln_runtime/metal"]
vulkan = ["mln_runtime/vulkan", "dep:mln_vulkan"]
d3d12 = ["mln_runtime/d3d12", "dep:mln_d3d12"]
gl = ["mln_runtime/gl", "dep:mln_gl"]

[dependencies]
geo-types.workspace = true
geojson.workspace = true
glam.workspace = true
log = { workspace = true, features = ["kv"] }
mln_gfx.workspace = true
# The built-in registrations.
mln_builtins.workspace = true
# The custom layer type, and the custom source types' engine halves.
mln_engine.workspace = true
# The custom geometry sources' tiles, cut as a GeoJSON source's.
mln_geojson.workspace = true
mln_runtime.workspace = true
mln_style.workspace = true
parking_lot.workspace = true
# The windows that window targets name, as the runtime takes them.
raw-window-handle.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The CAMetalLayers of Metal layer targets, and the command buffers that
# custom layers draw into.
[target.'cfg(target_vendor = "apple")'.dependencies]
mln_mtl.workspace = true
objc2.workspace = true

# The host's EGL, WGL and WebGL2 contexts, textures and surfaces.
[target.'cfg(any(windows, all(unix, not(target_vendor = "apple")), target_family = "wasm"))'.dependencies]
mln_gl = { workspace = true, optional = true }

# The browser build: JavaScript objects, the instance's tile workers and the
# shaper module.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
mln_web_host.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["MessagePort"] }

# The host's Vulkan devices, images and surfaces.
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
mln_vulkan = { workspace = true, optional = true }

# The host's D3D12 devices and textures, and the composition targets that
# D3D12 presents to.
[target.'cfg(windows)'.dependencies]
mln_d3d12 = { workspace = true, optional = true }

# A style's font faces, shaped in-process. The browser build leaves the
# shaper to a module of its own (crates/mln_engine/Cargo.toml). The C
# runtime: its atexit, which marks the start of process exit.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc.workspace = true
mln_engine = { workspace = true, features = ["font-face-shaper"] }

# The X11 windows of the window target test.
[target.'cfg(target_os = "linux")'.dev-dependencies]
winit.workspace = true

# The sync files of the exported ring test, whose hardware buffers it locks.
# The app's languages, which mln_android_init() reads for the system fonts.
[target.'cfg(target_os = "android")'.dependencies]
mln_engine = { workspace = true, features = ["system-fonts"] }

[target.'cfg(target_os = "android")'.dev-dependencies]
libc.workspace = true

# The host's windows and WGL contexts of the OpenGL tests, which read the
# frames back.
[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true

[lints]
workspace = true
