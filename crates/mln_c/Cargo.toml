[package]
name = "mln-rs-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# maplibre-native-ffi's C ABI, built as a C library rather than used from
# Rust, so not published to crates.io.
publish = false

[lib]
# The name of maplibre-native-ffi's CMake target, so its ABI suite links this
# library as it links that one (tools/c-abi-test).
name = "maplibre_native_c"
# And an rlib for a Rust app in the browser that links the library into its
# own wasm module.
crate-type = ["cdylib", "staticlib", "rlib"]
doctest = false

# The runtime's backends (crates/mln_runtime/Cargo.toml). A browser build
# turns on one of `webgpu` and `gl` (`mise run c-web:build`).
[features]
default = ["webgpu", "metal", "vulkan", "gl"]
webgpu = ["mln_runtime/webgpu"]
metal = ["mln_runtime/metal"]
vulkan = ["mln_runtime/vulkan", "dep:mln_vulkan"]
gl = ["mln_runtime/gl", "dep:mln_gl"]

[dependencies]
feature.workspace = true
geo-types.workspace = true
geojson.workspace = true
mln_conversion.workspace = true
mln_expression.workspace = true
mln_map.workspace = true
mln_map_types.workspace = true
mln_runtime.workspace = true
mln_storage.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
parking_lot.workspace = true
# The windows that window targets name, as the runtime takes them.
raw-window-handle.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The CAMetalLayers of Metal layer targets.
[target.'cfg(target_vendor = "apple")'.dependencies]
mln_mtl.workspace = true
# The display links of frame pacers, and the run loop of their thread.
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFRunLoop"] }
objc2-foundation = { workspace = true, features = ["NSRunLoop"] }
objc2-quartz-core = { workspace = true, features = [
  "CADisplayLink",
  "CAFrameRateRange",
] }

# The host's EGL, WGL and WebGL2 contexts, textures and surfaces.
[target.'cfg(any(windows, all(unix, not(target_vendor = "apple")), target_family = "wasm"))'.dependencies]
mln_gl = { workspace = true, optional = true }

# The browser build: JavaScript objects, the instance's tile workers and the
# shaper module.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
mln_web_host.workspace = true
wasm-bindgen.workspace = true

# The host's Vulkan devices, images and surfaces.
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
mln_vulkan = { workspace = true, optional = true }

# A style's font faces, shaped in-process. The browser build leaves the
# shaper to a module of its own (crates/mln_renderer/Cargo.toml). The C
# runtime: its atexit, which marks the start of process exit, and the eventfd
# and timerfd of Android frame pacers.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc.workspace = true
mln_renderer = { workspace = true, features = ["font-face-shaper"] }

# The X11 windows of the window target test.
[target.'cfg(target_os = "linux")'.dev-dependencies]
winit.workspace = true

# The sync files of the exported ring test, whose hardware buffers it locks.
[target.'cfg(target_os = "android")'.dev-dependencies]
libc.workspace = true

# The host's windows and WGL contexts of the OpenGL tests, which read the
# frames back.
[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true

[lints]
workspace = true
