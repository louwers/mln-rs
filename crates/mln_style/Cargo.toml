[package]
name = "mln-rs-style"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_style"
# The doc comments have no examples to run.
doctest = false

[dependencies]
feature.workspace = true
geojson.workspace = true
geo-types.workspace = true
mln_conversion.workspace = true
mln_geojson.workspace = true
mln_expression.workspace = true
mln_image.workspace = true
mln_map_types.workspace = true
mln_math.workspace = true
mln_storage.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
parking_lot.workspace = true
mln_wire.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
mln_expression = { workspace = true, features = ["dsl"] }
# The built-in layer types, whose layers tests/ reads.
mln_layers = { package = "mln-rs-layers", path = "../mln_layers" }
# The built-in registrations, for tests/'s styles of every type.
mln_rs = { package = "mln-rs", path = "../..", default-features = false }
mln_storage = { workspace = true, features = ["stub-file-source"] }
mln_tile = { package = "mln-rs-tile", path = "../mln_tile" }

[lints]
workspace = true
