[package]
name = "mln-rs-layers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# The [[test]]s below.
autotests = false

[lib]
name = "mln_layers"
# The doc comments have no examples to run.
doctest = false

[dependencies]
bytemuck.workspace = true
mln_gfx.workspace = true
mln_map_types.workspace = true
mln_renderer.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
# The expansion of mln_style's `properties!` derives `mln_wire::Wire`.
mln_wire.workspace = true

[dev-dependencies]
mln_conversion.workspace = true
# The built-in registrations that the tests' styles parse against.
mln_rs = { package = "mln-rs", path = "../..", default-features = false }
serde_json.workspace = true

[[test]]
name = "background"
path = "tests/background.rs"

[lints]
workspace = true
