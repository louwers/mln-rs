[package]
name = "mln-rs-layers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# The [[test]]s below.
autotests = false

[lib]
name = "mln_layers"
# The doc comments have no examples to run.
doctest = false

[features]
# The programs' sources in each shading language, which a backend compiles:
# WGSL for mln_webgpu, MSL for mln_mtl (on Apple platforms), GLSL ES for
# mln_gl, and the GLSL that mln_glsl parses for mln_vulkan and mln_d3d12
# (outside Apple platforms and the browser). The facade's backend features
# turn on their languages', so a build carries only its backends' shaders.
wgsl = []
msl = []
glsl-es = []
glsl = []
# `conformance`, the frames that the backends' tests draw through their
# `Gpu`.
gpu-conformance = []
# `bench`, the entry points to the layer types' internal stages that the
# benchmarks (tools/bench) measure. Not API: hidden from the documentation.
bench = ["mln_render/bench"]

[dependencies]
bytemuck.workspace = true
earcut.workspace = true
feature.workspace = true
geometry.workspace = true
glam.workspace = true
mln_gfx.workspace = true
mln_map_types.workspace = true
mln_math.workspace = true
mln_render.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
mln_wire.workspace = true
polylabel.workspace = true
serde_json.workspace = true

[dev-dependencies]
geo-types.workspace = true
# The expression builders of the format section override tests.
mln_style = { workspace = true, features = ["dsl"] }
# The WGSL sources, which the tests' WebGPU backend compiles, and the
# entry points to the symbol layer type's placement.
mln_layers = { package = "mln-rs-layers", path = ".", features = [
  "bench",
  "wgsl",
] }
# The transforms whose views the symbols' projection tests read.
mln_map = { package = "mln-rs-map", path = "../mln_map" }
# The benchmarks' entry points to a tile's layout, which the tests run
# behind the worker codec.
mln_render = { workspace = true, features = ["bench"] }
# The built-in registrations that the tests' styles parse against.
mln_rs = { package = "mln-rs", path = "../..", default-features = false }
mln_webgpu = { package = "mln-rs-webgpu", path = "../mln_webgpu" }
mlt-core.workspace = true
parking_lot.workspace = true
proptest.workspace = true

[[test]]
name = "background"
path = "tests/background.rs"

[[test]]
name = "codec"
path = "tests/codec.rs"

[[test]]
name = "declarations"
path = "tests/declarations.rs"

[[test]]
name = "malformed_tiles"
path = "tests/malformed_tiles.rs"

[[test]]
name = "style_layers"
path = "tests/style_layers.rs"

[[test]]
name = "symbol_style"
path = "tests/symbol_style.rs"

[[test]]
name = "symbols"
path = "tests/symbols.rs"

[lints]
workspace = true
