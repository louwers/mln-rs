[package]
name = "mln-rs-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_render"

[features]
default = ["font-face-shaper"]
# The style's font faces shaped in-process with mln_text's Shaper
# (HarfRust), the default FontFaceEngine (src/text/font_face_engine.rs). The
# workspace's packages depend on this crate without its default features,
# and those that render natively turn this one on: mln-rs-runtime, and the
# facade (mln-rs) with its own `font-face-shaper` feature. The browser build
# (examples/web) leaves it off: HarfRust, skrifa and the glyph rasterizer go
# into its second module, crates/mln_web_shaper, which its map loads only for
# styles with font faces.
font-face-shaper = []
# `bench`, the entry points to internal stages that the benchmarks
# (tools/bench) measure. Not API: hidden from the documentation.
bench = []
# `testing`, what the tests of the crates that add layer and source types
# (mln_layers, mln_sources) drive the engine's parts with. Not API: hidden
# from the documentation.
testing = []

[dependencies]
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
etagere.workspace = true
feature.workspace = true
geo-types.workspace = true
geo-index.workspace = true
geometry.workspace = true
mln_gfx.workspace = true
mln_image.workspace = true
mln_map_types.workspace = true
glam.workspace = true
mln_math.workspace = true
mln_storage.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
mln_wire = { workspace = true, features = ["geo-types", "glam", "parking_lot"] }

[dev-dependencies]
geojson.workspace = true
# The map's transform and sprites, which tests read views and images from.
mln_runtime = { package = "mln-rs-runtime", path = "../mln_runtime", default-features = false, features = [
  "webgpu",
] }
mln_storage = { workspace = true, features = ["stub-file-source"] }
# The backends that the tests compile the engine's programs on.
mln_gl = { package = "mln-rs-gl", path = "../mln_gl" }
mln_webgpu = { package = "mln-rs-webgpu", path = "../mln_webgpu" }
mlt-core.workspace = true
pixelmatch = { package = "mln-rs-pixelmatch", path = "../../vendor/pixelmatch" }
proptest.workspace = true
serde_json.workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
mln_mtl = { package = "mln-rs-mtl", path = "../mln_mtl" }

[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dev-dependencies]
mln_glsl = { package = "mln-rs-glsl", path = "../mln_glsl", features = [
  "variants",
] }

[lints]
workspace = true
