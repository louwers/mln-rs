[package]
name = "mln-rs-actor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_actor"
# The doc comments have no examples to run.
doctest = false

[dependencies]
mln_util.workspace = true
parking_lot.workspace = true

# Port-only: a cooperative scheduler installed for the whole process
# (tests/cooperative.rs), so apart from the tests that start threads.
[[test]]
name = "mln_actor_cooperative"
path = "tests/cooperative.rs"

[lints]
workspace = true
