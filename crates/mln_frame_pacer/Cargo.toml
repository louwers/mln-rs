[package]
name = "mln-rs-frame-pacer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_frame_pacer"
# The doc comments have no examples to run.
doctest = false

[dependencies]
mln_style.workspace = true
parking_lot.workspace = true

# The display links, and the run loop of their thread.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFRunLoop"] }
objc2-foundation = { workspace = true, features = ["NSRunLoop"] }
objc2-quartz-core = { workspace = true, features = [
  "CADisplayLink",
  "CAFrameRateRange",
] }

# The eventfd and timerfd of the choreographer's looper.
[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true

[lints]
workspace = true
