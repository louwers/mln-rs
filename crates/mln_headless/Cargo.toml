[package]
name = "mln-rs-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# The frontend that render-test, the storage tests and the benchmarks draw
# maps with. Not released: mln_runtime's offscreen render session is the
# public way to render without a window.
publish = false
# The one [[test]] below, whose tests/main.rs holds the other files in tests/.
autotests = false

[lib]
name = "mln_headless"
# The doc comments have no examples to run.
doctest = false

[dependencies]
log.workspace = true
# The built-in registrations that the frontend's renderer draws.
mln_builtins.workspace = true
mln_gfx.workspace = true
mln_engine.workspace = true
# The devices and offscreen targets the frontend renders on, of every
# backend.
mln_runtime = { workspace = true, features = ["default", "webgpu"] }
mln_style.workspace = true
parking_lot.workspace = true

# Every integration test, in one binary.
[[test]]
name = "integration"
path = "tests/main.rs"

[dev-dependencies]
geo-types.workspace = true
geojson.workspace = true
glam.workspace = true
image_diff.workspace = true
# system_fonts_test shapes text with the engine's Shaper in-process.
mln_engine = { workspace = true, features = [
  "font-face-shaper",
  "sqlite",
  "stub-file-source",
] }
mln_style = { workspace = true, features = ["dsl"] }
serde_json.workspace = true
# The custom layer test's hosts, which draw with each backend's own API.
mln_webgpu.workspace = true
wgpu.workspace = true

[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dev-dependencies]
mln_vulkan.workspace = true
naga.workspace = true

[target.'cfg(windows)'.dev-dependencies]
mln_d3d12.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dev-dependencies]
glow.workspace = true
khronos-egl.workspace = true
mln_gl.workspace = true

[lints]
workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
mln_mtl.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
