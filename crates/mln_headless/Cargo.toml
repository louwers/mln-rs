[package]
name = "mln-rs-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# The frontend that render-test, the storage tests and the benchmarks draw
# maps with. Not released: mln_runtime's offscreen render session is the
# public way to render without a window.
publish = false
# The one [[test]] below, whose tests/main.rs holds the other files in tests/.
autotests = false

[lib]
name = "mln_headless"
# The doc comments have no examples to run.
doctest = false

[dependencies]
log.workspace = true
mln_gfx.workspace = true
mln_map.workspace = true
mln_renderer.workspace = true
# The devices and offscreen targets the frontend renders on, of every
# backend.
mln_runtime = { workspace = true, features = ["default", "webgpu"] }
mln_text.workspace = true
mln_style.workspace = true
mln_util.workspace = true
parking_lot.workspace = true

# Every integration test, in one binary.
[[test]]
name = "integration"
path = "tests/main.rs"

[dev-dependencies]
# gtest_map's MainResourceLoader and Database file source tests.
feature = { package = "mln-rs-feature", path = "../../vendor/feature" }
geo-types.workspace = true
geojson.workspace = true
glam.workspace = true
mln_image = { package = "mln-rs-image", path = "../mln_image" }
mln_map_types = { package = "mln-rs-map-types", path = "../mln_map_types" }
# system_fonts_test shapes text with mln_text's Shaper in-process.
mln_renderer = { workspace = true, features = ["font-face-shaper"] }
mln_storage = { workspace = true, features = ["sqlite", "stub-file-source"] }
mln_style = { workspace = true, features = ["dsl"] }
mln_text = { package = "mln-rs-text", path = "../mln_text" }
pixelmatch = { package = "mln-rs-pixelmatch", path = "../../vendor/pixelmatch" }
serde_json.workspace = true
# The custom layer test's hosts, which draw with each backend's own API.
mln_webgpu.workspace = true
wgpu.workspace = true

[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dev-dependencies]
mln_vulkan.workspace = true
naga.workspace = true

[target.'cfg(windows)'.dev-dependencies]
mln_d3d12.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dev-dependencies]
glow.workspace = true
khronos-egl.workspace = true
mln_gl.workspace = true

[lints]
workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
mln_mtl.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
