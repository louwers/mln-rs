[package]
name = "mln-rs-webgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_webgpu"
# The doc comments have no examples to run.
doctest = false

[dependencies]
mln_gfx.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
parking_lot.workspace = true
pollster.workspace = true
wgpu.workspace = true

# The shaders natively go to wgpu as naga modules (shader_program.rs).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
wgpu = { workspace = true, features = ["naga-ir"] }

[dev-dependencies]
mln_gfx = { workspace = true, features = ["gpu-conformance"] }

[lints]
workspace = true
