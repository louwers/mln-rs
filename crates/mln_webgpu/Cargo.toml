[package]
name = "mln-rs-webgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_webgpu"
# The doc comments have no examples to run.
doctest = false

[features]
# `bench`, how much work the GPU's pipeline ran, which the benchmarks
# (tools/bench) count. Not API: hidden from the documentation.
bench = []

[dependencies]
log.workspace = true
mln_gfx = { workspace = true, features = ["wgsl"] }
web-time.workspace = true
parking_lot.workspace = true
pollster.workspace = true
wgpu.workspace = true

# The shaders natively go to wgpu as naga modules (shader_program.rs).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
wgpu = { workspace = true, features = ["naga-ir"] }

# `write_buffer_from_host`: bytes in a JS array.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true

# The programs, which the tests compile and draw with, and the conformance
# cases that `WebGpu`'s tests run.
[dev-dependencies]
mln_engine = { package = "mln-rs-engine", path = "../mln_engine", features = [
  "gpu-conformance",
] }

[lints]
workspace = true
