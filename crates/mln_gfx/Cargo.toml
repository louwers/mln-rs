[package]
name = "mln-rs-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_gfx"
# The doc comments have no examples to run.
doctest = false

[dependencies]
bytemuck.workspace = true
foldhash.workspace = true
log.workspace = true
mln_util.workspace = true
# The windows of window targets (`Window`).
raw-window-handle.workspace = true
slotmap.workspace = true
thiserror.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# `Gpu::write_buffer_from_host`: bytes in a JS array.
js-sys.workspace = true

[features]
# The shading languages whose text the programs keep
# (`shaders::source::Sources`): each backend turns on the language it
# compiles, and a build without a language's feature leaves its text out.
wgsl = []
msl = []
glsl = []
glsl-es = []

[lints]
workspace = true
