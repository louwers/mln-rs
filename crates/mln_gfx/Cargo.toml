[package]
name = "mln-rs-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_gfx"

[features]
# The programs' sources in each shading language that a backend of the build
# compiles (`Sources`): WGSL for mln_webgpu, MSL for mln_mtl, GLSL ES for
# mln_gl, and the GLSL of mln_glsl for mln_vulkan and mln_d3d12. Each backend
# turns on its own, so a build carries only its backends' shaders.
wgsl = []
msl = []
glsl-es = []
glsl = []

[dependencies]
bytemuck.workspace = true
mln_util.workspace = true
# The windows of window targets (`Window`).
raw-window-handle.workspace = true
mln_wire.workspace = true
slotmap.workspace = true
thiserror.workspace = true

[lints]
workspace = true
