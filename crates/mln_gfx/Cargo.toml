[package]
name = "mln-rs-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_gfx"
# The doc comments have no examples to run.
doctest = false

[dependencies]
bytemuck.workspace = true
geometry.workspace = true
mln_style_types.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
serde.workspace = true

# Ports test/renderer/shader_registry.test.cpp
[[test]]
name = "shader_registry_test"
path = "tests/shader_registry.rs"

# gtests-core: test/renderer/renderable.test.cpp.
[[test]]
name = "gtest_renderable"
path = "tests/gtest_renderable.rs"

# gtests-core: test/renderer/backend_scope.test.cpp (OpenGL-only in C++; the
# BackendScope logic it tests is backend-independent).
[[test]]
name = "gtest_backend_scope"
path = "tests/gtest_backend_scope.rs"

# gtests-core: test/renderer/vulkan_acquire.test.cpp: backend-specific,
# an ignored placeholder.
[[test]]
name = "gtest_vulkan_acquire"
path = "tests/gtest_vulkan_acquire.rs"

# Ports test/util/hash.test.cpp (marker `// gtest: Group.Name`).
[[test]]
name = "gtest_hash"
path = "tests/gtest_hash.rs"

[lints]
workspace = true
