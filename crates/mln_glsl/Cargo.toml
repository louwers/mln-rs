[package]
name = "mln-rs-glsl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_glsl"
# The doc comments have no examples to run.
doctest = false

# The crate is empty on Apple platforms and in the browser build.
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
mln_gfx = { workspace = true, features = ["glsl"] }
naga.workspace = true

# The programs, which the tests compile.
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dev-dependencies]
mln_builtins = { package = "mln-rs-builtins", path = "../mln_builtins", features = [
  "gpu-conformance",
] }
mln_engine = { package = "mln-rs-engine", path = "../mln_engine" }

[features]
# `variants`, the sets of defines that the backends' tests compile each
# program with.
variants = []

[lints]
workspace = true
