[package]
name = "mln-rs-gl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below.
autotests = false

[lib]
name = "mln_gl"
# The doc comments have no examples to run.
doctest = false

[dependencies]
bytemuck.workspace = true
glow.workspace = true
mln_gfx.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
parking_lot.workspace = true

# The headless backend's context: EGL, whose library is loaded at run time.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
khronos-egl.workspace = true

# The window backend: libwayland-egl, loaded at run time, for a Wayland
# surface. The exported ring: libgbm, loaded at run time, and the system calls
# that allocate dmabufs.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
libloading.workspace = true

# The WGL contexts on Windows, and the windows they are current on.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
libc.workspace = true
raw-window-handle.workspace = true

# The canvas backend's context: the browser's WebGL2.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "WebGl2RenderingContext", "WebGlContextAttributes"] }

# Compiles and links every GLSL program, in both projection variants, and
# checks its uniform blocks against the UBOs the renderer writes.
[[test]]
name = "glsl_compile_test"
path = "tests/glsl_compile_test.rs"

# The background shader end to end on the drawable path (after
# crates/mln_webgpu/tests/background_test.rs): an offscreen target, a
# DrawableBuilder drawable in a TileLayerGroup, tile clipping masks,
# rendered into the offscreen target and read back.
[[test]]
name = "background_test"
path = "tests/background_test.rs"

# A drawable's vertex arrays follow its index vector to a new buffer, though
# the new buffer may have the GL name of the one it replaced.
[[test]]
name = "drawable_test"
path = "tests/drawable_test.rs"

[lints]
workspace = true
