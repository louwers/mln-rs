[package]
name = "mln-rs-gl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_gl"
# The doc comments have no examples to run.
doctest = false

[features]
# `bench`, how long the GPU took, which the benchmarks (tools/bench) measure.
# Not API: hidden from the documentation.
bench = []

[dependencies]
bytemuck.workspace = true
glow.workspace = true
log.workspace = true
mln_gfx = { workspace = true, features = ["glsl-es"] }
parking_lot.workspace = true

# The headless backend's context: EGL, whose library is loaded at run time.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
khronos-egl.workspace = true

# The window backend: libwayland-egl, loaded at run time, for a Wayland
# surface. The exported ring: libgbm, loaded at run time, and the system calls
# that allocate dmabufs.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
libloading.workspace = true

# The WGL contexts on Windows, and the windows they are current on.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
libc.workspace = true
raw-window-handle.workspace = true

# The canvas backend's context: the browser's WebGL2.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlContextAttributes",
] }

# The programs, which the tests compile and draw with, and the conformance
# cases that `GlGpu`'s tests run.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mln_engine = { package = "mln-rs-engine", path = "../mln_engine", features = [
  "gpu-conformance",
] }

[lints]
workspace = true
