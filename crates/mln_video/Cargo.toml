[package]
name = "mln-rs-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_video"
# The doc comments have no examples to run.
doctest = false

[dependencies]
mln_gfx.workspace = true
mln_storage.workspace = true
mln_util.workspace = true
parking_lot.workspace = true

# GStreamer, loaded at run time.
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android"), not(target_family = "wasm")))'.dependencies]
libloading.workspace = true

# The browser's players (`WebPlayers`): a host's JS object, and the frames'
# `ImageBitmap`s, read through a canvas where a renderer refuses them.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
mln_actor.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "ImageBitmap",
  "ImageData",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
] }

# Android's player: the NDK's media API, loaded at run time.
[target.'cfg(target_os = "android")'.dependencies]
libloading.workspace = true

[lints]
workspace = true
