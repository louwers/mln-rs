[package]
name = "mln-rs-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_storage"
# The doc comments have no examples to run.
doctest = false

[dependencies]
feature.workspace = true
geojson.workspace = true
mln_actor.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
pmtiles.workspace = true
rapidjson.workspace = true
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true

[features]
default = ["sqlite"]
# SQLite: OfflineDatabase, the Database file source (the ambient cache and
# offline regions, under ResourceOptions::cache_path) and the MBTiles file
# source. examples/web leaves it out and relies on the browser's HTTP cache,
# like MapLibre GL JS. Without it, the ResourceLoader has neither file
# source, so it serves no cache-only requests and no mbtiles:// URLs (as the
# C++ MainResourceLoader without them).
sqlite = ["dep:rusqlite"]

# The HTTP transport: the platform's HTTP stack where it has one (NSURLSession
# on Apple platforms, the browser's fetch on wasm), else ureq, with the
# system's trust store.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ureq = { workspace = true, features = ["gzip", "native-tls-no-default"] }

[target.'cfg(not(any(target_family = "wasm", target_vendor = "apple", target_os = "windows")))'.dependencies]
rustls.workspace = true
ureq = { workspace = true, features = ["gzip", "platform-verifier", "rustls-no-provider"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

# Ports test/util/http_timeout.test.cpp (marker `// gtest: Group.Name`).
[[test]]
name = "gtest_http_timeout"
path = "tests/gtest_http_timeout.rs"

# test/storage/sync_file_source.test.cpp: needs a Map (mln_map,
# mln_headless depend on this crate, so not in the unit tests).
[[test]]
name = "sync_file_source_test"
path = "tests/sync_file_source.rs"

[dev-dependencies]
httpmock.workspace = true
mln_headless = { package = "mln-rs-headless", path = "../mln_headless" }
mln_map = { package = "mln-rs-map", path = "../mln_map" }
mln_test_server = { package = "mln-rs-test-server", path = "../../tools/test-server" }

[lints]
workspace = true
