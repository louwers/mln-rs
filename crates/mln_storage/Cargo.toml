[package]
name = "mln-rs-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_storage"
# The doc comments have no examples to run.
doctest = false

[dependencies]
feature.workspace = true
geojson.workspace = true
mln_actor.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
pmtiles.workspace = true
rapidjson.workspace = true
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true

[features]
default = ["sqlite"]
# SQLite: OfflineDatabase, the Database file source (the ambient cache and
# offline regions, under ResourceOptions::cache_path) and the MBTiles file
# source. examples/web leaves it out and relies on the browser's HTTP cache,
# like MapLibre GL JS. Without it, the ResourceLoader has neither file
# source, so it serves no cache-only requests and no mbtiles:// URLs (as the
# C++ MainResourceLoader without them).
sqlite = ["dep:rusqlite"]

# ureq's TLS (rustls, ring) doesn't build for wasm, where the browser's fetch
# is the transport.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

# Ports test/util/http_timeout.test.cpp (marker `// gtest: Group.Name`).
[[test]]
name = "gtest_http_timeout"
path = "tests/gtest_http_timeout.rs"

# test/storage/sync_file_source.test.cpp: needs a Map (mln_map,
# mln_headless depend on this crate, so not in the unit tests).
[[test]]
name = "sync_file_source_test"
path = "tests/sync_file_source.rs"

[dev-dependencies]
mln_headless = { package = "mln-rs-headless", path = "../mln_headless" }
mln_map = { package = "mln-rs-map", path = "../mln_map" }
mln_test_server = { package = "mln-rs-test-server", path = "../../tools/test-server" }

[lints]
workspace = true
