[package]
name = "mln-rs-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_storage"
# The doc comments have no examples to run.
doctest = false

[dependencies]
bytes.workspace = true
feature.workspace = true
geo-types.workspace = true
geojson.workspace = true
log = { workspace = true, features = ["kv"] }
mln_util.workspace = true
mln_vec_map.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
pmtiles.workspace = true
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["sqlite"]
# SQLite: OfflineDatabase, the Database file source (the ambient cache and
# offline regions, under ResourceOptions::cache_path) and the MBTiles file
# source. examples/web leaves it out and relies on the browser's HTTP cache,
# like MapLibre GL JS. Without it, the ResourceLoader has neither file
# source, so it serves no cache-only requests and no mbtiles:// URLs (as the
# C++ MainResourceLoader without them).
sqlite = ["dep:rusqlite"]
# `simulated_network`, the online file source over a transport and a clock
# of the caller's, for the benchmarks (tools/bench). The crate's own tests
# build it without the feature. Not API: hidden from the documentation.
bench = ["mln_util/bench"]
# StubFileSource, the file source that the tests of mln_storage's dependents
# answer requests with.
stub-file-source = []

# Apple's platforms come with SQLite, and an app that links its own copy uses
# its filesystem probes, which Apple counts as disk-space APIs whose use an
# app's privacy manifest must give a reason for. Elsewhere SQLite is built in.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, optional = true, features = ["bundled"] }

# The HTTP transport: the platform's HTTP stack where it has one (NSURLSession
# on Apple platforms, HttpURLConnection on Android, the browser's fetch on
# wasm), else ureq, with the system's trust store.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ureq = { workspace = true, features = ["gzip", "native-tls-no-default"] }

[target.'cfg(not(any(target_family = "wasm", target_vendor = "apple", target_os = "windows", target_os = "android")))'.dependencies]
rustls.workspace = true
ureq = { workspace = true, features = [
  "gzip",
  "platform-verifier",
  "rustls-no-provider",
] }

# HttpURLConnection and the app's assets, through the app's Java VM.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
mln_style.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[dev-dependencies]
httpmock.workspace = true
# `Queue::run_once_at`, which `simulated_network` runs its queue with.
mln_util = { workspace = true, features = ["bench"] }

[lints]
workspace = true
