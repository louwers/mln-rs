[package]
name = "mln-rs-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_storage"
# The doc comments have no examples to run.
doctest = false

[dependencies]
feature.workspace = true
geojson.workspace = true
mln_actor.workspace = true
mln_platform_default_image.workspace = true
mln_util.workspace = true
pmtiles.workspace = true
rapidjson.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

# ureq's TLS (rustls, ring) doesn't build for wasm (the browser), where the
# host supplies the HTTP transport instead.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq.workspace = true

# Ports test/util/http_timeout.test.cpp (marker `// gtest: Group.Name`).
[[test]]
name = "gtest_http_timeout"
path = "tests/gtest_http_timeout.rs"

# test/storage/sync_file_source.test.cpp: needs a Map (mln_map,
# mln_platform_default depend on this crate, so not in the unit tests).
[[test]]
name = "sync_file_source_test"
path = "tests/sync_file_source.rs"

[dev-dependencies]
mln_map = { package = "mln-rs-map", path = "../mln_map" }
mln_platform_default = { package = "mln-rs-platform-default", path = "../mln_platform_default" }
mln_test_server = { package = "mln-rs-test-server", path = "../../tools/test-server" }

[lints]
workspace = true
