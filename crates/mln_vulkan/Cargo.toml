[package]
name = "mln-rs-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_vulkan"
# The doc comments have no examples to run.
doctest = false

[features]
# `bench`, how long the GPU took, which the benchmarks (tools/bench) measure.
# Not API: hidden from the documentation.
bench = []

# The crate is empty on Apple platforms and in the browser build.
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
ash.workspace = true
bytemuck.workspace = true
gpu-allocator.workspace = true
log.workspace = true
mln_gfx.workspace = true
mln_glsl.workspace = true
naga = { workspace = true, features = ["spv-out"] }
parking_lot.workspace = true

# The NT handles of D3D12 fences, and the D3D11 textures of exported rings.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# Polls the host's sync files.
[target.'cfg(all(unix, not(any(target_vendor = "apple", target_family = "wasm"))))'.dependencies]
libc.workspace = true

# The programs and the conformance cases that `VulkanGpu`'s tests run, and
# the sets of defines they compile the programs with.
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dev-dependencies]
mln_glsl = { workspace = true, features = ["variants"] }
mln_engine = { package = "mln-rs-engine", path = "../mln_engine", features = [
  "gpu-conformance",
] }

[lints]
workspace = true
