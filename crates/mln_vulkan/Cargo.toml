[package]
name = "mln-rs-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true
# The [[test]]s below.
autotests = false

[lib]
name = "mln_vulkan"
# The doc comments have no examples to run.
doctest = false

# The crate is empty on Apple platforms and in the browser build.
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
ash.workspace = true
bytemuck.workspace = true
gpu-allocator.workspace = true
mln_gfx.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
naga.workspace = true
parking_lot.workspace = true

# The NT handles of D3D12 fences, and the D3D11 textures of exported rings.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# Polls the host's sync files.
[target.'cfg(all(unix, not(any(target_vendor = "apple", target_family = "wasm"))))'.dependencies]
libc.workspace = true

[lints]
workspace = true
