[package]
name = "mln-rs-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below.
autotests = false

[lib]
name = "mln_vulkan"
# The doc comments have no examples to run.
doctest = false

# The crate is empty on Apple platforms and in the browser build.
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
ash.workspace = true
bytemuck.workspace = true
gpu-allocator.workspace = true
mln_gfx.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
naga.workspace = true
parking_lot.workspace = true

# The NT handles of D3D12 fences, and the D3D11 textures of exported rings.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# Polls the host's sync files.
[target.'cfg(all(unix, not(any(target_vendor = "apple", target_family = "wasm"))))'.dependencies]
libc.workspace = true

# Compiles every GLSL source to SPIR-V in both projection variants, and
# checks the bindings each one declares against the descriptor set layouts.
[[test]]
name = "glsl_compile_test"
path = "tests/glsl_compile_test.rs"

# The background shader end to end on the drawable path (after
# crates/mln_webgpu/tests/background_test.rs): an offscreen target, a
# DrawableBuilder drawable in a TileLayerGroup, tile clipping masks,
# rendered into the offscreen target and read back.
[[test]]
name = "background_test"
path = "tests/background_test.rs"

# The window backend on a headless surface (VK_EXT_headless_surface): frames
# through the swapchain, resizes, the overlay, readback, two frames in
# flight.
[[test]]
name = "surface_test"
path = "tests/surface_test.rs"

[lints]
workspace = true
