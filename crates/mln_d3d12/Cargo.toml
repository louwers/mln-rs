[package]
name = "mln-rs-d3d12"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_d3d12"
# The doc comments have no examples to run.
doctest = false

[features]
# `bench`, how long the GPU took, which the benchmarks (tools/bench) measure.
# Not API: hidden from the documentation.
bench = []

# The crate is empty except on Windows. DXC, which compiles its HLSL, loads at
# run time.
[target.'cfg(windows)'.dependencies]
mln_gfx.workspace = true
mln_glsl.workspace = true
gpu-allocator = { workspace = true, features = ["d3d12"] }
naga = { workspace = true, features = ["hlsl-out"] }
mln_util.workspace = true
parking_lot.workspace = true
windows = { workspace = true, features = [
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Direct3D_Dxc",
  "Win32_Graphics_DirectComposition",
  "Win32_System_Threading",
] }

# The conformance suite that `D3d12Gpu`'s tests run, and the sets of defines
# they compile the programs with.
[target.'cfg(windows)'.dev-dependencies]
# The layer types' programs and the conformance cases, which the tests compile
# and draw.
mln_layers = { package = "mln-rs-layers", path = "../mln_layers", features = [
  "glsl",
  "gpu-conformance",
] }
mln_glsl = { workspace = true, features = ["variants"] }

[lints]
workspace = true
