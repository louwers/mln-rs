[package]
name = "mln-rs-system-fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
name = "mln_system_fonts"
# The doc comments have no examples to run.
doctest = false

[dependencies]
mln_text.workspace = true
mln_util.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
fontdb.workspace = true
memmap2.workspace = true
skrifa.workspace = true
sys-locale.workspace = true

# fontconfig, and Android's font matcher, loaded at run time.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
libloading.workspace = true

# The app's languages, from Java.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

# CoreText.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { workspace = true, features = [
  "CFArray",
  "CFData",
  "CFString",
] }
objc2-core-text = { workspace = true }

# DirectWrite.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_DirectWrite"] }
# For the code that windows' #[implement] generates.
windows-core.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
