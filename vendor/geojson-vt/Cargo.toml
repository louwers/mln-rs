[package]
name = "mln-rs-geojson-vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license = "ISC"
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "geojson_vt"
# The doc comments have no examples to run.
doctest = false

[dependencies]
feature.workspace = true
geojson.workspace = true
geometry.workspace = true
libstdcxx.workspace = true

# The fixture-free tests of geojson-vt-cpp/test/test.cpp.
[[test]]
name = "geojsonvt_test"
path = "tests/geojsonvt.rs"

# The fixture tests of geojson-vt-cpp/test/test.cpp, read in place.
[[test]]
name = "geojsonvt_fixtures_test"
path = "tests/fixtures.rs"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
