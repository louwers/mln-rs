[package]
name = "mln-rs-earcut"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license = "ISC"
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "earcut"
# The doc comments have no examples to run.
doctest = false

[dependencies]
geometry.workspace = true
libstdcxx.workspace = true

# Port of earcut.hpp/test/test.cpp over its fixtures, read in place.
[[test]]
name = "earcut_fixtures_test"
path = "tests/fixtures.rs"

[dev-dependencies]
earcut_test_fixtures = { package = "mln-rs-earcut-test-fixtures", path = "test_fixtures" }

[lints]
workspace = true
