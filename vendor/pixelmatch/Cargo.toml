[package]
name = "mln-rs-pixelmatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license = "ISC"
repository.workspace = true
include.workspace = true
# Only the tests use it (and tools/render-test); published for
# mln-rs-render-test and the difftests (louwers/mln-rs-difftests).
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "pixelmatch"
# The doc comments have no examples to run.
doctest = false

# Port of pixelmatch-cpp/test/test.cpp over its fixtures, read in place.
[[test]]
name = "pixelmatch_fixtures_test"
path = "tests/fixtures.rs"

[lints]
workspace = true
