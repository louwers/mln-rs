# The port and its crates.io release (RELEASING.md). Each library under
# crates/ and vendor/ is the package mln-rs-<name> (library name unchanged,
# so the code still says `mln_util::`), and the package here, mln-rs,
# re-exports them all. Users depend on mln-rs only. The differential tests
# against the C++ core (louwers/mln-rs-difftests) test the released crates.
[workspace]
resolver = "3"
# The packages with `publish = false` are test helpers or unused by mln-rs.
members = [
    "crates/*",
    "examples/*",
    "tools/bench",
    "tools/c-abi-gen",
    "tools/expression-test",
    "tools/render-test",
    "tools/style-codegen",
    "tools/test-server",
    "vendor/*",
]

[workspace.package]
# Every package is published at this version. To release, bump it here and
# in the in-repo [workspace.dependencies] below (RELEASING.md).
version = "0.0.11"
edition = "2024"
# The oldest Rust the packages build with (mlt-core 0.22 needs 1.98). CI's
# msrv job builds the workspace with it.
rust-version = "1.98"
description = "Part of mln-rs, a Rust port of the MapLibre Native map rendering core. Depend on mln-rs instead."
license = "BSD-2-Clause"
repository = "https://github.com/louwers/mln-rs"
# `/LICENSE*` ships each package's license files. A published package whose
# code is, all or in part, under the root license has a LICENSE.md symlink to
# it, which `cargo package` archives as a file. The ports of other projects
# also ship their own license files.
include = ["/src", "/tests", "/LICENSE*"]
# The libraries' keywords and categories on crates.io. mln-rs has its own.
keywords = ["maplibre", "map"]
categories = ["graphics", "science::geo"]

[workspace.dependencies]
# In-repo libraries. The exact version keeps a release's packages together.
feature = { package = "mln-rs-feature", path = "vendor/feature", version = "=0.0.11" }
geojson = { package = "mln-rs-geojson", path = "vendor/geojson", version = "=0.0.11" }
geojson_vt = { package = "mln-rs-geojson-vt", path = "vendor/geojson-vt", version = "=0.0.11" }
geometry = { package = "mln-rs-geometry", path = "vendor/geometry", version = "=0.0.11" }
kdbush = { package = "mln-rs-kdbush", path = "vendor/kdbush", version = "=0.0.11" }
mln_actor = { package = "mln-rs-actor", path = "crates/mln_actor", version = "=0.0.11" }
mln_conversion = { package = "mln-rs-conversion", path = "crates/mln_conversion", version = "=0.0.11" }
mln_expression = { package = "mln-rs-expression", path = "crates/mln_expression", version = "=0.0.11" }
mln_gestures = { package = "mln-rs-gestures", path = "crates/mln_gestures", version = "=0.0.11" }
mln_gfx = { package = "mln-rs-gfx", path = "crates/mln_gfx", version = "=0.0.11" }
mln_gl = { package = "mln-rs-gl", path = "crates/mln_gl", version = "=0.0.11" }
mln_headless = { package = "mln-rs-headless", path = "crates/mln_headless", version = "=0.0.11" }
mln_image = { package = "mln-rs-image", path = "crates/mln_image", version = "=0.0.11" }
mln_map = { package = "mln-rs-map", path = "crates/mln_map", version = "=0.0.11" }
mln_map_types = { package = "mln-rs-map-types", path = "crates/mln_map_types", version = "=0.0.11" }
mln_math = { package = "mln-rs-math", path = "crates/mln_math", version = "=0.0.11" }
mln_mtl = { package = "mln-rs-mtl", path = "crates/mln_mtl", version = "=0.0.11" }
# Without its default feature, the in-process font-face shaper: the packages
# that render turn it on (crates/mln_renderer/Cargo.toml).
mln_renderer = { package = "mln-rs-renderer", path = "crates/mln_renderer", version = "=0.0.11", default-features = false }
# Without its backends (its default features) unless a package asks for
# them, so that a browser build of mln_c carries one.
mln_runtime = { package = "mln-rs-runtime", path = "crates/mln_runtime", version = "=0.0.11", default-features = false }
mln_sprite = { package = "mln-rs-sprite", path = "crates/mln_sprite", version = "=0.0.11" }
# Without SQLite (its `sqlite` feature) unless a package asks for it, so
# that examples/web leaves it out.
mln_storage = { package = "mln-rs-storage", path = "crates/mln_storage", version = "=0.0.11", default-features = false }
mln_storage_offline = { package = "mln-rs-storage-offline", path = "crates/mln_storage_offline", version = "=0.0.11" }
mln_style = { package = "mln-rs-style", path = "crates/mln_style", version = "=0.0.11" }
mln_style_types = { package = "mln-rs-style-types", path = "crates/mln_style_types", version = "=0.0.11" }
mln_text = { package = "mln-rs-text", path = "crates/mln_text", version = "=0.0.11" }
mln_tile = { package = "mln-rs-tile", path = "crates/mln_tile", version = "=0.0.11" }
mln_tile_id = { package = "mln-rs-tile-id", path = "crates/mln_tile_id", version = "=0.0.11" }
mln_util = { package = "mln-rs-util", path = "crates/mln_util", version = "=0.0.11" }
mln_vec_map = { package = "mln-rs-vec-map", path = "crates/mln_vec_map", version = "=0.0.11" }
mln_vulkan = { package = "mln-rs-vulkan", path = "crates/mln_vulkan", version = "=0.0.11" }
mln_web_host = { package = "mln-rs-web-host", path = "crates/mln_web_host", version = "=0.0.11" }
mln_webgpu = { package = "mln-rs-webgpu", path = "crates/mln_webgpu", version = "=0.0.11" }
pixelmatch = { package = "mln-rs-pixelmatch", path = "vendor/pixelmatch", version = "=0.0.11" }
polylabel = { package = "mln-rs-polylabel", path = "vendor/polylabel", version = "=0.0.11" }
render_test = { package = "mln-rs-render-test", path = "tools/render-test", version = "=0.0.11" }
shelf_pack = { package = "mln-rs-shelf-pack", path = "vendor/shelf-pack", version = "=0.0.11" }
style_codegen = { package = "mln-rs-style-codegen", path = "tools/style-codegen", version = "=0.0.11" }
supercluster = { package = "mln-rs-supercluster", path = "vendor/supercluster", version = "=0.0.11" }

# Third-party crates, for both builds (Cargo.lock pins their versions). Only
# add a crate when nothing in the C++ core has to be ported for it.
#
# min_const_generics: Pod for any array length (mln_gfx's UBOs).
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
# The buffers that pmtiles reads headers and directories from.
bytes = { version = "1.10.1" }
# CSS colors other than oklch() (mln_util's Color::parse), in place of a port
# of the C++ core's vendored csscolorparser: on every color string of the
# expression and render tests, Color::parse gives the port's result exactly.
csscolorparser = { version = "0.9.1" }
# zlib-rs backend: pure Rust, so neither native nor wasm32 builds need a C
# compiler or a system zlib.
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
# examples/desktop: finds the system fonts it gives the map as fallback font
# faces, and reads their names and coverage through short-lived maps.
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap"] }
# crates/mln_gl: OpenGL ES 3.0 and WebGL2 through one set of bindings.
glow = { version = "0.17.0" }
harfrust = { version = "0.15.0" }
# HTTP dates (Expires, Last-Modified, Retry-After): mln_util's parse_http_date.
httpdate = { version = "1.0.3" }
# The HTTP test server of the tests (tools/test-server).
httpmock = { version = "0.9.0", default-features = false }
# decodeWEBP (platform/default/src/mln/util/webp_reader.cpp); pure Rust.
image-webp = { version = "0.2.4" }
# crates/mln_gl's headless backend: an EGL context. `dynamic` loads libEGL at
# run time, so builds need no system development packages.
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
# tools/bench: the process's CPU time, which std lacks: clock_gettime on Unix,
# GetProcessTimes on Windows.
libc = { version = "0.2.191" }
# tools/bench's GetProcessTimes, and crates/mln_gl's WGL contexts, their pixel
# formats and the hidden windows they are current on.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# crates/mln_gl's window backend: loads libwayland-egl at run time.
libloading = { version = "0.8.9" }
# Polygon triangulation (mln_renderer's fills and fill extrusions), a port of
# earcut.js, the triangulation GL JS uses.
earcut = { version = "0.4.5" }
# MLT decoding: the Rust implementation of the MapLibre Tile spec, instead of
# porting the C++ decoder (vendor/maplibre-tile-spec/cpp). Assumed correct
# (user decision, 2026-11-04); the differential test against the C++ decoder
# (//difftest/mlt) was removed with that decision.
mlt-core = { version = "0.22.1" }
# The even-odd union that repairs the polygons of version 1 vector tiles,
# instead of porting wagyu. mlt-core already depends on it through geo.
i_overlay = { version = "4.5.2", default-features = false }
# MVT decoding, instead of porting the C++ reader (vendor/vector-tile).
fast-mvt = { version = "0.7.3", default-features = false, features = ["reader"] }
# Glyph PBFs: fast-mvt's protobuf runtime, whose wire format functions read
# them instead of a port of protozero.
buffa = { version = "0.9.2", default-features = false }
# The `distance` expression's distances (mln_expression), in place of a port
# of the C++ core's vendored cheap-ruler-cpp: the same WGS84 formulas, with
# its arithmetic in a different order, so a distance can differ from the C++
# one in the last bits.
cheap-ruler = { version = "0.4.0" }
# PMTiles archives (mln_storage's PMTilesFileSource): their header,
# directories and tile IDs, in place of a port of the C++ core's vendored
# pmtiles.hpp. The archive reading stays the port's.
pmtiles = { version = "0.28.1", default-features = false }
# Locks without poisoning: a panic while a lock is held doesn't make every
# later lock panic. wgpu already depends on it.
parking_lot = { version = "0.12.5", features = ["serde"] }
png = { version = "0.18.1" }
pollster = { version = "1.0.1" }
# The messages between a tile and its worker in another wasm instance
# (mln_renderer's tile/worker_codec), and the tests of the types they carry:
# a compact serde format.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
# The difftests' property tests.
proptest = { version = "1.12.0" }
# The windows of window targets (mln_gfx::Window), as winit and others hand them out.
raw-window-handle = { version = "0.6.2" }
regex = { version = "1.13.1" }
# tools/render-test's JSON (with serde_json), and the types that cross to a
# tile worker in another wasm instance (rc: the values behind their `Arc`s).
serde = { version = "1.0.229", features = ["derive", "rc"] }
# The same engine as the C++ core's vendored SQLite, built from source like it
# where the platform has none (crates/mln_storage).
rusqlite = "0.41.1"
# preserve_order: objects keep their members in document order, which the
# style parser and the order of expression errors rely on.
# float_roundtrip: correctly rounded float parsing (the default parser can be
# off by an ULP).
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
skrifa = { version = "0.49.0" }
# tools/render-test's --shuffle order for a --seed. tempfile already builds it.
fastrand = { version = "2.5.0" }
# Tests' temporary directories, which they don't share with test runs at the same time.
tempfile = "3.27.0"
# Derives the libraries' `Display` and `std::error::Error` impls.
thiserror = "2.0.21"
# Candidate for ICU's ubidi (platform/default/src/mln/text/bidi.cpp); kept only
# if //difftest/shaping shows it matches ICU on the test corpus.
unicode-bidi = { version = "0.3.18" }
# General_Category (mln_text's script runs, mln_util's i18n), in the Unicode
# version of harfrust's own tables.
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
# The locale-sensitive expressions (collator, resolved-locale, number-format)
# on platforms without their own locale services (mln_expression's locale):
# ICU4X, with the CLDR data it compiles in. icu_experimental has CLDR's
# currency patterns and symbols; it requires its own ICU4X release (`~2.4`).
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
icu_collator = { version = "2.4.0" }
icu_decimal = { version = "2.4.0" }
icu_experimental = { version = "=0.7.0" }
icu_locale = { version = "2.4.0" }
icu_provider = { version = "2.4.0" }
writeable = { version = "0.6.4" }
# WOFF and WOFF2 font faces (mln_text's woff): pure Rust, no unsafe. Only its
# Brotli decoder: mln_text hands it the workspace's flate2 for WOFF's zlib.
wuff = { version = "0.2.10", default-features = false, features = ["brotli"] }
# decodeJPEG (platform/default/src/mln/util/jpeg_reader.cpp) natively; pure
# Rust. The browser build decodes JPEG with the browser instead.
zune-jpeg = { version = "0.5.15" }
# HTTP for the online file source where the platform has no HTTP stack of
# its own (the C++ default platform uses curl). mln_storage picks the TLS
# features per target.
ureq = { version = "3.5.1", default-features = false }
# ureq's rustls, with ring's cryptography (ureq's own `rustls` feature would
# also bring webpki-roots).
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
# Android: the certificate verifier that ureq's `platform-verifier` feature
# uses, which mln_android_init() points at the app's Java VM, through JNI.
rustls-platform-verifier = { version = "0.7.1", default-features = false }
jni = { version = "0.22.4", default-features = false }
# Apple platforms: Foundation's NSURLSession for the online file source.
block2 = { version = "0.6.2" }
objc2 = { version = "0.6.5" }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSData",
    "NSDate",
    "NSError",
    "NSObjCRuntime",
    "NSOperation",
    "NSString",
    "NSURL",
    "NSURLCache",
    "NSURLError",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
] }
# Apple platforms: the Metal backend (crates/mln_mtl) and its CAMetalLayer.
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLArgument",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDepthStencil",
    "MTLDevice",
    "MTLDrawable",
    "MTLEvent",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
# Apple platforms: the IOSurfaces of the Metal backend's exported rings.
objc2-io-surface = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "objc2-core-foundation",
    "IOSurfaceRef",
    "IOSurfaceTypes",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-metal",
    "CALayer",
    "CAMetalLayer",
] }
# examples/web: the browser's API through wasm-bindgen (whose CLI must be
# this exact version).
js-sys = { version = "0.3.107" }
wasm-bindgen = { version = "=0.2.130" }
wasm-bindgen-futures = { version = "0.4.80" }
web-sys = { version = "0.3.107", features = [
    "Blob", "Headers", "ImageBitmap", "ImageData", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "Request",
    "RequestInit", "RequestRedirect", "Response", "ResponseType", "TextMetrics", "console",
] }
# std::time's clocks, which panic on wasm32-unknown-unknown (mln_util::time):
# performance.now() and Date.now() there, std::time everywhere else.
web-time = { version = "1.1.0" }
# Ports the C++ WebGPU backend (src/mln/webgpu, which runs on Dawn or
# wgpu-native) onto the Rust implementation of the same API: Vulkan, Metal
# and DX12 natively (wgpu builds each only where it runs), and on
# wasm32-unknown-unknown the browser's WebGPU (examples/web). Not its
# default GLES backend, which nothing selects.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "metal", "vulkan", "webgpu"] }
# The Vulkan backend (crates/mln_vulkan), where the C++ one uses vulkan-hpp,
# VulkanMemoryAllocator and glslang: the bindings and the allocator that
# wgpu's own Vulkan backend uses, and naga's GLSL front end and SPIR-V back
# end, at wgpu's versions. naga's GLSL front end needs a module that only
# `wgsl-in` or `spv-in` builds.
ash = { version = "0.38.0" }
# The Vulkan backend on Windows: its D3D12 fences, and the D3D11 textures of
# its exported rings on the DXGI adapter of the Vulkan GPU, at wgpu's version.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_LibraryLoader",
] }
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
naga = { version = "30.0.1", features = ["glsl-in", "spv-out", "wgsl-in"] }
# examples/desktop: the CAMetalLayer of the window's view on macOS.
raw-window-metal = { version = "1.1.0" }
# examples/desktop's window and input. On Linux it loads the X11 and Wayland
# libraries at run time (`wayland-dlopen`, x11-dl), so builds need no system
# development packages.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
# examples/desktop's controls over the map: egui, drawn with the map's wgpu
# device or in its OpenGL ES context, its input from winit. `links` opens the
# attribution's links.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui_glow = { version = "0.37.0", default-features = false }
# The backends' SVG logos in examples/desktop's controls.
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["links", "wayland", "x11"] }

# Lints for every package (`[lints] workspace = true`): clippy's default and
# pedantic sets, with warnings denied in CI (the `lint` job). The pedantic
# lints below are off.
[workspace.lints.rust]
# No `unsafe` outside FFI. The FFI modules allow it.
unsafe_code = "deny"
# A `pub` item that no other crate can reach is `pub(crate)`, so that each
# crate's public API is what its dependents use.
unreachable_pub = "warn"
# Casts to the type a value already has or coerces to, and paths that spell
# out a module whose item is in scope.
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The manifests: package metadata, feature names and dependency declarations.
# A workspace this size can't avoid two versions of a crate among its
# dependencies' dependencies.
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
# Development macros that shouldn't be merged: `dbg!` prints to stderr, and
# `todo!` and `unimplemented!` panic.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# `Arc::clone(&x)` and `Rc::clone(&x)` for a new reference to the same value,
# so that `x.clone()` is a copy of a value.
clone_on_ref_ptr = "warn"
# Their fixes would change what the code does: numeric conversions that
# truncate, wrap or saturate on purpose, where `try_from` would fail
# instead, and exact float comparisons, which an epsilon would loosen.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
# `assert!` for `if c { panic!(..) }` would take the panic out of
# tools/ratchet's count of library panic sites.
manual_assert = "allow"
# Their fixes are redesigns: functions split by length, flags turned into
# enums, coordinates and their deltas (`x`, `dx`, `x0`) renamed apart.
fn_params_excessive_bools = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Not worth their noise: `x.clone_from(&y)` and `"text".clone_into(&mut x)`
# for every assignment of a copy, `# Errors` and `# Panics` sections on every
# function that can, maps generic over their hasher, and fields that repeat
# their struct's name.
assigning_clones = "allow"
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_field_names = "allow"

[package]
name = "mln-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust port of the MapLibre Native map rendering core"
license.workspace = true
repository.workspace = true
include = ["/src", "/LICENSE.md"]
keywords = ["maplibre", "map", "vector-tiles", "gis", "rendering"]
categories = ["graphics", "rendering::engine", "science::geo"]

[dependencies]
feature.workspace = true
geojson.workspace = true
geojson_vt.workspace = true
geometry.workspace = true
kdbush.workspace = true
mln_conversion.workspace = true
mln_expression.workspace = true
mln_gestures.workspace = true
mln_gfx.workspace = true
mln_gl.workspace = true
mln_image.workspace = true
mln_map.workspace = true
mln_map_types.workspace = true
mln_math.workspace = true
mln_mtl.workspace = true
mln_renderer = { workspace = true, features = ["font-face-shaper"] }
mln_runtime = { workspace = true, features = ["default"] }
mln_sprite.workspace = true
# The ambient cache, offline regions and mbtiles:// sources, as in C++.
mln_storage = { workspace = true, features = ["sqlite"] }
mln_storage_offline.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
mln_vulkan.workspace = true
mln_web_host.workspace = true
mln_webgpu.workspace = true
polylabel.workspace = true
shelf_pack.workspace = true
supercluster.workspace = true

[lints]
workspace = true

# Fat LTO with one codegen unit: smaller release binaries, for a longer
# build. The browser build adds opt-level "s" (`just web`).
[profile.release]
lto = "fat"
codegen-units = 1

# Debug builds, the tests' among them, compress and decompress tiles, the
