# The port and its crates.io release (RELEASING.md). Each library under
# crates/ and vendor/ is the package mln-rs-<name> (library name unchanged,
# so the code still says `mln_engine::`), and the package here, mln-rs,
# re-exports them all. Users depend on mln-rs only.
[workspace]
resolver = "3"
# The packages with `publish = false` are test helpers or unused by mln-rs.
members = [
  "crates/*",
  "examples/*",
  "tools/bench",
  "tools/bench/workload",
  "tools/bench-snapshot",
  "tools/c-abi-gen",
  "tools/c-abi-test",
  "tools/expression-test",
  "tools/ratchet",
  "tools/render-test",
  "tools/style-codegen",
  "tools/unicode-tables",
  "tools/wasm-size",
  "vendor/*",
]
# Patched copies of crates.io packages ([patch.crates-io] below), not ours.
exclude = ["patches/*"]

[workspace.package]
# Every package is published at this version. The release pull request
# bumps it here and in the in-repo [workspace.dependencies] below
# (RELEASING.md).
version = "0.0.18"
edition = "2024"
# The oldest Rust the packages build with (mlt-core 0.24 needs 1.98). CI's
# msrv job builds the workspace with it.
rust-version = "1.98"
description = "Part of mln-rs, a Rust port of the MapLibre Native map rendering core. Depend on mln-rs instead."
license = "BSD-2-Clause"
repository = "https://github.com/maplibre/mln-rs"
# `/LICENSE*` ships each package's license files. A published package whose
# code is, all or in part, under the root license has a LICENSE.md symlink to
# it, which `cargo package` archives as a file. The ports of other projects
# also ship their own license files.
include = ["/src", "/tests", "/build.rs", "/LICENSE*"]
# The libraries' keywords and categories on crates.io. mln-rs has its own.
keywords = ["maplibre", "map"]
categories = ["graphics", "science::geo"]

[workspace.dependencies]
# In-repo libraries. The exact version keeps a release's packages together.
feature = { package = "mln-rs-feature", path = "vendor/feature", version = "=0.0.18" }
geometry = { package = "mln-rs-geometry", path = "vendor/geometry", version = "=0.0.18" }
mln_d3d12 = { package = "mln-rs-d3d12", path = "crates/mln_d3d12", version = "=0.0.18" }
mln_bench_workload = { package = "mln-rs-bench-workload", path = "tools/bench/workload" }
# Without its default features, the in-process font-face shaper and SQLite:
# the packages that render turn the shaper on, and those that cache or keep
# offline regions SQLite, so that examples/web leaves both out
# (crates/mln_engine/Cargo.toml).
mln_engine = { package = "mln-rs-engine", path = "crates/mln_engine", version = "=0.0.18", default-features = false }
mln_geojson = { package = "mln-rs-geojson", path = "crates/mln_geojson", version = "=0.0.18" }
mln_gfx = { package = "mln-rs-gfx", path = "crates/mln_gfx", version = "=0.0.18" }
mln_gl = { package = "mln-rs-gl", path = "crates/mln_gl", version = "=0.0.18" }
mln_glsl = { package = "mln-rs-glsl", path = "crates/mln_glsl", version = "=0.0.18" }
mln_headless = { package = "mln-rs-headless", path = "crates/mln_headless", version = "=0.0.18" }
mln_mtl = { package = "mln-rs-mtl", path = "crates/mln_mtl", version = "=0.0.18" }
# Without its backends (its default features) unless a package asks for
# them, so that a browser build of mln_c carries one.
mln_runtime = { package = "mln-rs-runtime", path = "crates/mln_runtime", version = "=0.0.18", default-features = false }
mln_style = { package = "mln-rs-style", path = "crates/mln_style", version = "=0.0.18" }
mln_vec_map = { package = "mln-rs-vec-map", path = "crates/mln_vec_map", version = "=0.0.18" }
mln_vulkan = { package = "mln-rs-vulkan", path = "crates/mln_vulkan", version = "=0.0.18" }
mln_wire = { package = "mln-rs-wire", path = "crates/mln_wire", version = "=0.0.18" }
mln_wire_derive = { package = "mln-rs-wire-derive", path = "crates/mln_wire_derive", version = "=0.0.18" }
mln_web_host = { package = "mln-rs-web-host", path = "crates/mln_web_host", version = "=0.0.18" }
mln_webgpu = { package = "mln-rs-webgpu", path = "crates/mln_webgpu", version = "=0.0.18" }
pixelmatch = { package = "mln-rs-pixelmatch", path = "vendor/pixelmatch", version = "=0.0.18" }
polylabel = { package = "mln-rs-polylabel", path = "vendor/polylabel", version = "=0.0.18" }
style_codegen = { package = "mln-rs-style-codegen", path = "tools/style-codegen", version = "=0.0.18" }

# Third-party crates, for both builds (Cargo.lock pins their versions). Only
# add a crate when nothing in the C++ core has to be ported for it.
#
# The coverage of the font-face glyphs' outlines (mln_engine's text/rasterize.rs).
ab_glyph_rasterizer = { version = "0.1.10" }
# min_const_generics: Pod for any array length (mln_gfx's UBOs).
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
# The buffers that pmtiles reads headers and directories from.
bytes = { version = "1.10.1" }
# zlib-rs backend: pure Rust, so neither native nor wasm32 builds need a C
# compiler or a system zlib.
flate2 = { version = "1.1.11", default-features = false, features = [
  "zlib-rs",
] }
# crates/mln_gl: OpenGL ES 3.0 and WebGL2 through one set of bindings.
glow = { version = "0.17.0" }
harfrust = { version = "0.15.0" }
# HTTP dates (Expires, Last-Modified, Retry-After): mln_engine's parse_http_date.
httpdate = { version = "1.0.3" }
# Percent-decoding (mln_engine's file sources).
percent-encoding = { version = "2.3.1" }
# A local HTTP server, for the tests that load over HTTP.
httpmock = { version = "0.9.0", default-features = false }
# decodeWEBP (platform/default/src/mln/util/webp_reader.cpp); pure Rust.
image-webp = { version = "0.2.4" }
# crates/mln_gl's headless backend: an EGL context. `dynamic` loads libEGL at
# run time, so builds need no system development packages.
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
# System calls that std doesn't wrap (each package says which).
libc = { version = "0.2.191" }
# crates/mln_gl's WGL contexts, their pixel formats and the hidden windows
# they are current on.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_OpenGL",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
# crates/mln_gl's window backend: loads libwayland-egl at run time.
libloading = { version = "0.8.9" }
# The library's log records, which hosts read with their own `log` backend
# and mln_c forwards to the C API's log callback.
log = { version = "0.4.35" }
memmap2 = { version = "0.9.12" }
# Polygon triangulation (mln_engine's fills and fill extrusions), a port of
# earcut.js, the triangulation GL JS uses.
earcut = { version = "0.4.5" }
# MLT decoding: the Rust implementation of the MapLibre Tile spec, instead of
# a port of the C++ decoder.
mlt-core = { version = "0.24.0" }
# The even-odd union that repairs the polygons of version 1 vector tiles,
# instead of porting wagyu. mlt-core already depends on it through geo.
i_overlay = { version = "4.5.2", default-features = false }
# 2D vector maths (mln_engine's symbol layout, placement and collision).
glam = { version = "0.34.3", default-features = false, features = [
  "std",
  "f64",
  "i64",
] }
# The GeoJSON and feature geometry (mln-rs-feature's `Feature`, the GeoJSON
# sources, queries, the `within` and `distance` expressions), in place of a
# port of the C++ core's vendored geometry.hpp variant. Tile geometry stays
# the port's (mln-rs-geometry's `Point`). mlt-core already depends on it.
geo-types = { version = "0.7.20" }
# The k-d tree that GeoJSON sources cluster their points with (mln_geojson),
# instead of porting kdbush.
geo-index = { version = "0.4.0", default-features = false }
# GeoJSON, in place of a port of the C++ core's vendored geojson.hpp: the
# sources, the C API and the expressions take its types.
geojson = { version = "1.0.0" }
# MVT decoding, instead of porting the C++ reader (vendor/vector-tile).
fast-mvt = { version = "0.7.3", default-features = false, features = [
  "reader",
] }
# Glyph PBFs: fast-mvt's protobuf runtime, whose wire format functions read
# them instead of a port of protozero.
buffa = { version = "0.9.2", default-features = false }
# The `distance` expression's distances (mln_style), in place of a port
# of the C++ core's vendored cheap-ruler-cpp: the same WGS84 formulas, with
# its arithmetic in a different order, so a distance can differ from the C++
# one in the last bits.
cheap-ruler = { version = "0.4.0" }
# Packs the glyph, icon and pattern atlases (mln_engine).
etagere = { version = "0.3.0", default-features = false }
# PMTiles archives (mln_engine's PMTilesFileSource): their header,
# directories and tile IDs, in place of a port of the C++ core's vendored
# pmtiles.hpp. The archive reading stays the port's.
pmtiles = { version = "0.28.1", default-features = false }
# The hasher of mln-rs's hash maps and sets (mln_style::hash). Faster than
# std's SipHash, and seeded per process, so keys from styles and tiles can't
# be crafted to collide. hashbrown already depends on it.
foldhash = { version = "0.2.0" }
# Locks without poisoning: a panic while a lock is held doesn't make every
# later lock panic. wgpu already depends on it.
parking_lot = { version = "0.12.5" }
png = { version = "0.18.1" }
pollster = { version = "1.0.1" }
# The property tests that decode malformed tiles (mln_engine).
proptest = { version = "1.12.0" }
# The windows of window targets (mln_gfx::Window), as winit and others hand them out.
# `alloc`: an `Arc` of a window is one too.
raw-window-handle = { version = "0.6.2", features = ["alloc"] }
regex = { version = "1.13.1" }
# tools/render-test's JSON (with serde_json), mln_engine's sprite index, and
# the types that cross to a tile worker in another wasm instance (rc: the
# values behind their `Arc`s).
serde = { version = "1.0.229", features = ["derive", "rc"] }
# The same engine as the C++ core's vendored SQLite, built from source like it
# where the platform has none (crates/mln_engine). A range, because an app
# links only one sqlite3 and picks the rusqlite version for all its crates.
rusqlite = ">=0.39.0, <0.44"
# preserve_order: objects keep their members in document order, which the
# conversions of serde_json values (the C API's filters and expressions) and
# the order of their expression errors rely on.
# float_roundtrip: correctly rounded float parsing (the default parser can be
# off by an ULP).
serde_json = { version = "1.0.154", features = [
  "float_roundtrip",
  "preserve_order",
] }
# A JSON tree that borrows its strings from the text and keeps an object's
# members in a Vec, in document order: what the style parser reads a style
# into.
serde_json_borrow = { version = "0.9.0" }
# The checksums of the benchmark fixtures (tools/bench, tools/bench-snapshot).
sha2 = { version = "0.11.1" }
skrifa = { version = "0.49.0" }
# An expression's arguments, on the stack while it evaluates: a filter's
# expression runs on every feature of every layer it filters. Also the parts
# of a GeoJSON feature being cut into tiles, most often one. parking_lot
# already builds it.
smallvec = { version = "1.16.4" }
sys-locale = { version = "0.3.2" }
# tools/render-test's --shuffle order for a --seed. tempfile already builds it.
fastrand = { version = "2.5.0" }
# Tests' temporary directories, which they don't share with test runs at the same time.
tempfile = "3.27.0"
# The slot maps a GPU backend keeps its resources in, keyed by the ids of
# mln_gfx's `Gpu` interface.
slotmap = { version = "1.1.1" }
# Derives the libraries' `Display` and `std::error::Error` impls.
thiserror = "2.0.21"
# tools/wasm-size: the browser build's function sizes and names.
wasmparser = { version = "0.263.0", default-features = false, features = [
  "std",
] }
# The Unicode bidi algorithm (mln_engine's text/bidi.rs). Its mirroring and
# Arabic tables come from the same Unicode version: mise.toml's
# unicode_version, which a bump changes with them.
unicode-bidi = { version = "0.3.18" }
# Where label text may break into lines (mln_engine's text/line_breaks.rs): UAX #14.
unicode-linebreak = { version = "0.1.5" }
# General_Category (mln_engine's script runs, mln_style's i18n), in the Unicode
# version of harfrust's own tables.
unicode-properties = { version = "0.1.5", default-features = false, features = [
  "general-category",
] }
# The locale-sensitive expressions (collator, resolved-locale, number-format)
# on platforms without their own locale services (mln_style's
# expression/locale): ICU4X, with the CLDR data it compiles in.
# icu_experimental has CLDR's currency, percent and unit patterns and
# symbols; it requires its own ICU4X release (`~2.4`). icu_plurals picks a
# unit name's plural form.
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
icu_collator = { version = "2.4.0" }
icu_decimal = { version = "2.4.0" }
icu_experimental = { version = "=0.7.0" }
icu_locale = { version = "2.4.0" }
icu_plurals = { version = "2.4.0" }
icu_provider = { version = "2.4.0" }
writeable = { version = "0.6.4" }
# WOFF and WOFF2 font faces (mln_engine's text/woff.rs): pure Rust, no unsafe. Only its
# Brotli decoder: mln_engine hands it the workspace's flate2 for WOFF's zlib.
wuff = { version = "0.2.10", default-features = false, features = ["brotli"] }
# decodeJPEG (platform/default/src/mln/util/jpeg_reader.cpp) natively; pure
# Rust. The browser build decodes JPEG with the browser instead.
zune-jpeg = { version = "0.5.15" }
# HTTP for the online file source where the platform has no HTTP stack of
# its own (the C++ default platform uses curl). mln_engine picks the TLS
# features per target.
ureq = { version = "3.5.1", default-features = false }
# ureq's rustls, with ring's cryptography (ureq's own `rustls` feature would
# also bring webpki-roots).
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
# Android: HttpURLConnection for the online file source, the app's assets,
# and android.icu for the locale-sensitive expressions, in the Java VM that
# mln_android_init() gives, through JNI.
jni = { version = "0.22.4", default-features = false }
# Apple platforms: Foundation's NSURLSession for the online file source.
block2 = { version = "0.6.2" }
objc2 = { version = "0.6.5" }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSHapticFeedback",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSData",
  "NSDate",
  "NSError",
  "NSObjCRuntime",
  "NSOperation",
  "NSString",
  "NSURL",
  "NSURLCache",
  "NSURLError",
  "NSURLRequest",
  "NSURLResponse",
  "NSURLSession",
] }
# Apple platforms: the Metal backend (crates/mln_mtl) and its CAMetalLayer.
objc2-metal = { version = "0.3.2", default-features = false, features = [
  "std",
  "MTLAllocation",
  "MTLArgument",
  "MTLBlitCommandEncoder",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLDepthStencil",
  "MTLDevice",
  "MTLDrawable",
  "MTLEvent",
  "MTLLibrary",
  "MTLPixelFormat",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLRenderPipeline",
  "MTLResource",
  "MTLSampler",
  "MTLTexture",
  "MTLTypes",
  "MTLVertexDescriptor",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
] }
# Apple platforms: the IOSurfaces of the Metal backend's exported rings.
objc2-core-text = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-graphics",
  "CTFont",
  "CTFontDescriptor",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = [
  "std",
  "bitflags",
  "objc2-core-foundation",
  "IOSurfaceRef",
  "IOSurfaceTypes",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-metal",
  "CALayer",
  "CAMetalLayer",
  "CATransaction",
] }
# examples/web: the browser's API through wasm-bindgen (whose CLI must be
# this exact version).
js-sys = { version = "0.3.107" }
wasm-bindgen = { version = "=0.2.130" }
wasm-bindgen-futures = { version = "0.4.80" }
web-sys = { version = "0.3.107", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "Headers",
  "ImageBitmap",
  "ImageData",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "Request",
  "RequestCache",
  "RequestInit",
  "RequestRedirect",
  "Response",
  "ResponseType",
  "TextMetrics",
  "console",
] }
# std::time's clocks, which panic on wasm32-unknown-unknown (mln_style::time):
# performance.now() and Date.now() there, std::time everywhere else.
web-time = { version = "1.1.0" }
# Ports the C++ WebGPU backend (src/mln/webgpu, which runs on Dawn or
# wgpu-native) onto the Rust implementation of the same API: Vulkan, Metal
# and DX12 natively (wgpu builds each only where it runs), and on
# wasm32-unknown-unknown the browser's WebGPU (examples/web). Not its
# default GLES backend, which nothing selects.
wgpu = { version = "30.0.1", default-features = false, features = [
  "std",
  "parking_lot",
  "wgsl",
  "dx12",
  "metal",
  "vulkan",
  "webgpu",
] }
# The Vulkan backend (crates/mln_vulkan), where the C++ one uses vulkan-hpp,
# VulkanMemoryAllocator and glslang: the bindings and the allocator that
# wgpu's own Vulkan backend uses, and naga, at wgpu's versions.
ash = { version = "0.38.0" }
# The Vulkan backend on Windows: its D3D12 fences, and the D3D11 textures of
# its exported rings on the DXGI adapter of the Vulkan GPU, at wgpu's version.
# The D3D12 backend (crates/mln_d3d12): D3D12, DXGI and DXC.
# mln_engine's system fonts: DirectWrite's font fallback.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_LibraryLoader",
] }
windows-core = { version = "0.62.2" }
# The memory of the Vulkan and D3D12 backends, at the version that wgpu's own
# backends allocate with. The D3D12 backend turns on `d3d12`.
gpu-allocator = { version = "0.28.0", default-features = false, features = [
  "std",
  "vulkan",
] }
# The GLSL front end of the Vulkan and D3D12 backends' shaders
# (crates/mln_glsl), whose back ends turn on their own features: SPIR-V for
# Vulkan and HLSL for D3D12. The GLSL front end needs a module that only
# `wgsl-in` or `spv-in` builds.
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in"] }
# The CAMetalLayer of a window's view on Apple platforms: crates/mln_mtl's
# window surfaces, and examples/desktop's.
raw-window-metal = { version = "1.1.0" }
# examples/desktop's window and input. On Linux it loads the X11 and Wayland
# libraries at run time (`wayland-dlopen`, x11-dl), so builds need no system
# development packages.
winit = { version = "0.30.13", default-features = false, features = [
  "rwh_06",
  "x11",
  "wayland",
  "wayland-dlopen",
  "wayland-csd-adwaita",
] }
# examples/desktop's controls over the map: egui, drawn with the map's wgpu
# device or in its OpenGL ES context, its input from winit. `links` opens the
# attribution's links.
egui = { version = "0.37.0", default-features = false, features = [
  "default_fonts",
] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui_glow = { version = "0.37.0", default-features = false }
# The backends' SVG logos in examples/desktop's controls.
egui_extras = { version = "0.37.0", default-features = false, features = [
  "svg",
] }
egui-winit = { version = "0.37.0", default-features = false, features = [
  "links",
  "wayland",
  "x11",
] }

# Lints for every package (`[lints] workspace = true`): clippy's default and
# pedantic sets, with warnings denied in CI (the `lint` job). The pedantic
# lints below are off.
[workspace.lints.rust]
# No `unsafe` outside FFI. The FFI modules allow it.
unsafe_code = "deny"
# A `pub` item that no other crate can reach is `pub(crate)`, so that each
# crate's public API is what its dependents use.
unreachable_pub = "warn"
# Casts to the type a value already has or coerces to, and paths that spell
# out a module whose item is in scope.
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
# The benchmarks' builds give hash maps a fixed seed (tools/bench/profile.toml).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mln_bench_fixed_hash)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The manifests: package metadata, feature names and dependency declarations.
# A workspace this size can't avoid two versions of a crate among its
# dependencies' dependencies.
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
# Development macros that shouldn't be merged: `dbg!` prints to stderr, and
# `todo!` and `unimplemented!` panic.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# `Arc::clone(&x)` and `Rc::clone(&x)` for a new reference to the same value,
# so that `x.clone()` is a copy of a value.
clone_on_ref_ptr = "warn"
# `#[expect(lint, reason = "…")]` instead of `#[allow(lint)]`: the reason
# says why the code needs it, and the attribute fails once the lint stops
# firing.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Their fixes would change what the code does: numeric conversions that
# truncate, wrap or saturate on purpose, where `try_from` would fail
# instead, and exact float comparisons, which an epsilon would loosen.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
# `assert!` for `if c { panic!(..) }` would take the panic out of
# tools/ratchet's count of library panic sites.
manual_assert = "allow"
# Their fixes are redesigns: functions split by length, flags turned into
# enums, coordinates and their deltas (`x`, `dx`, `x0`) renamed apart.
fn_params_excessive_bools = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Not worth their noise: `x.clone_from(&y)` and `"text".clone_into(&mut x)`
# for every assignment of a copy, `# Errors` and `# Panics` sections on every
# function that can, maps generic over their hasher, and fields that repeat
# their struct's name.
assigning_clones = "allow"
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_field_names = "allow"

[package]
name = "mln-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust port of the MapLibre Native map rendering core"
license.workspace = true
repository.workspace = true
include = ["/src", "/LICENSE.md"]
keywords = ["maplibre", "map", "vector-tiles", "gis", "rendering"]
categories = ["graphics", "rendering::engine", "science::geo"]

# The backends that sessions render with (crates/mln_runtime/Cargo.toml),
# each with its crate re-exported: by default the native ones.
[features]
default = ["metal", "vulkan", "d3d12", "gl"]
webgpu = ["mln_runtime/webgpu", "dep:mln_webgpu"]
metal = ["mln_runtime/metal", "dep:mln_mtl"]
vulkan = ["mln_runtime/vulkan", "dep:mln_vulkan"]
d3d12 = ["mln_runtime/d3d12", "dep:mln_d3d12"]
gl = ["mln_runtime/gl", "dep:mln_gl"]

[dependencies]
feature.workspace = true
geo-types.workspace = true
geojson.workspace = true
geometry.workspace = true
glam.workspace = true
mln_d3d12 = { workspace = true, optional = true }
mln_geojson.workspace = true
mln_gfx.workspace = true
mln_gl = { workspace = true, optional = true }
mln_mtl = { workspace = true, optional = true }
# SQLite: the ambient cache, offline regions and mbtiles:// sources, as in
# C++.
mln_engine = { workspace = true, features = [
  "font-face-shaper",
  "sqlite",
  "system-fonts",
] }
mln_runtime.workspace = true
mln_style.workspace = true
mln_vec_map.workspace = true
mln_vulkan = { workspace = true, optional = true }
mln_web_host.workspace = true
mln_webgpu = { workspace = true, optional = true }
polylabel.workspace = true

[lints]
workspace = true

# Dependencies with a fix not yet released (patches/README.md).
[patch.crates-io]
fsst-rs = { path = "patches/fsst-rs" }

# Debug builds, the tests' among them, keep line tables only: backtraces keep
# their files and lines, but a debugger shows no variables
# (`CARGO_PROFILE_DEV_DEBUG=true` brings them back). Full debug info makes a
# checkout's test build gigabytes larger, more so where it goes into the
# binaries, as on Linux and Android.
[profile.dev]
debug = "line-tables-only"

# Interactive apps keep debug checks and line tables, with optimized code
# and incremental compilation for development.
[profile.dev-opt]
inherits = "dev"
opt-level = 2
lto = false
codegen-units = 16
incremental = true

# Fat LTO with one codegen unit: smaller release binaries, for a longer
# build. The browser build adds opt-level "s" (`mise run web:build`).
[profile.release]
lto = "fat"
codegen-units = 1

# Debug builds, the tests' among them, compress and decompress tiles, the
# offline database and PNGs through zlib-rs, which is many times slower
# unoptimized.
[profile.dev.package.zlib-rs]
opt-level = 3
