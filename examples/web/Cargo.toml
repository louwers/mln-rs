[package]
name = "mln-rs-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The browser build: the map and its tile workers in Web Workers, each a
# wasm instance of the same module with its own memory
# (wasm32-unknown-unknown, no atomics). `just web` builds it into web/pkg,
# with the font-face shaper the map loads for styles with font faces
# (crates/mln_web_shaper; mln_renderer's in-process shaper stays off here); never
# released.
publish = false
autotests = false

[lib]
name = "mln_web"
crate-type = ["cdylib", "rlib"]

[features]
# The module for browsers without WebGPU, which draws with WebGL2 through
# mln_gl (src/map_webgl.rs). `just web` builds it beside the WebGPU one; the
# page loads one of the two. Nothing in it calls mln_webgpu or wgpu, so the
# linker leaves them out of it.
webgl = ["dep:mln_gl"]

# Only the browser target has anything to build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
feature.workspace = true
geometry.workspace = true
js-sys.workspace = true
mln_actor.workspace = true
mln_gestures.workspace = true
mln_gfx.workspace = true
mln_gl = { workspace = true, optional = true }
mln_map.workspace = true
mln_renderer.workspace = true
mln_storage.workspace = true
mln_text.workspace = true
mln_util.workspace = true
mln_web_host.workspace = true
mln_webgpu.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
wgpu.workspace = true

[lints]
workspace = true
