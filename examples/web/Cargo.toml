[package]
name = "mln-rs-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The browser build: the map and its tile workers in Web Workers, each a
# wasm instance of the same module with its own memory
# (wasm32-unknown-unknown, no atomics). `mise run web:build` builds it into
# web/pkg, with the font-face shaper the map loads for styles with font faces
# (crates/mln_web_shaper; mln_engine's in-process shaper stays off here); never
# released.
publish = false
autotests = false

[lib]
name = "mln_web"
crate-type = ["cdylib", "rlib"]

[features]
# The module draws with the browser's WebGPU, or with the `webgl` feature
# and without the default ones, with its WebGL2 through mln_gl, for browsers
# without WebGPU. `mise run web:build` builds both; the page loads one of the
# two. Each carries only its backend and its shaders.
default = ["webgpu"]
webgpu = ["mln_runtime/webgpu", "dep:mln_webgpu"]
webgl = ["mln_runtime/gl", "dep:mln_gl"]

# Only the browser target has anything to build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
log.workspace = true
mln_gfx.workspace = true
mln_gl = { workspace = true, optional = true }
mln_engine.workspace = true
# gpu-conformance: the host writes and memory growth cases, which
# check/check.mjs runs on a backend of the map's kind (src/gpu_check.rs).
mln_builtins = { workspace = true, features = ["gpu-conformance"] }
mln_runtime.workspace = true
mln_style.workspace = true
mln_web_host.workspace = true
mln_webgpu = { workspace = true, optional = true }
parking_lot.workspace = true
# The terrain the page adds to a style, and the style document's own
# projection (WebMap::set_projection).
serde_json.workspace = true
serde_json_borrow.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["MessagePort"] }

[lints]
workspace = true
