[package]
name = "mln-rs-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The desktop example app: the map in a winit window, on the backend that the
# library picks or that --backend names (Metal on macOS, Vulkan elsewhere than
# on Apple's platforms, D3D12 on Windows, OpenGL ES on Linux, or WebGPU), with
# egui's controls over it; never released.
publish = false
autotests = false

# The app: a map in a window. `mise run desktop`.
[[bin]]
name = "mln-desktop"
path = "src/main.rs"
doc = false

[dependencies]
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
egui-winit.workspace = true
log.workspace = true
# The benchmark mode's fixtures and camera paths, the benchmarks' (benchmark.rs).
mln_bench_workload.workspace = true
mln_frame_pacer.workspace = true
mln_gestures.workspace = true
mln_image.workspace = true
mln_map.workspace = true
# Only for its feature: the sessions shape the style's font faces, and the
# system's fonts that the map falls back to, in-process.
mln_engine = { workspace = true, features = ["font-face-shaper"] }
mln_runtime = { workspace = true, features = ["default", "webgpu"] }
# The responses of the offline mode's resource provider.
mln_storage.workspace = true
mln_style.workspace = true
mln_util.workspace = true
mln_webgpu.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

# The Metal backend, the CAMetalLayer it presents to (metal_layer.rs) and the
# controls drawn on Metal (metal_overlay.rs).
[target.'cfg(target_os = "macos")'.dependencies]
mln_mtl.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
raw-window-metal.workspace = true

# The Vulkan backend and the controls drawn on Vulkan (vulkan_overlay.rs).
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
ash.workspace = true
mln_gfx.workspace = true
mln_vulkan.workspace = true

# The D3D12 backend and the controls drawn on D3D12 (d3d12_overlay.rs). The
# build puts DXC's DLL beside the app (build.rs).
[target.'cfg(windows)'.dependencies]
mln_d3d12.workspace = true

# The OpenGL ES backend, which presents to the window through EGL, and the
# controls drawn in its context (gl_overlay.rs).
[target.'cfg(target_os = "linux")'.dependencies]
egui_glow.workspace = true
mln_gl.workspace = true

# Loads the OpenFreeMap Liberty style over HTTPS through a runtime's map, as
# the app does, and parses it, then sets the projections that the controls
# offer, and adds the catalog's terrain to VersaTiles' Satellite
# (src/styles.rs). Needs network access, so it is ignored by default:
# `cargo test -p mln-rs-desktop -- --ignored`.
[[test]]
name = "liberty_style_test"
path = "tests/liberty_style_test.rs"

# The renderer is a dependency for its feature only.
[package.metadata.cargo-udeps.ignore]
normal = ["mln_engine"]

[lints]
workspace = true
