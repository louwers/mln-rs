[package]
name = "mln-rs-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The desktop example app: the map in a winit window, on the WebGPU backend
# (or Metal on macOS, Vulkan elsewhere than on Apple's platforms, or OpenGL ES
# on Linux), with egui's controls over it; never released.
publish = false
autotests = false

# The app: a map in a window. `just desktop`.
[[bin]]
name = "mln-desktop"
path = "src/main.rs"
doc = false

[dependencies]
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
egui-winit.workspace = true
feature.workspace = true
fontdb.workspace = true
mln_actor.workspace = true
mln_gestures.workspace = true
mln_gfx.workspace = true
mln_image.workspace = true
mln_map.workspace = true
mln_math.workspace = true
mln_renderer = { workspace = true, features = ["font-face-shaper"] }
# The ambient cache and mbtiles:// sources, as in C++.
mln_storage = { workspace = true, features = ["sqlite"] }
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_util.workspace = true
mln_webgpu.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
skrifa.workspace = true
wgpu.workspace = true
winit.workspace = true

# The Metal backend, the CAMetalLayer it presents to (metal_layer.rs) and the
# controls drawn on Metal (metal_overlay.rs).
[target.'cfg(target_os = "macos")'.dependencies]
mln_mtl.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
raw-window-metal.workspace = true

# The Vulkan backend and the controls drawn on Vulkan (vulkan_overlay.rs).
[target.'cfg(not(any(target_vendor = "apple", target_family = "wasm")))'.dependencies]
ash.workspace = true
mln_vulkan.workspace = true

# The OpenGL ES backend, which presents to the window through EGL, and the
# controls drawn in its context (gl_overlay.rs).
[target.'cfg(target_os = "linux")'.dependencies]
egui_glow.workspace = true
mln_gl.workspace = true

# Loads the OpenFreeMap Liberty style over HTTPS through the Map's file
# sources (OnlineFileSource -> HTTPFileSource) and Style::loadURL, and parses
# it. Needs network access, so it is ignored by default: `cargo test -p
# mln-rs-desktop -- --ignored`.
[[test]]
name = "liberty_style_test"
path = "tests/liberty_style_test.rs"

[lints]
workspace = true
