# cargo-deny's license check (`mise run licenses`, in CI's lint job): every
# package in the dependency graph, ours included, must be under the licenses
# allowed here. Allowing another one means that every app that ships mln-rs
# takes on its terms.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "FTL",
  "ICU",
  "ISC",
  "MIT",
  "MIT-Modern-Variant",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
