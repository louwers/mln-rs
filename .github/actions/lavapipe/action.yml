name: Mesa's software rasterizers
description: >-
  Installs Mesa's Vulkan drivers and a Vulkan loader that is safe to use from
  several threads, and points the loader at lavapipe, the software rasterizer
  the GPU tests on Linux run on. With `validation-layer`, also Vulkan's
  validation layer, and with `egl`, Mesa's EGL, for OpenGL ES on llvmpipe.

inputs:
  validation-layer:
    description:
      Also install the Khronos validation layer (VK_LAYER_KHRONOS_validation).
    default: "false"
  egl:
    description: >-
      Also install Mesa's EGL (packages-egl.sha256), which the runner image
      lacks, and have Mesa render with llvmpipe: for the tests of the OpenGL
      backend.
    default: "false"

# The packages are the Ubuntu ones that packages.sha256 pins, with
# `validation-layer` the one that validation-layer.sha256 pins and with `egl`
# the ones that packages-egl.sha256 pins, downloaded from a release of this
# repository (mirror.sh uploads them) rather than from the Ubuntu archive,
# which is at times out of reach of the runners for hours. The runner image
# has everything they depend on, so dpkg installs them without apt.
#
# Mesa's EGL depends on its gallium drivers and its GBM at exactly its own
# version. The runner image has both, but packages-egl.sha256 pins them too,
# so that an image with another Mesa gets the EGL's.
#
# packages.sha256 also pins Ubuntu 26.10's Vulkan loader, 1.4.357, in place
# of the image's 1.4.341. That one names an object
# (vkSetDebugUtilsObjectNameEXT, which the Vulkan backend calls under the
# validation layer, and wgpu in a debug build) by walking the devices under a
# lock that vkCreateDevice and vkDestroyDevice don't take, so a thread that
# names one while another destroys a device can read the freed device and
# crash. The loader takes the same lock since 1.4.350
# (KhronosGroup/Vulkan-Loader#1866). It depends on libc only.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RELEASE: https://github.com/louwers/mln-rs/releases/download/ci-lavapipe
        VALIDATION_LAYER: ${{ inputs.validation-layer }}
        EGL: ${{ inputs.egl }}
      run: |
        dir="$RUNNER_TEMP/lavapipe"
        mkdir -p "$dir"
        lists=("$GITHUB_ACTION_PATH/packages.sha256")
        if [ "$VALIDATION_LAYER" = true ]; then
          lists+=("$GITHUB_ACTION_PATH/validation-layer.sha256")
        fi
        if [ "$EGL" = true ]; then
          lists+=("$GITHUB_ACTION_PATH/packages-egl.sha256")
        fi
        debs=()
        while read -r sha256 path; do
          deb="$dir/${path##*/}"
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 -o "$deb" "$RELEASE/${path##*/}"
          echo "$sha256  $deb" | sha256sum --check --quiet
          debs+=("$deb")
        done < <(cat "${lists[@]}")
        sudo dpkg --install "${debs[@]}"
        echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
        if [ "$EGL" = true ]; then
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
        fi
