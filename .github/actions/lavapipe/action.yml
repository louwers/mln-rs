name: Lavapipe
description: >-
  Installs Mesa's Vulkan drivers and points the Vulkan loader at lavapipe,
  the software rasterizer the GPU tests on Linux run on.

# The packages are the Ubuntu ones that packages.sha256 pins, downloaded from
# a release of this repository (mirror.sh uploads them) rather than from the
# Ubuntu archive, which is at times out of reach of the runners for hours.
# The runner image has everything they depend on, so dpkg installs them
# without apt.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RELEASE: https://github.com/louwers/mln-rs/releases/download/ci-lavapipe
      run: |
        dir="$RUNNER_TEMP/lavapipe"
        mkdir -p "$dir"
        debs=()
        while read -r sha256 path; do
          deb="$dir/${path##*/}"
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 -o "$deb" "$RELEASE/${path##*/}"
          echo "$sha256  $deb" | sha256sum --check --quiet
          debs+=("$deb")
        done < "$GITHUB_ACTION_PATH/packages.sha256"
        sudo dpkg --install "${debs[@]}"
        echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
