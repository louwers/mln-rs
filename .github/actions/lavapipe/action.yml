name: Lavapipe
description: >-
  Installs Mesa's Vulkan drivers and points the Vulkan loader at lavapipe,
  the software rasterizer the GPU tests on Linux run on.

inputs:
  validation-layer:
    description: Also install the Khronos validation layer (VK_LAYER_KHRONOS_validation).
    default: 'false'

# The packages are the Ubuntu ones that packages.sha256 pins, and
# validation-layer.sha256 for the validation layer, downloaded from a release
# of this repository (mirror.sh uploads them) rather than from the Ubuntu
# archive, which is at times out of reach of the runners for hours. The
# runner image has everything they depend on, so dpkg installs them without
# apt.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RELEASE: https://github.com/louwers/mln-rs/releases/download/ci-lavapipe
        VALIDATION_LAYER: ${{ inputs.validation-layer }}
      run: |
        pins=("$GITHUB_ACTION_PATH/packages.sha256")
        if [[ "$VALIDATION_LAYER" == true ]]; then
          pins+=("$GITHUB_ACTION_PATH/validation-layer.sha256")
        fi
        dir="$RUNNER_TEMP/lavapipe"
        mkdir -p "$dir"
        debs=()
        while read -r sha256 path; do
          deb="$dir/${path##*/}"
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 -o "$deb" "$RELEASE/${path##*/}"
          echo "$sha256  $deb" | sha256sum --check --quiet
          debs+=("$deb")
        done < <(cat "${pins[@]}")
        sudo dpkg --install "${debs[@]}"
        echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
