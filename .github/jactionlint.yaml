# jactionlint (https://jactionlint.jdx.dev), which hk runs: the default
# profile, with these of the pedantic one.
profile: default
rules:
  # Every workflow sets `defaults.run.shell: bash`, which runs with pipefail.
  require-shell: error
  # Also an expression that no attacker controls, such as a matrix value.
  template-injection:
    pedantic: true
  secrets-outside-env:
    level: warn
    # Uploads coverage only.
    allow: [CODECOV_TOKEN]
  undocumented-permissions: warn
  concurrency-limits: warn
  dependabot-missing-actions-update: warn
# Blacksmith runner labels are not in the GitHub-hosted catalog.
self-hosted-runner:
  labels:
    - blacksmith-2vcpu-ubuntu-2604
    - blacksmith-2vcpu-ubuntu-2604;scheduling=flex
    - blacksmith-4vcpu-ubuntu-2604
    - blacksmith-4vcpu-ubuntu-2604;scheduling=flex
    - blacksmith-4vcpu-ubuntu-2604-arm
    - blacksmith-4vcpu-windows-2025
    - blacksmith-6vcpu-macos-26
ignores:
  - rule: dangerous-triggers
    file: .github/workflows/device-test.yml
    reason:
      The Android tests of pull requests from forks run on AWS Device Farm only
      from workflow_run, which gets the AWS role. The workflow runs the default
      branch's code and only uploads the package that CI built, without running
      or unpacking it.
  - rule: use-trusted-publishing
    file: .github/workflows/release.yml
    job: release
    reason:
      Trusted publishing needs each crate configured on crates.io first. Until
      then the token lives in the release environment.
  - rule: dangerous-triggers
    file: .github/workflows/ci-retry.yml
    reason: >-
      Reacts to completed `ci` runs via `workflow_run`, checks out only the
      trusted default-branch commit (`github.sha`), and reads only GitHub API
      job/step conclusions without touching untrusted PR code or artifacts.
  - rule: excessive-permissions
    file: .github/workflows/ci-retry.yml
    job: retry
    reason: >-
      Needs `actions: write` to call `rerun-failed-jobs` on failed `ci` runs;
      the job executes only trusted default-branch code (`tools/ci/retry.py`).
