name: pages

# Builds the browser build and its page (`just profile=release web`,
# examples/web/README.md) and deploys the page, examples/web/dist, to GitHub
# Pages (https://louwers.github.io/mln-rs/). It needs no COOP/COEP headers,
# so Pages serves it as is. Publishing only: CI's web job checks the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time; a newer push replaces the one waiting, so the latest
# commit deploys next. In-flight runs finish, so that pushes coming faster
# than a build don't starve the deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tools that mise.toml pins, Rust from rust-toolchain.toml among
      # them, at the versions mise.lock records.
      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: just profile=release web

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/web/dist
      - id: deploy
        uses: actions/deploy-pages@v5
