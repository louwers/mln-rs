name: device-farm

# Runs the Android tests that CI's device-farm job packaged on AWS Device
# Farm's phones, for pull requests from forks too, and reports the run on the
# commit as the `device-farm / android` status (tools/device-farm/README.md).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash

# A newer commit of a pull request cancels the run of the one before, which
# stops its Device Farm run (schedule.sh); main's commits wait their turn.
concurrency:
  group:
    device-farm-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  STATUS_CONTEXT: device-farm / android
  RUN_URL:
    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
    github.run_id }}

jobs:
  android:
    if:
      github.repository == 'maplibre/mln-rs' &&
      github.event.workflow_run.conclusion != 'cancelled'
    # GitHub-hosted, since the job mostly waits for the phones.
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    environment:
      name: workflow-run
      deployment: false
    permissions:
      actions: read # downloads the package from the CI run
      id-token: write # assumes the AWS role
      statuses: write # reports the run on the commit
    outputs:
      ran: ${{ steps.package.outputs.file != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/device-farm

      # By pattern, so that a CI run that planned no device-farm job downloads
      # nothing.
      - name: Download the test package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-device-tests
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package

      - name: Find the test package
        id: package
        run: |
          file=$RUNNER_TEMP/package/android-tests.zip
          if [[ -f $file && ! -L $file ]]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
          else
            echo "The CI run built no Android test package."
          fi

      - name: Report the run as pending
        if: steps.package.outputs.file
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending
          -f context="$STATUS_CONTEXT" -f description="Running on AWS Device
          Farm's phones" -f target_url="$RUN_URL"

      - name: Configure AWS credentials
        if: steps.package.outputs.file
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: mln-rs-device-farm-${{ github.run_id }}
          # The queue for the account's phones and the run can outlast the
          # default hour; four hours is the role's maximum.
          role-duration-seconds: 14400

      - name: Run the tests on AWS Device Farm
        id: run
        if: steps.package.outputs.file
        env:
          AWS_DEVICE_FARM_PROJECT_ARN: ${{ vars.AWS_DEVICE_FARM_PROJECT_ARN }}
          PACKAGE: ${{ steps.package.outputs.file }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: >-
          tools/device-farm/schedule.sh "$PACKAGE" "$RUNNER_TEMP/results"
          "mln-rs ${HEAD_SHA:0:12} ($EVENT)"

      - name: Upload the phones' output and artifacts
        if: ${{ !cancelled() && steps.package.outputs.file }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-test-results
          path: ${{ runner.temp }}/results
          # The artifacts are compressed already.
          compression-level: 0
          if-no-files-found: ignore

      - name: Report the run's result
        if: always() && steps.package.outputs.file
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          case $OUTCOME in
            success) state=success description="The tests passed on every phone" ;;
            failure) state=failure description="Tests failed on a phone, or the run failed" ;;
            *) state=error description="The run didn't finish" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" \
            -f context="$STATUS_CONTEXT" -f description="$description" -f target_url="$RUN_URL"

  # Each phone's test results, from the output that the code under test wrote,
  # so without credentials.
  report:
    needs: android
    if: ${{ !cancelled() && needs.android.outputs.ran == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # downloads the android job's results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/device-farm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-device-test-results
          path: ${{ runner.temp }}/results

      - name: Summarize each phone's tests
        run: >-
          python3 -I tools/device-farm/summary.py "$RUNNER_TEMP/results" | tee
          -a "$GITHUB_STEP_SUMMARY"
