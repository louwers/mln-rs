name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every test (`mise run ci:coverage`): the libraries' tests and the shared
  # render, query and expression suites (the render and query suites twice:
  # also with the tile workers behind the worker codec), with their line
  # coverage uploaded to Codecov (codecov.yml). The headless renders go
  # through each backend of a platform. On Linux: WebGPU (wgpu on
  # Vulkan/lavapipe), the Vulkan backend itself (MLN_RENDER_BACKEND=vulkan,
  # on lavapipe under Vulkan's validation layer) and the OpenGL backend
  # (MLN_RENDER_BACKEND=gl: OpenGL ES 3.0 through
  # EGL, on Mesa's llvmpipe). On macOS: WebGPU (wgpu on Metal) and the Metal
  # backend itself (MLN_RENDER_BACKEND=metal), under Metal's API validation.
  # Either validation aborts on an error. The differential tests against the
  # C++ core are in louwers/mln-rs-difftests.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        backend: [webgpu]
        include:
          - os: ubuntu-26.04
            backend: vulkan
          - os: macos-26
            backend: metal
          - os: ubuntu-26.04
            backend: gl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MLN_RENDER_BACKEND: ${{ matrix.backend }}
      MLN_VULKAN_VALIDATION: ${{ matrix.backend == 'vulkan' && 'abort' || '0' }}
      MTL_DEBUG_LAYER: ${{ matrix.backend == 'metal' && '1' || '0' }}
      MTL_DEBUG_LAYER_ERROR_MODE: assert
    steps:
      - uses: actions/checkout@v7

      # Lavapipe for the GPU tests on Linux, the validation layer for the
      # Vulkan backend's and Mesa's EGL for the OpenGL backend's.
      - name: Install lavapipe
        if: runner.os == 'Linux'
        uses: ./.github/actions/lavapipe
        with:
          validation-layer: ${{ matrix.backend == 'vulkan' }}
          egl: ${{ matrix.backend == 'gl' }}

      # The tools that mise.toml pins, Rust from rust-toolchain.toml among
      # them, at the versions mise.lock records.
      - uses: jdx/mise-action@v5

      # For cargo-llvm-cov.
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      # Saves from main only, so pull requests restore main's dependencies
      # rather than each filling the cache with its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: mise run ci:coverage

      # The render suite's reports and actual/diff images, from the run with
      # the tile workers in process and the one through the worker codec
      # (cargo-llvm-cov builds in target/llvm-cov-target).
      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-tests-${{ runner.os }}-${{ matrix.backend }}
          path: |
            target/llvm-cov-target/tmp/render_tests
            target/llvm-cov-target/tmp/render_tests_through_the_codec
          if-no-files-found: ignore

      - name: Upload the coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # maplibre-native-ffi's C ABI suite against crates/mln_c (`mise run
  # test:c-abi`, tools/c-abi-test), under its Vulkan preset on lavapipe and its
  # OpenGL one on llvmpipe: each fails when any case fails. Also that
  # crates/mln_c's generated declarations are what its headers generate (`mise
  # run generate:c-abi`, which needs libclang).
  c-abi:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev libvulkan-dev libwayland-client0 libwayland-server0 libwayland-egl1 libegl-dev libgles-dev

      - name: Install lavapipe
        uses: ./.github/actions/lavapipe
        with:
          egl: true

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check the generated declarations
        run: |
          mise run generate:c-abi
          mise run ci:assert-clean

      - name: Test
        run: mise run test:c-abi

      - name: Test the OpenGL preset
        if: ${{ !cancelled() }}
        run: MLN_C_TEST_BACKEND=opengl mise run test:c-abi

  # The Cargo manifests: build each crates.io package from its packaged
  # sources, as the release does (RELEASING.md), and every test target, so a
  # dependency or test missing from a Cargo.toml shows up here. The test job
  # runs the tests.
  release-crate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Package
        run: mise run ci:package

  # The formatters and linters (`mise run check`, hk.pkl): formatting
  # (dprint.jsonc), the workflows, the tasks' scripts, the panic and
  # RefCell-borrow ratchet (tools/ratchet), clippy with the workspace's lints
  # (Cargo.toml) and the packages' licenses against deny.toml. Then the API
  # docs as docs.rs builds them, and clippy on the libraries and examples/web
  # for wasm32-unknown-unknown (`mise run check:wasm`, the browser build) and
  # on the C library for 32-bit x86 Linux (`mise run check:32bit`), all with
  # warnings as errors (mise.toml denies them in CI).
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The C compiler and libc headers for `mise run check:32bit`'s C
      # dependencies.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-i686-linux-gnu libc6-dev-i386-cross

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: mise run ci:lint

  # The oldest Rust the packages declare (`rust-version` in Cargo.toml) still
  # builds them and their tests.
  msrv:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: mise run ci:msrv

  # The browser build in headless Chromium (`mise run web:check --profile
  # release`, examples/web/README.md): views of the render suite, served offline from
  # its cache database to the page with its tile workers in Web Workers, each
  # frame compared with the native runner's render of the same view
  # (lavapipe). Twice: the module that draws with WebGPU, and the one that
  # draws with WebGL2 for browsers without it. Then the C library's browser
  # packages. The Chromium is Playwright's build, pinned, and runs them all on
  # the SwiftShader it bundles.
  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Lavapipe for the native runner's renders.
      - name: Install lavapipe
        uses: ./.github/actions/lavapipe

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.61.1-chromium

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Chromium that check.mjs uses. The runner's own Chrome brings the
      # system libraries it needs.
      - name: Install Chromium
        run: npx -y playwright@1.61.1 install chromium

      - name: Check
        run: mise run web:check --profile release --out "$RUNNER_TEMP/web-check"

      # The build and the native runner are the ones the step above made.
      - name: Check the WebGL2 module
        run:
          node examples/web/check/check.mjs --backend webgl2 --out
          "$RUNNER_TEMP/web-check-webgl2"

      # The C library's browser package, one per backend, driven through its
      # raw C ABI from a Web Worker (crates/mln_c/web-check). The dev profile:
      # the check needs no release build, and two more would outlast the job.
      - name: Check the C library's packages
        run: mise run c-web:check webgpu && mise run c-web:check gl

      # The page's TypeScript, against the modules' wasm-bindgen typings that
      # the check's build wrote.
      - name: Typecheck the page
        run: pnpm -C examples/web typecheck

      # How the page reads a wheel event (web/wheel.ts), against each
      # browser's events.
      - name: Test the page's wheel reading
        run: pnpm -C examples/web test

      # Each view's style, the page's frame (expected.png) and the native
      # render and diff (results/).
      - name: Upload the frames and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-check
          path: |
            ${{ runner.temp }}/web-check
            ${{ runner.temp }}/web-check-webgl2
          if-no-files-found: ignore

  # The one check for branch protection to require: it fails when a job above
  # failed or was cancelled.
  ci-passed:
    needs: [test, c-abi, release-crate, lint, msrv, web]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: The jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"

      - name: Fail if a job failed or was cancelled
        if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled')
        run: exit 1
