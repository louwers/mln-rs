name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every test (`just ci-coverage`): the libraries' tests and the shared
  # render, query and expression suites, on Linux (wgpu renders through
  # Vulkan/lavapipe) and macOS (through Metal), with their line coverage
  # uploaded to Codecov (codecov.yml). The differential tests against the C++
  # core are in louwers/mln-rs-difftests.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # GLFW for platform/glfw (glfw-sys finds it, X11 and Wayland through
      # pkg-config), and lavapipe for the GPU tests on Linux.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglfw3-dev libvulkan1 libwayland-dev libx11-dev mesa-vulkan-drivers pkg-config
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      - name: Install system packages
        if: runner.os == 'macOS'
        run: brew install glfw pkgconf

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-llvm-cov' }

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - name: Test
        run: just ci-coverage

      # The render suite's report and actual/diff images (cargo-llvm-cov
      # builds in target/llvm-cov-target).
      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-tests-${{ runner.os }}
          path: target/llvm-cov-target/tmp/render_tests
          if-no-files-found: ignore

      - name: Upload the coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # The Cargo manifests: build each crates.io package from its packaged
  # sources, as the release does (RELEASING.md), and every test target, so a
  # dependency or test missing from a Cargo.toml shows up here. The test job
  # runs the tests.
  release-crate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglfw3-dev libwayland-dev libx11-dev pkg-config

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          # Saved once per lockfile: the third-party crates dominate.
          key: release-crate-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-crate-${{ runner.os }}-

      - uses: taiki-e/install-action@v2
        with: { tool: just }

      - name: Package
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          just ci-package

  # Formatting (`just fmt`, every Rust file), the panic and TODO(port)
  # ratchet (`just ratchet`, tools/ratchet), clippy with the workspace's
  # lints (Cargo.toml) and the API docs as docs.rs builds them, all with
  # warnings as errors (the justfile denies them in CI).
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglfw3-dev libwayland-dev libx11-dev pkg-config

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-

      - uses: taiki-e/install-action@v2
        with: { tool: just }

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Lint
        run: just ci-lint

  # The oldest Rust the packages declare (`rust-version` in Cargo.toml) still
  # builds them and their tests.
  msrv:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglfw3-dev libwayland-dev libx11-dev pkg-config

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-${{ runner.os }}-

      - uses: taiki-e/install-action@v2
        with: { tool: just }

      - name: Check
        run: just ci-test-msrv

  # The one check for branch protection to require: it fails when a job above
  # failed or was cancelled.
  ci-passed:
    needs: [test, release-crate, lint, msrv]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: The jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"

      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
