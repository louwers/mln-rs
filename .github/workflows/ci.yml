name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which jobs and steps a pull request needs, from what it changes (`mise run
  # ci:plan`): the macOS test and backend jobs, web, and the packaging. Pushes
  # to main and manual runs run everything.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      test: ${{ steps.plan.outputs.test }}
      backend: ${{ steps.plan.outputs.backend }}
      web: ${{ steps.plan.outputs.web }}
      package: ${{ steps.plan.outputs.package }}
    steps:
      # The pull request's merge commit and its first parent, the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: plan
        run: |
          plan="$RUNNER_TEMP/plan"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-status HEAD^1 HEAD | bash mise-tasks/ci/plan > "$plan"
          else
            printf 'macos=true\nweb=true\npackage=true\n' > "$plan"
          fi
          cat "$plan"
          grep -E '^(web|package)=' "$plan" >> "$GITHUB_OUTPUT"
          linux='"os":"linux","runner":"ubuntu-26.04"'
          macos='"os":"macos","runner":"macos-26"'
          test="{$linux,\"backend\":\"webgpu\"}"
          backend="{$linux,\"backend\":\"vulkan\"},{$linux,\"backend\":\"gl\"}"
          if grep -qx macos=true "$plan"; then
            test+=",{$macos,\"backend\":\"metal\"}"
            backend+=",{$macos,\"backend\":\"webgpu\"}"
          fi
          echo "test={\"include\":[$test]}" >> "$GITHUB_OUTPUT"
          echo "backend={\"include\":[$backend]}" >> "$GITHUB_OUTPUT"

  # The formatters and linters (`mise run check`, hk.pkl), the API docs as
  # docs.rs builds them, clippy for wasm32 and 32-bit x86 Linux, a check of
  # the frame pacer for Android and OpenHarmony, the minimum Rust that
  # Cargo.toml declares and the C library's generated declarations against its
  # headers. When the plan asks, each crates.io package built from its
  # packaged sources with every test target (RELEASING.md). Warnings are
  # errors (mise.toml denies them in CI).
  lint:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The C compiler and libc headers for `mise run check:32bit`'s C
      # dependencies, and libclang for `mise run generate:c-abi`.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-i686-linux-gnu libc6-dev-i386-cross libclang-dev

      # The tools that mise.toml pins, Rust from rust-toolchain.toml among
      # them, at the versions mise.lock records.
      - uses: jdx/mise-action@v5

      # Saves from main only, so pull requests restore main's dependencies
      # rather than each filling the cache with its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: mise run ci:lint

      - name: Package
        if: needs.plan.outputs.package == 'true'
        run: mise run ci:package

  # Every test (`mise run ci:test`) on WebGPU on Linux (wgpu on Vulkan, on
  # lavapipe, Mesa's software rasterizer) and on the Metal backend on macOS,
  # under Metal's API validation, with their coverage uploaded to Codecov
  # (codecov.yml). macOS also runs clippy on the code that only it builds. The
  # differential tests against the C++ core are in louwers/mln-rs-difftests.
  test:
    needs: plan
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install lavapipe
        if: runner.os == 'Linux'
        uses: ./.github/actions/lavapipe

      - uses: jdx/mise-action@v5

      # For cargo-llvm-cov.
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        if: runner.os == 'macOS'
        run: mise run clippy

      - name: Test
        if: ${{ !cancelled() }}
        run: mise run ci:test ${{ matrix.backend }}

      # The render suites' reports and actual/diff images.
      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-tests-${{ matrix.os }}-${{ matrix.backend }}
          path: target/llvm-cov-target/tmp/render_tests*
          if-no-files-found: ignore

      - name: Upload the coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # The tests that depend on the backend (`mise run ci:test --backend-only`,
  # .config/nextest.toml) on the backends the test jobs don't run, with their
  # coverage: on Linux the Vulkan backend, under Vulkan's validation layer, and
  # the OpenGL backend (OpenGL ES 3.0 through EGL, on Mesa's llvmpipe); on
  # macOS WebGPU (wgpu on Metal). On Linux, then maplibre-native-ffi's C ABI
  # suite against crates/mln_c (`mise run test:c-abi`, tools/c-abi-test) under
  # its preset for the backend.
  backend:
    needs: plan
    name: backend (${{ matrix.os }}, ${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.backend) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # For the C ABI suite.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libvulkan-dev libwayland-client0 libwayland-server0 libwayland-egl1 libegl-dev libgles-dev

      - name: Install lavapipe
        if: runner.os == 'Linux'
        uses: ./.github/actions/lavapipe
        with:
          validation-layer: ${{ matrix.backend == 'vulkan' }}
          egl: ${{ matrix.backend == 'gl' }}

      - uses: jdx/mise-action@v5

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: mise run ci:test --backend-only ${{ matrix.backend }}

      - name: Test the C ABI
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          MLN_C_TEST_BACKEND:
            ${{ matrix.backend == 'gl' && 'opengl' || 'vulkan' }}
        run: mise run test:c-abi

      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-tests-${{ matrix.os }}-${{ matrix.backend }}
          path: target/llvm-cov-target/tmp/render_tests*
          if-no-files-found: ignore

      - name: Upload the coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # The browser build in headless Chromium (`mise run web:check --profile
  # release`, examples/web/README.md): views of the render suite, served offline from
  # its cache database to the page with its tile workers in Web Workers, each
  # frame compared with the native runner's render of the same view
  # (lavapipe). Twice: the module that draws with WebGPU, and the one that
  # draws with WebGL2 for browsers without it. Then the C library's browser
  # packages. The Chromium is Playwright's build, pinned, and runs them all on
  # the SwiftShader it bundles.
  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Lavapipe for the native runner's renders.
      - name: Install lavapipe
        uses: ./.github/actions/lavapipe

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('examples/web/pnpm-lock.yaml') }}

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Chromium that examples/web's playwright-core pins, which both
      # checks use. The runner's own Chrome brings the system libraries it
      # needs.
      - name: Install Chromium
        run: |
          pnpm -C examples/web install --frozen-lockfile
          pnpm -C examples/web exec playwright-core install --no-shell chromium

      - name: Check
        run: mise run web:check --profile release --out "$RUNNER_TEMP/web-check"

      # The build and the native runner are the ones the step above made.
      - name: Check the WebGL2 module
        run:
          node examples/web/check/check.mjs --backend webgl2 --out
          "$RUNNER_TEMP/web-check-webgl2"

      # A CJK font for the browser's sans-serif, in which the C library's
      # check draws its CJK label: the runner has none.
      - name: Install a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei

      # The C library's browser package, one per backend, driven through its
      # raw C ABI from a Web Worker (crates/mln_c/web-check). The dev profile:
      # the check needs no release build, and two more would outlast the job.
      - name: Check the C library's packages
        run: mise run c-web:check webgpu && mise run c-web:check gl

      # The page's TypeScript, against the modules' wasm-bindgen typings that
      # the check's build wrote.
      - name: Typecheck the page
        run: pnpm -C examples/web typecheck

      # How the page reads a wheel event (web/wheel.ts), against each
      # browser's events.
      - name: Test the page's wheel reading
        run: pnpm -C examples/web test

      # Each view's style, the page's frame (expected.png) and the native
      # render and diff (results/).
      - name: Upload the frames and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-check
          path: |
            ${{ runner.temp }}/web-check
            ${{ runner.temp }}/web-check-webgl2
          if-no-files-found: ignore

  # The one check for branch protection to require: it fails when a job above
  # failed or was cancelled. A job that the plan skips passes.
  ci-passed:
    needs: [plan, lint, test, backend, web]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: The jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"

      - name: Fail if a job failed or was cancelled
        if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled')
        run: exit 1
