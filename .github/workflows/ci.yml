name: ci

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      units:
        description: JSON array of coverage units to run (empty runs all)
        type: string
        default: ""
      secrets:
        description: Allow repository secrets (e.g. preview deployments)
        type: boolean
        default: true

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Keep every mise command (including task-scoped tool auto-installs such as
  # zig) locked to .config/mise/mise.lock so CI never resolves unlocked tools or
  # rewrites .config/mise/mise.lock.
  MISE_LOCKED: "1"

jobs:
  # Rubberstamp plans which coverage units a pull request needs, per
  # .config/rubberstamp.yml, and tools/ci/plan.py selects their jobs from
  # tools/ci/jobs.json. Pushes to main and manual runs without `inputs.units`
  # run every unit.
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2604
    # The Rubberstamp action waits up to ten minutes before running every unit.
    timeout-minutes: 15
    if: github.event.pull_request.state != 'closed'
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      secrets: ${{ steps.plan.outputs.secrets }}
      test: ${{ steps.plan.outputs.test }}
      backend: ${{ steps.plan.outputs.backend }}
      target: ${{ steps.plan.outputs.target }}
      prepare-device-tests: ${{ steps.plan.outputs.prepare-device-tests }}
    steps:
      - name: Plan coverage
        id: rubberstamp
        if: github.event_name == 'pull_request'
        uses: sargunv/rubberstamp/actions/plan@c8f1458d614fde78815ef07288cd7c12149da954 # main

      - name: Check out planner
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
          sparse-checkout: |
            .config/mise/tasks/ci
            tools/ci

      - name: Select jobs
        id: plan
        env:
          RUBBERSTAMP_ALL: ${{ steps.rubberstamp.outputs.all }}
          RUBBERSTAMP_UNITS: ${{ steps.rubberstamp.outputs.units }}
        run: bash .config/mise/tasks/ci/plan

  # The formatters and linters (`mise run check`, .config/hk.pkl), CI planner
  # tests, the API docs as docs.rs builds them, clippy for wasm32 and 32-bit x86
  # Linux, the minimum Rust that Cargo.toml declares and the C library's
  # generated declarations against its headers. Runs on every event without
  # waiting for the plan. Warnings are errors (.config/mise/config.toml denies
  # them in CI).
  lint:
    if: github.event.pull_request.state != 'closed'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "true"
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}

      # libclang for `mise run generate:c-abi`.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Lint
        run: mise run ci:lint

  # Each crates.io package built from its packaged sources with every test
  # target (RELEASING.md).
  package:
    needs: plan
    if:
      github.event.pull_request.state != 'closed' &&
      contains(fromJSON(needs.plan.outputs.jobs), 'package')
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Package
        run: mise run ci:package

  # Every test (`mise run ci:test`) on WebGPU on Linux (wgpu on Vulkan, on
  # lavapipe, Mesa's software rasterizer), on the Metal backend on macOS under
  # Metal's API validation, and on Direct3D 12 on Windows (WARP with DXC), with
  # coverage uploaded to Codecov (.github/codecov.yml) where enabled. Non-Linux
  # runners also run clippy on the code that only they build, and Linux runners
  # link the C library against glibc 2.17 (`mise run check:glibc`).
  test:
    needs: plan
    if:
      github.event.pull_request.state != 'closed' &&
      contains(fromJSON(needs.plan.outputs.jobs), 'test')
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # Blacksmith's checkout mirrors only on its Linux runners.
      - if: runner.os == 'Linux'
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - if: runner.os != 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: ${{ matrix.save_toolchains }}
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}
          llvm-tools: ${{ matrix.coverage }}
          lavapipe: ${{ runner.os == 'Linux' }}
          software-gpu: ${{ runner.os == 'Windows' && 'vulkan,wgl' || '' }}

      - name: Clippy
        if: runner.os != 'Linux'
        run: mise run clippy

      - name: Test
        if: ${{ !cancelled() }}
        env:
          BACKEND: ${{ matrix.backend }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          if [[ "$COVERAGE" == true ]]; then
            mise run ci:test "$BACKEND"
          else
            mise run ci:test --no-coverage "$BACKEND"
          fi

      - name: Check the glibc floor
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: mise run check:glibc

      # The render suites' reports and actual/diff images.
      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-tests-${{ matrix.os }}-${{ matrix.backend }}
          path: |
            target/llvm-cov-target/tmp/render_tests*
            target/tmp/render_tests*
          if-no-files-found: ignore

      - name: Upload the coverage to Codecov
        if: >-
          ${{ !cancelled() && matrix.coverage == 'true' &&
          fromJSON(needs.plan.outputs.secrets) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # The tests that depend on the backend (`mise run ci:test --backend-only`,
  # .config/nextest.toml) on the backends the test jobs don't run, with their
  # coverage where enabled: on Linux the Vulkan backend, under Vulkan's
  # validation layer, and the OpenGL backend (OpenGL ES 3.0 through EGL, on
  # Mesa's llvmpipe); on macOS WebGPU (wgpu on Metal); on Windows WebGPU,
  # Vulkan (Lavapipe with validation), and OpenGL (WGL on Mesa's llvmpipe). On
  # Linux, then the C ABI suite against crates/mln_c (`mise run test:c-abi`,
  # tools/c-abi-test) under its preset for the backend.
  backend:
    needs: plan
    if:
      github.event.pull_request.state != 'closed' &&
      contains(fromJSON(needs.plan.outputs.jobs), 'backend')
    name: backend (${{ matrix.os }}, ${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.backend) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - if: runner.os == 'Linux'
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - if: runner.os != 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}
          llvm-tools: ${{ matrix.coverage }}
          # Nextest's `backend` profile tests every backend crate (including
          # mln_vulkan and mln_gl's WGL tests) on every Windows backend job.
          software-gpu: ${{ runner.os == 'Windows' && 'vulkan,wgl' || '' }}

      # For the C ABI suite. Installed before lavapipe so apt does not
      # downgrade the pinned Vulkan loader or Mesa EGL packages.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libvulkan-dev libwayland-client0 libwayland-server0 libwayland-egl1 libegl-dev libgles-dev

      - name: Install lavapipe
        if: runner.os == 'Linux'
        uses: ./.github/actions/lavapipe
        with:
          validation-layer: ${{ matrix.backend == 'vulkan' }}
          egl: ${{ matrix.backend == 'gl' }}

      - name: Test
        env:
          BACKEND: ${{ matrix.backend }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          if [[ "$COVERAGE" == true ]]; then
            mise run ci:test --backend-only "$BACKEND"
          else
            mise run ci:test --backend-only --no-coverage "$BACKEND"
          fi

      - name: Test the C ABI
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          MLN_C_TEST_BACKEND:
            ${{ matrix.backend == 'gl' && 'opengl' || 'vulkan' }}
        run: mise run test:c-abi

      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-tests-${{ matrix.os }}-${{ matrix.backend }}
          path: |
            target/llvm-cov-target/tmp/render_tests*
            target/tmp/render_tests*
          if-no-files-found: ignore

      - name: Upload the coverage to Codecov
        if: >-
          ${{ !cancelled() && matrix.coverage == 'true' &&
          fromJSON(needs.plan.outputs.secrets) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # Cross-compiled targets linted with clippy and tested on their simulator,
  # emulator, or virtual machine through devices-cli (`mise run ci:target`).
  target:
    needs: plan
    if:
      github.event.pull_request.state != 'closed' &&
      contains(fromJSON(needs.plan.outputs.jobs), 'target')
    name: target (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.target) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - if: runner.os == 'Linux'
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - if: runner.os != 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          mise-env: ${{ matrix.mise_env }}
          device: ${{ matrix.device }}
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}

      # Named so an infra retry workflow can tell a device boot failure apart
      # from a build or test failure.
      - name: Boot ${{ matrix.device }}
        if: matrix.device_command != ''
        env:
          DEVICE_COMMAND: ${{ matrix.device_command }}
        run: mise exec -- bash -euo pipefail -c "$DEVICE_COMMAND"

      - name: Clippy and test
        env:
          CLIPPY_TARGETS: ${{ matrix.clippy_targets }}
          TEST_TARGET: ${{ matrix.test_target }}
          BACKEND: ${{ matrix.backend }}
        run: >-
          mise run ci:target --clippy-targets "$CLIPPY_TARGETS" --test-target
          "$TEST_TARGET" --backend "$BACKEND"

      - name: Upload device logs
        if: failure() && matrix.device != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-logs-${{ matrix.target }}-${{ github.run_attempt }}
          path: ~/.local/state/devices-cli/logs
          if-no-files-found: ignore

      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-tests-${{ matrix.target }}
          path: target/*/tmp/render_tests*
          if-no-files-found: ignore

  # The tests built for AWS Device Farm's phones, one package per platform
  # (`mise run device-farm:package <platform>`). The maplibre-device-farm GitHub
  # App runs main's packages on the phones once this job has built them
  # (.config/device-farm.toml, tools/device-farm/README.md). A pull request
  # builds a platform's package only when it changes its packaging, and tests
  # on the emulator and the simulator in the target jobs.
  prepare-device-tests:
    needs: plan
    if:
      github.event.pull_request.state != 'closed' &&
      contains(fromJSON(needs.plan.outputs.jobs), 'prepare-device-tests')
    name: prepare-${{ matrix.platform }}-device-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.prepare-device-tests) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - if: runner.os == 'Linux'
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - if: runner.os != 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          mise-env: ${{ matrix.mise_env }}
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: mise run device-farm:package "$PLATFORM"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}-device-tests
          path: target/device-farm/${{ matrix.platform }}
          retention-days: 3
          # The package's archives are compressed already.
          compression-level: 0
          if-no-files-found: error

  # The browser build in headless Chromium (`mise run web:check --profile
  # release`, examples/web/README.md): views of the render suite, served offline from
  # its cache database to the page with its tile workers in Web Workers, each
  # frame compared with the native runner's render of the same view
  # (lavapipe). Twice: the module that draws with WebGPU, and the one that
  # draws with WebGL2 for browsers without it. Then the C library's browser
  # packages. The Chromium is Playwright's build, pinned, and runs them all on
  # the SwiftShader it bundles.
  web:
    needs: plan
    if:
      github.event.pull_request.state != 'closed' &&
      contains(fromJSON(needs.plan.outputs.jobs), 'web')
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 40
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('examples/web/pnpm-lock.yaml') }}

      - uses: ./.github/actions/setup-ci-deps
        with:
          lavapipe: "true"
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}

      # The Chromium that examples/web's playwright-core pins, which both
      # checks use. The runner's own Chrome brings the system libraries it
      # needs.
      - name: Install Chromium
        run: |
          pnpm -C examples/web install --frozen-lockfile
          pnpm -C examples/web exec playwright-core install --no-shell chromium

      - name: Check
        run: mise run web:check --profile release --out "$RUNNER_TEMP/web-check"

      # The build and the native runner are the ones the step above made.
      - name: Check the WebGL2 module
        run:
          node examples/web/check/check.mjs --backend webgl2 --out
          "$RUNNER_TEMP/web-check-webgl2"

      # A CJK font for the browser's sans-serif, in which the C library's
      # check draws its CJK label: the runner has none.
      - name: Install a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei

      # The C library's browser package, one per backend, driven through its
      # raw C ABI from a Web Worker (crates/mln_c/web-check). The dev profile:
      # the check needs no release build, and two more would outlast the job.
      - name: Check the C library's packages
        run: mise run c-web:check webgpu && mise run c-web:check gl

      # The page's TypeScript, against the modules' wasm-bindgen typings that
      # the check's build wrote.
      - name: Typecheck the page
        run: pnpm -C examples/web typecheck

      # How the page reads a wheel event (web/wheel.ts), against each
      # browser's events.
      - name: Test the page's wheel reading
        run: pnpm -C examples/web test

      # Each view's style, the page's frame (expected.png) and the native
      # render and diff (results/).
      - name: Upload the frames and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-check
          path: |
            ${{ runner.temp }}/web-check
            ${{ runner.temp }}/web-check-webgl2
          if-no-files-found: ignore

      - name: Upload the browser demo build
        if: >-
          fromJSON(needs.plan.outputs.secrets) && (github.event_name ==
          'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: examples/web/dist
          retention-days: 1
          if-no-files-found: error

  # Publishes the browser demo that `web` built to Cloudflare Pages
  # (https://mln-rs.pages.dev, or https://pr-<N>.mln-rs.pages.dev on pull
  # requests). Runs in its own job without checking out PR code so the
  # Cloudflare credentials stay isolated in the `cloudflare-pages` environment.
  web-preview:
    needs: [plan, web]
    if: >-
      github.event.pull_request.state != 'closed' &&
      fromJSON(needs.plan.outputs.secrets) && (github.event_name ==
      'pull_request' || github.ref == 'refs/heads/main')
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 10
    permissions: {}
    environment:
      name: cloudflare-pages
      url: >-
        ${{ steps.deploy.outputs.pages-deployment-alias-url ||
        steps.deploy.outputs.deployment-url }}
    steps:
      - name: Download the browser demo build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          CLOUDFLARE_BRANCH: >-
            ${{ github.event_name == 'pull_request' && format('pr-{0}',
            github.event.number) || 'main' }}
          CLOUDFLARE_COMMIT:
            ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.167.0"
          command: >-
            pages deploy dist --project-name=mln-rs --branch=${{
            env.CLOUDFLARE_BRANCH }} --commit-hash=${{ env.CLOUDFLARE_COMMIT }}

      - name: Report the preview URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          url="${PREVIEW_URL:-$DEPLOYMENT_URL}"
          echo "Cloudflare Pages preview: ${url}" >> "$GITHUB_STEP_SUMMARY"

  # That no commit credits an AI tool as its author, committer or co-author
  # (tools/check-commit-authors.sh): a pull request's own commits, whose
  # authors a squash merge makes co-authors, and its author, whom the squash
  # commit may credit; on main, the pushed commits, whose messages the merge
  # dialog may have changed. `ci-passed` checks auto-merge's saved message.
  commits:
    if: github.event.pull_request.state != 'closed'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    steps:
      # Every commit, without their files' contents.
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check the pull request's author
        if: github.event_name == 'pull_request'
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          ID: ${{ github.event.pull_request.user.id }}
        run: |
          tools/check-commit-authors.sh --author \
            "<$ID+$LOGIN@users.noreply.github.com>" || {
            echo "::error::A person should open this pull request, so that its squash merge credits them."
            exit 1
          }

      - name: Check the commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The merge commit's parents: the base and the pull request.
            range=HEAD^1..HEAD^2
          elif [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range=$BEFORE..HEAD
          else
            range=HEAD^!
          fi
          tools/check-commit-authors.sh "$range"

  # The one check for branch protection to require: a skipped job passes a
  # required check, so `plan` must succeed and every other job must succeed or
  # be skipped.
  ci-passed:
    needs:
      [
        plan,
        lint,
        package,
        test,
        backend,
        target,
        prepare-device-tests,
        web,
        web-preview,
        commits,
      ]
    if: always() && github.event.pull_request.state != 'closed'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: read # check out tools/check-commit-authors.sh
      pull-requests: read # read the message auto-merge saved
    steps:
      # GitHub fixes a squash commit's message when auto-merge is enabled,
      # from the commits and description of that moment, and merges with it
      # once this check passes. Read it live in the last job, so that one
      # saved before commits it lists were rewritten is checked too. One
      # saved after this step reads it goes unchecked.
      - name: Check out the author check
        if: github.event_name == 'pull_request'
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
          sparse-checkout: tools/check-commit-authors.sh
          sparse-checkout-cone-mode: false

      - name: Check auto-merge's squash message
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          message=$(mktemp)
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '.auto_merge // empty | "\(.commit_title)\n\n\(.commit_message)"' \
            >"$message"
          tools/check-commit-authors.sh --squash-message "$message" || {
            echo "::error::Disable auto-merge, enable it again with a message that credits AI tools with Assisted-by: trailers, then rerun this job."
            exit 1
          }

      - name: Require plan and every planned job
        env:
          PLAN: ${{ needs.plan.result }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          test "$PLAN" = success &&
            jq -e -n --argjson results "$NEEDS" \
              'all($results[]; .result == "success" or .result == "skipped")'
