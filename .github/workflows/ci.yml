name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every test (`just ci-coverage`): the libraries' tests and the shared
  # render, query and expression suites (the render and query suites twice:
  # also with the tile workers behind the worker codec), with their line
  # coverage uploaded to Codecov (codecov.yml). The headless renders go
  # through each backend of a platform. On Linux: WebGPU (wgpu on
  # Vulkan/lavapipe), the Vulkan backend itself (MLN_RENDER_BACKEND=vulkan,
  # on lavapipe under Vulkan's validation layer) and the OpenGL backend
  # (MLN_RENDER_BACKEND=gl, which `just` builds in: OpenGL ES 3.0 through
  # EGL, on Mesa's llvmpipe). On macOS: WebGPU (wgpu on Metal) and the Metal
  # backend itself (MLN_RENDER_BACKEND=metal), under Metal's API validation.
  # Either validation aborts on an error. The differential tests against the
  # C++ core are in louwers/mln-rs-difftests.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        backend: [webgpu]
        include:
          - os: ubuntu-26.04
            backend: vulkan
          - os: macos-26
            backend: metal
          - os: ubuntu-26.04
            backend: gl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MLN_RENDER_BACKEND: ${{ matrix.backend }}
      MLN_VULKAN_VALIDATION: ${{ matrix.backend == 'vulkan' && 'abort' || '0' }}
      MTL_DEBUG_LAYER: ${{ matrix.backend == 'metal' && '1' || '0' }}
      MTL_DEBUG_LAYER_ERROR_MODE: assert
    steps:
      - uses: actions/checkout@v7

      # Lavapipe for the GPU tests on Linux, the validation layer for the
      # Vulkan backend's and Mesa's EGL for the OpenGL backend's.
      - name: Install lavapipe
        if: runner.os == 'Linux'
        uses: ./.github/actions/lavapipe
        with:
          validation-layer: ${{ matrix.backend == 'vulkan' }}
          egl: ${{ matrix.backend == 'gl' }}

      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-llvm-cov' }

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --component llvm-tools-preview --no-self-update

      # Saves from main only, so pull requests restore main's dependencies
      # rather than each filling the cache with its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: just ci-coverage

      # The render suite's reports and actual/diff images, from the run with
      # the tile workers in process and the one through the worker codec
      # (cargo-llvm-cov builds in target/llvm-cov-target).
      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-tests-${{ runner.os }}-${{ matrix.backend }}
          path: |
            target/llvm-cov-target/tmp/render_tests
            target/llvm-cov-target/tmp/render_tests_through_the_codec
          if-no-files-found: ignore

      - name: Upload the coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # maplibre-native-ffi's C ABI suite against crates/mln_c (`just c-abi-test`,
  # tools/c-abi-test), its GPU fixtures on lavapipe: it fails when a case fails
  # that tools/c-abi-test/expected-failures.txt doesn't list, or a listed case
  # passes. Also that crates/mln_c's generated declarations are what its
  # headers generate (`just generate-c-abi`, which needs libclang).
  c-abi:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev libvulkan-dev libwayland-client0 libwayland-server0

      - name: Install lavapipe
        uses: ./.github/actions/lavapipe

      - uses: taiki-e/install-action@v2
        with: { tool: just }

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check the generated declarations
        run: |
          just generate-c-abi
          just assert-git-is-clean

      - name: Test
        run: just c-abi-test -v

  # The Cargo manifests: build each crates.io package from its packaged
  # sources, as the release does (RELEASING.md), and every test target, so a
  # dependency or test missing from a Cargo.toml shows up here. The test job
  # runs the tests.
  release-crate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with: { tool: just }

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Package
        run: just ci-package

  # Formatting (`just fmt`, every Rust file, with the nightly rustfmt the
  # justfile pins), the panic and TODO(port) ratchet (`just ratchet`,
  # tools/ratchet), clippy with the workspace's lints (Cargo.toml), the API
  # docs as docs.rs builds them, and clippy on the libraries and examples/web
  # for wasm32-unknown-unknown (`just check-wasm`, the browser build), all
  # with warnings as errors (the justfile denies them in CI), and the
  # packages' licenses against deny.toml (`just licenses`).
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-deny' }

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: just ci-lint

  # The oldest Rust the packages declare (`rust-version` in Cargo.toml) still
  # builds them and their tests.
  msrv:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with: { tool: just }

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: just ci-test-msrv

  # The browser build in headless Chromium (`just profile=release web-check`,
  # examples/web/README.md): views of the render suite, served offline from
  # its cache database to the page with its tile workers in Web Workers, each
  # frame compared with the native runner's render of the same view
  # (lavapipe). Twice: the module that draws with WebGPU, and the one that
  # draws with WebGL2 for browsers without it. The Chromium is Playwright's
  # build, pinned, and runs both on the SwiftShader it bundles.
  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Lavapipe for the native runner's renders.
      - name: Install lavapipe
        uses: ./.github/actions/lavapipe

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.61.1-chromium

      - uses: taiki-e/install-action@v2
        with: { tool: 'just,wasm-bindgen@0.2.130' }

      # pnpm, the version in examples/web/package.json, for the page's Vite
      # build; the runner has Node.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: examples/web/package.json
          cache: true
          cache_dependency_path: examples/web/pnpm-lock.yaml

      # wasm-opt, which `just profile=release web` runs, from binaryen's
      # latest release.
      - name: Install binaryen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo WebAssembly/binaryen --pattern 'binaryen-*-x86_64-linux.tar.gz' --output - |
            tar -xz -C "$RUNNER_TEMP"
          echo "$(echo "$RUNNER_TEMP"/binaryen-version_*)/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Chromium that check.mjs uses. The runner's own Chrome brings the
      # system libraries it needs.
      - name: Install Chromium
        run: npx -y playwright@1.61.1 install chromium

      - name: Check
        run: just profile=release web-check --out "$RUNNER_TEMP/web-check"

      # The build and the native runner are the ones the step above made.
      - name: Check the WebGL2 module
        run: node examples/web/check/check.mjs --backend webgl2 --out "$RUNNER_TEMP/web-check-webgl2"

      # The page's TypeScript, against the modules' wasm-bindgen typings that
      # the check's build wrote.
      - name: Typecheck the page
        run: pnpm -C examples/web typecheck

      # Each view's style, the page's frame (expected.png) and the native
      # render and diff (results/).
      - name: Upload the frames and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-check
          path: |
            ${{ runner.temp }}/web-check
            ${{ runner.temp }}/web-check-webgl2
          if-no-files-found: ignore

  # The one check for branch protection to require: it fails when a job above
  # failed or was cancelled.
  ci-passed:
    needs: [test, c-abi, release-crate, lint, msrv, web]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: The jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"

      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
