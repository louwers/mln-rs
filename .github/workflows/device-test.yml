name: device-test

# Schedules the Android tests that CI's prepare-device-tests job packaged on
# AWS Device Farm's phones, for pull requests from forks too. It reports every
# CI run's commit as the `device-test / android` status, which merging into
# main requires: pending while the phones run, or passed when the plan left
# the tests out. It starts with the CI run and schedules once the job has built
# the package, while the rest of CI runs. The device-farm-watch workflow waits
# for the run, and device-farm-finish reports its result
# (tools/device-farm/README.md).

on:
  workflow_run:
    workflows: [ci]
    types: [requested]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group:
    device-test-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  STATUS_CONTEXT: device-test / android

jobs:
  schedule:
    if: github.repository == 'maplibre/mln-rs'
    runs-on: ubuntu-26.04
    # Mostly the wait for CI's job, which can queue for a runner.
    timeout-minutes: 120
    environment:
      name: workflow-run
      deployment: false
    permissions:
      actions: write # downloads the package from the CI run, starts the watcher
      id-token: write # assumes the AWS role
      statuses: write # reports the run on the commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/device-farm

      # Until it finished, or the CI run did without it. Each attempt of a run
      # lists all of its jobs, so a run without the job is one of a branch from
      # before the job existed.
      - name: Wait for CI's prepare-device-tests job
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS:
            repos/${{ github.repository }}/actions/runs/${{
            github.event.workflow_run.id }}/attempts/${{
            github.event.workflow_run.run_attempt }}/jobs?per_page=100
          RUN:
            repos/${{ github.repository }}/actions/runs/${{
            github.event.workflow_run.id }}
        run: |
          while true; do
            job=$(gh api "$JOBS" --jq '.jobs[] | select(.name == "prepare-device-tests") | "\(.status) \(.conclusion)"')
            if [[ $job == completed* ]]; then
              echo "result=${job#completed }" | tee -a "$GITHUB_OUTPUT"
              exit
            fi
            if [[ -z $job && $(gh api "$RUN" --jq .status) == completed ]]; then
              echo "result=missing" | tee -a "$GITHUB_OUTPUT"
              exit
            fi
            sleep 20
          done

      - name: Download the test package
        if: steps.prepared.outputs.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-device-tests
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package

      - name: Find the test package
        id: package
        if: steps.prepared.outputs.result == 'success'
        run: |
          file=$RUNNER_TEMP/package/android-tests.zip
          if [[ -f $file && ! -L $file ]]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
          else
            echo "The CI run built no Android test package."
          fi

      - name: Configure AWS credentials
        if: steps.package.outputs.file
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: mln-rs-device-test-${{ github.run_id }}

      # Named for the commit, which device-farm-finish reports on. A pull
      # request's runs share a key, so a newer commit's stops the one before.
      - name: Schedule the tests on AWS Device Farm
        id: schedule
        if: steps.package.outputs.file
        env:
          AWS_DEVICE_FARM_PROJECT_ARN: ${{ vars.AWS_DEVICE_FARM_PROJECT_ARN }}
          PACKAGE: ${{ steps.package.outputs.file }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD:
            ${{ github.event.workflow_run.head_repository.full_name }}:${{
            github.event.workflow_run.head_branch }}
        run: |
          key=
          if [[ $EVENT == pull_request ]]; then
            key=$(printf '%s' "$HEAD" | sha256sum | cut -c 1-12)
          fi
          tools/device-farm/schedule.sh "$PACKAGE" "mln-rs $HEAD_SHA $EVENT" "$key"

      # Unless one is waiting to start: a running watcher may be about to exit
      # without seeing the new run.
      - name: Start the watcher
        if: steps.schedule.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $(gh run list --workflow device-farm-watch.yml --json status --jq 'all(.[]; .status == "in_progress" or .status == "completed")') == true ]]; then
            gh workflow run device-farm-watch.yml
          fi

      - name: Report the tests on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED: ${{ steps.prepared.outputs.result }}
          OUTCOME: ${{ steps.schedule.outcome }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          case $PREPARED:$OUTCOME in
            success:success) state=pending description="Running on AWS Device Farm's phones" ;;
            skipped:*) state=success description="Not needed: the plan left the Android tests out" ;;
            failure:*) state=failure description="CI couldn't build the tests" ;;
            missing:*) state=error description="This branch's CI builds no tests for the phones: merge main" ;;
            *) state=error description="The tests weren't scheduled" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" \
            -f context="$STATUS_CONTEXT" -f description="$description" -f target_url="$RUN_URL"
