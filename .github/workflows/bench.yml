name: bench

on:
  workflow_dispatch:
    inputs:
      base:
        description: The Git ref the checkout is compared with
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A branch's benchmarks against a base (`mise run bench:compare`,
  # tools/bench/README.md), run by hand: it takes about half an hour, too
  # long for every pull request, and bench-nightly.yml compares main every
  # night. GitHub's runners have no GPU, so both sides draw on lavapipe,
  # where the times are noisy and the report says so. The allocations count
  # the same as on any machine, so a worse `allocs` or `peak_heap_mib`
  # verdict fails the job. The report is in the job's summary.
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # Both sides build with these, so they still compare like with like,
      # in less time than the release profile's fat LTO.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      # The base is checked out in a worktree, so the history comes too.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install lavapipe
        uses: ./.github/actions/lavapipe

      # The tools that mise.toml pins, Rust from rust-toolchain.toml among
      # them, at the versions mise.lock records.
      - uses: jdx/mise-action@v5

      # Saves from main only, as in ci.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The basemap fixture that tools/bench/fixtures.json pins.
      - uses: actions/cache@v6
        with:
          path: target/bench-fixtures
          key: bench-fixtures-${{ hashFiles('tools/bench/fixtures.json') }}

      # The cases that load tiles and draw them: jumps cold and warm, a
      # frame's cost, an idle map, the camera swinging over a slow network,
      # and the basemap style's load.
      - name: Compare
        env:
          BASE: ${{ inputs.base }}
        run: >-
          mise run bench:compare "$BASE"
          --filter Load/Jump --filter Frame/Throughput --filter Frame/Idle --filter Frame/Oscillate
          --filter Load/Style/basemap --fail-on allocs --fail-on peak_heap_mib | tee report.md

      - name: Report
        if: always()
        run: |
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi
