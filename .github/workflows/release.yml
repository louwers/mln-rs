name: release

# Releases the workspace in Cargo.toml: mln-rs and its internal mln-rs-*
# crates, all at the workspace's version (RELEASING.md). On every push to
# main, `version` checks whether that version has its GitHub release, which
# a release creates last. Once a release pull request (release-pr.yml)
# merges, it doesn't: `release` publishes the packages, tags the commit
# v<version> and creates the GitHub release. A release that failed part way
# runs again on the next push, or by hand, from the commit that set the
# version: packages crates.io already has at this version are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One run at a time, so that a push's `version` check waits for a release
# that is running, and then finds its GitHub release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A few seconds, so that a push that releases nothing costs no more. Forks
  # release nothing.
  version:
    if: ${{ !github.event.repository.fork }}
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    outputs:
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
          sparse-checkout: /Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Look for the version's GitHub release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if out=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            released=true
          elif [[ $out == "release not found" ]]; then
            released=false
          else
            echo "::error::$out"
            exit 1
          fi
          echo "v$version released: $released"
          echo "released=$released" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if:
      github.event_name == 'workflow_dispatch' || needs.version.outputs.released
      == 'false'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 60
    # The crates' Trusted Publishing configs on crates.io name this workflow
    # and environment: only this job gets a token that publishes them.
    environment: release
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # the OIDC token that crates.io trades for its own
    steps:
      - name: Require the default branch
        if:
          github.ref != format('refs/heads/{0}',
          github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Run the release from $DEFAULT_BRANCH."
          exit 1

      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          # The history, to find the commit that set the version.
          fetch-depth: 0
          persist-credentials: false

      # The commit that set the version, normally the release pull request's
      # merge, so that a release that runs again, on a later push or by hand,
      # packages and tags the same sources.
      - name: Check out the commit that set the version
        run: |
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          commit=$(git log -1 --first-parent --format=%H -G "^version = \"${version//./\\.}\"$" -- Cargo.toml)
          if [[ -z $commit ]]; then
            echo "::error::No commit on this branch sets version $version in Cargo.toml."
            exit 1
          fi
          git checkout --quiet --detach "$commit"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update

      # The version, and the packages to publish, each after the ones it
      # depends on: all but the publish = false ones. Cargo drops in-repo
      # dev-dependencies from a published package, so they don't count.
      - name: Version
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1 --locked)
          echo "VERSION=$(jq -r '.packages[] | select(.name == "mln-rs") | .version' <<< "$metadata")" >> "$GITHUB_ENV"
          packages=$(python3 -I -c '
          import json, sys
          packages = {p["name"]: p for p in json.load(sys.stdin)["packages"] if p["publish"] is None}
          order = []
          def visit(name):
              if name not in order:
                  for dep in packages[name]["dependencies"]:
                      if dep["kind"] != "dev" and dep["name"] in packages:
                          visit(dep["name"])
                  order.append(name)
          for name in sorted(packages):
              visit(name)
          print(" ".join(order))
          ' <<< "$metadata")
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"

      # Builds each package to publish from its packaged sources. Packages
      # resolve each other locally, so this works before any of them is on
      # crates.io. The publish = false ones aren't packaged: their
      # dependencies on each other would resolve from crates.io.
      - name: Package
        run: |
          args=()
          for package in $PACKAGES; do
            args+=("--package=$package")
          done
          cargo package --locked "${args[@]}"

      # Trusted Publishing: a crates.io token for the crates whose config
      # names this workflow and environment (mise run
      # release:setup-trusted-publishing). It lasts 30 minutes, and the
      # action's post step revokes it.
      - name: Authenticate with crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # One at a time, each waiting for the last to reach the index. Package
      # verified these exact packages, so skip the second build. A crate that
      # requires Trusted Publishing gets its token. Any other, such as a new
      # crate, which Trusted Publishing can't create, gets CARGO_REGISTRY_TOKEN.
      - name: Publish
        env:
          TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates-io.outputs.token }}
          ACCOUNT_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          USER_AGENT: mln-rs-release (https://github.com/maplibre/mln-rs)
        run: |
          for package in $PACKAGES; do
            if curl -sf -o /dev/null -A "$USER_AGENT" "https://crates.io/api/v1/crates/$package/$VERSION"; then
              echo "crates.io has $package $VERSION."
              continue
            fi
            # null for a crate that isn't on crates.io yet.
            trustpub_only=$(curl -sS -A "$USER_AGENT" "https://crates.io/api/v1/crates/$package" | jq .crate.trustpub_only)
            if [[ $trustpub_only == true ]]; then
              token=$TRUSTED_PUBLISHING_TOKEN
            else
              token=$ACCOUNT_TOKEN
            fi
            CARGO_REGISTRY_TOKEN=$token cargo publish --locked --no-verify --package "$package"
          done

      # The release notes are the version's section of CHANGELOG.md, which
      # the release pull request wrote, or else a link to crates.io.
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The $tag release exists."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          if [[ -f CHANGELOG.md ]]; then
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found
            ' CHANGELOG.md > "$notes"
          fi
          if [[ ! -s $notes ]]; then
            echo "https://crates.io/crates/mln-rs/$VERSION" > "$notes"
          fi
          files=()
          for package in $PACKAGES; do
            files+=("target/package/$package-$VERSION.crate")
          done
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "$tag" \
            --notes-file "$notes" \
            "${files[@]}"
