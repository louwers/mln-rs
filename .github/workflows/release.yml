name: release

# Releases the workspace in Cargo.toml: mln-rs and its internal mln-rs-*
# crates, all at the workspace's version (RELEASING.md). On every push to
# main, `version` checks whether that version has its GitHub release, which
# a release creates last. Once a release pull request (release-pr.yml)
# merges, it doesn't: `release` publishes the packages, tags the commit
# v<version> and creates the GitHub release. A release that failed part way
# runs again on the next push, or by hand, from the commit that set the
# version: packages crates.io already has at this version are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so that a push's `version` check waits for a release
# that is running, and then finds its GitHub release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A few seconds, so that a push that releases nothing costs no more. Forks
  # release nothing.
  version:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: /Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Look for the version's GitHub release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if out=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            released=true
          elif [[ $out == "release not found" ]]; then
            released=false
          else
            echo "::error::$out"
            exit 1
          fi
          echo "v$version released: $released"
          echo "released=$released" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if:
      github.event_name == 'workflow_dispatch' || needs.version.outputs.released
      == 'false'
    runs-on: ubuntu-26.04
    # The publish step waits out crates.io's limit on new crates, which the
    # first release of new packages runs into.
    timeout-minutes: 360
    permissions:
      contents: write # the tag and the GitHub release
    steps:
      - name: Require the default branch
        if:
          github.ref != format('refs/heads/{0}',
          github.event.repository.default_branch)
        run: |
          echo "::error::Run the release from ${{ github.event.repository.default_branch }}."
          exit 1

      - uses: actions/checkout@v7
        with:
          # The history, to find the commit that set the version.
          fetch-depth: 0
          persist-credentials: false

      # The commit that set the version, normally the release pull request's
      # merge, so that a release that runs again, on a later push or by hand,
      # packages and tags the same sources.
      - name: Check out the commit that set the version
        run: |
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          commit=$(git log -1 --first-parent --format=%H -G "^version = \"${version//./\\.}\"$" -- Cargo.toml)
          if [[ -z $commit ]]; then
            echo "::error::No commit on this branch sets version $version in Cargo.toml."
            exit 1
          fi
          git checkout --quiet --detach "$commit"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update

      # The version, and the packages to publish: all but the publish = false
      # ones.
      - name: Version
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1 --locked)
          echo "VERSION=$(jq -r '.packages[] | select(.name == "mln-rs") | .version' <<< "$metadata")" >> "$GITHUB_ENV"
          echo "PACKAGES=$(jq -r '[.packages[] | select(.publish == null) | .name] | join(" ")' <<< "$metadata")" >> "$GITHUB_ENV"

      # Builds each package from its packaged sources. Packages resolve each
      # other locally, so this works before any of them is on crates.io. The
      # desktop app is never released (the `package` task).
      - name: Package
        run: cargo package --workspace --locked --exclude mln-rs-desktop

      # In dependency order, waiting for each to reach the index. Package
      # verified these exact packages, so skip the second build. A 429 is
      # crates.io's limit on new crates: wait, then publish the rest.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          USER_AGENT: mln-rs-release (https://github.com/louwers/mln-rs)
        run: |
          set -o pipefail
          while true; do
            skip=()
            for package in $PACKAGES; do
              if curl -sf -o /dev/null -A "$USER_AGENT" "https://crates.io/api/v1/crates/$package/$VERSION"; then
                skip+=("--exclude=$package")
              fi
            done
            if [[ ${#skip[@]} == $(wc -w <<< "$PACKAGES") ]]; then
              echo "crates.io has every package at $VERSION."
              break
            fi
            if cargo publish --workspace --locked --no-verify "${skip[@]}" 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
              break
            fi
            grep -q "status 429" "$RUNNER_TEMP/publish.log" || exit 1
            echo "Rate-limited by crates.io; retrying in 10 minutes."
            sleep 600
          done

      # The release notes are the version's section of CHANGELOG.md, which
      # the release pull request wrote, or else a link to crates.io.
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The $tag release exists."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          if [[ -f CHANGELOG.md ]]; then
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found
            ' CHANGELOG.md > "$notes"
          fi
          if [[ ! -s $notes ]]; then
            echo "https://crates.io/crates/mln-rs/$VERSION" > "$notes"
          fi
          files=()
          for package in $PACKAGES; do
            files+=("target/package/$package-$VERSION.crate")
          done
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "$tag" \
            --notes-file "$notes" \
            "${files[@]}"
