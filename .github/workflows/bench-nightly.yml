name: bench-nightly

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      base:
        description:
          The Git ref main is compared with (main a day earlier when empty)
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Main against main a day earlier, every scenario (`mise run bench:compare`,
  # tools/bench/README.md), on lavapipe, the CPU rasterizer a server without
  # a GPU draws on. One run per side, so only counts get verdicts: the
  # runner's times are noise, and it counts no instructions. A worse verdict
  # of 1% or more (smaller ones are listed in the summary only) opens the "Nightly benchmarks: main got worse" issue, or comments on it
  # when it's open already, and a night without one closes it
  # (tools/bench/verdicts.py). The verdicts are in the job's summary too.
  # The job fails, with no verdicts, on a night when the harness doesn't
  # build against the base. Only in this repository, not in forks.
  compare:
    if: github.repository == 'louwers/mln-rs'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      # The base is checked out in a worktree, so the history comes too.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Pick the base
        id: base
        env:
          BASE: ${{ inputs.base }}
        run: |
          if [ -z "$BASE" ]; then BASE=$(git rev-list -1 --before='24 hours ago' HEAD); fi
          base=$(git rev-parse --verify "$BASE^{commit}")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install lavapipe
        if: steps.base.outputs.changed == 'true'
        uses: ./.github/actions/lavapipe

      # The tools that mise.toml pins, Rust from rust-toolchain.toml among
      # them, at the versions mise.lock records.
      - uses: jdx/mise-action@v5
        if: steps.base.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.base.outputs.changed == 'true'

      # The fixture snapshot that tools/bench/fixtures.json pins.
      - uses: actions/cache@v6
        if: steps.base.outputs.changed == 'true'
        with:
          path: ~/.cache/mln-rs/bench-fixtures
          key: bench-fixtures-${{ hashFiles('tools/bench/fixtures.json') }}

      - name: Compare
        if: steps.base.outputs.changed == 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: mise run bench:compare "$BASE" -- --json > comparison.json

      - name: Report, and file or update the issue
        if: steps.base.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I tools/bench/verdicts.py comparison.json --min-change 1
          --issue --head "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Report that nothing changed
        if: steps.base.outputs.changed == 'false'
        run:
          echo "No commits on main in the last day." >> "$GITHUB_STEP_SUMMARY"
