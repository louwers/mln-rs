name: bench-nightly

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: The Git ref main is compared with (main a day earlier when empty)
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Main against main a day earlier, every case (`just bench-compare`,
  # tools/bench/README.md), on lavapipe. A worse verdict opens the
  # "Nightly benchmarks: main got worse" issue with the report, or comments
  # on it when it's open already, and a night without one closes it
  # (tools/bench/nightly.py). The report is in the job's summary too. Only
  # in this repository, not in forks.
  compare:
    if: github.repository == 'louwers/mln-rs'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    env:
      # Both sides build with these, as in bench.yml.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      # The base is checked out in a worktree, so the history comes too.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Pick the base
        id: base
        env:
          BASE: ${{ inputs.base }}
        run: |
          if [ -z "$BASE" ]; then BASE=$(git rev-list -1 --before='24 hours ago' HEAD); fi
          base=$(git rev-parse --verify "$BASE^{commit}")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install lavapipe
        if: steps.base.outputs.changed == 'true'
        uses: ./.github/actions/lavapipe

      # The tools that mise.toml pins, Rust from rust-toolchain.toml among
      # them, at the versions mise.lock records.
      - uses: jdx/mise-action@v5
        if: steps.base.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.base.outputs.changed == 'true'

      # The basemap fixture that tools/bench/fixtures.json pins.
      - uses: actions/cache@v6
        if: steps.base.outputs.changed == 'true'
        with:
          path: target/bench-fixtures
          key: bench-fixtures-${{ hashFiles('tools/bench/fixtures.json') }}

      - name: Compare
        if: steps.base.outputs.changed == 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: just bench-compare "$BASE" | tee report.md

      - name: File or update the issue
        if: steps.base.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.sha }}
        run: python3 -I tools/bench/nightly.py --report report.md --base "$BASE" --head "$(git rev-parse HEAD)"

      - name: Report
        if: always()
        run: |
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; else echo "No commits on main in the last day." >> "$GITHUB_STEP_SUMMARY"; fi
