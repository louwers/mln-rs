# Proper names in doc comments that `clippy::doc_markdown` would otherwise
# want in backticks. `..` keeps clippy's own list.
doc-valid-idents = [
  "..",
  "BiDi",
  "FastPFOR",
  "FreeType",
  "GeoJSON",
  "HarfBuzz",
  "HarfRust",
  "IOSurface",
  "IOSurfaces",
  "LamAlef",
  "LamAlefs",
  "MapLibre",
  "MBTiles",
  "McNamee",
  "OpenFreeMap",
  "OpenMapTiles",
  "PMTiles",
  "RapidJSON",
  "SwiftShader",
  "TileJSON",
  "TinySDF",
  "ZigZag",
]

# parking_lot's locks don't poison: a panic while a lock is held doesn't make
# every later lock panic or need unwrapping. mln_style::hash's maps and sets
# hash faster than std's SipHash, with a random seed all the same; the crates
# mln_style depends on use foldhash's, the same types, and mln_gfx and the
# backends mln_gfx::util_hash's.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "use mln_style::hash::HashMap, or mln_gfx::util_hash::HashMap in gfx and the backends" },
  { path = "std::collections::HashSet", reason = "use mln_style::hash::HashSet, or mln_gfx::util_hash::HashSet in gfx and the backends" },
  { path = "std::sync::Condvar", reason = "use parking_lot::Condvar" },
  { path = "std::sync::Mutex", reason = "use parking_lot::Mutex, which doesn't poison" },
  { path = "std::sync::RwLock", reason = "use parking_lot::RwLock, which doesn't poison" },
]
