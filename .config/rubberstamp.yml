# Rubberstamp (https://github.com/sargunv/rubberstamp) plans which CI units each
# pull request push needs.
version: 1
context: >-
  mln-rs is a Rust implementation of MapLibre Native targeting desktop, mobile,
  and the browser. `src/` is the `mln-rs` facade crate, `crates/` holds the
  workspace libraries (core map/style/renderer crates, per-backend renderers,
  browser crates, and `mln_c` for the C API), `vendor/` holds ported
  dependencies, `examples/` holds the desktop and browser apps, `tools/` holds
  developer and test tooling, and `mise.toml` / `mise-tasks/` define build and
  test tasks.

# `tools/ci/jobs.json` maps each unit to the CI jobs it runs. A unit's rule
# applies it unconditionally when a changed file matches, using GitHub Actions
# path filter globs.
ci:
  workflow: .github/workflows/ci.yml
  threshold: 0.6
  context: >-
    `lint` and `commits` always run without waiting on the plan; `lint` covers
    formatting, linters, cross-target clippy, docs, MSRV, C ABI codegen checks,
    and `tools/ci/` tests. Changes limited to documentation, formatting, or
    those checks need no units.

    `linux-x64` is the general check for shared Rust code, rendering, and the C
    library. Another unit matters only when a change reaches what it alone
    builds or runs: ARM64 Linux or lavapipe packaging for `linux-arm64`, Metal
    or Apple platform code for `macos`, browser builds or rendered web output
    for `web`, or Cargo manifests and file additions/deletions/renames for
    `package`.

    Changing a job's definition in `.github/workflows/ci.yml`,
    `tools/ci/jobs.json`, or `.github/actions/setup-ci-deps/` puts the units
    that run that job at risk. Release, sanitizer, and GitHub Pages workflows do
    not run on pull requests. The `main` branch runs every unit after merge, so
    a pull request only needs the coverage a reviewer would expect its change to
    put at risk.
  units:
    linux-x64:
      covers: >-
        Linux x64 workspace and render tests on WebGPU (lavapipe), backend-only
        tests on Vulkan (with validation) and OpenGL ES (EGL/llvmpipe), and the
        native C ABI suite. This is the general correctness check for shared
        Rust crates, rendering, and the C library. Docs-only, browser-only, or
        macOS/Windows-only changes do not need it.
    linux-arm64:
      covers: >-
        Linux ARM64 workspace and render tests on WebGPU (lavapipe),
        backend-only tests on Vulkan (with validation) and OpenGL ES
        (EGL/llvmpipe), and the native C ABI suite. Catches ARM64 architecture,
        alignment/SIMD/char-signedness, and ARM64 Linux packaging or CI issues.
        Routine architecture-independent changes that `linux-x64` already covers
        do not need it.
      rules:
        - if:
            files:
              - .github/actions/lavapipe/**
          then: apply
    macos:
      covers: >-
        macOS ARM64 clippy, workspace and render tests on Metal (with API
        validation), and backend-only tests on WebGPU (wgpu on Metal). Catches
        Metal backend, Apple platform, shared GPU/shader abstraction, and macOS
        CI issues. Platform-independent or Linux-only changes that `linux-x64`
        already covers do not need it.
      rules:
        - if:
            files:
              - crates/mln_mtl/**
          then: apply
    web:
      covers: >-
        Browser WASM builds (WebGPU and WebGL2) checked in headless Chromium
        against native renders, the C library's browser packages, TypeScript
        typechecking, and web unit tests. Catches wasm32, browser rendering,
        JS/TS integration, and shared map or renderer changes visible in the
        browser. Native-only backends, native C ABI tests, desktop-only code, or
        docs-only changes do not need it.
      rules:
        - if:
            files:
              - crates/mln_web_*/**
              - examples/web/**
          then: apply
    package:
      covers: >-
        Runs `cargo package --locked` for every publishable crate and builds all
        workspace test targets. Catches manifest errors, broken dependencies,
        and file additions, deletions, or renames that `crates.io` packaging
        would reject. Ordinary edits to existing source files that do not touch
        manifests or add, delete, or rename files do not need it.
      rules:
        - if:
            files:
              - Cargo.toml
              - Cargo.lock
              - "**/Cargo.toml"
          then: apply
