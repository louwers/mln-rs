# Rubberstamp (https://github.com/sargunv/rubberstamp) plans which CI units each
# pull request push needs.
version: 1
context: >-
  mln-rs is a Rust implementation of MapLibre Native targeting desktop, mobile,
  and the browser. `src/` is the `mln-rs` facade crate, `crates/` holds the
  workspace libraries (core map/style/renderer crates, per-backend renderers,
  browser crates, and `mln_c` for the C API), `vendor/` holds ported
  dependencies, `examples/` holds the desktop and browser apps, `tools/` holds
  developer and test tooling, and `.config/mise/` defines build and test tasks.

# `tools/ci/jobs.json` maps each unit to the CI jobs it runs. A unit's rule
# applies it unconditionally when a changed file matches, using GitHub Actions
# path filter globs.
ci:
  workflow: .github/workflows/ci.yml
  threshold: 0.6
  context: >-
    `lint` and `commits` always run without waiting on the plan; `lint` covers
    formatting, linters, cross-target clippy, docs, MSRV, C ABI codegen checks,
    and `tools/ci/` tests. Changes limited to documentation, formatting, or
    those checks need no units.

    `linux-x64` is the general check for shared Rust code, rendering, and the C
    library. Another unit matters only when a change reaches what it alone
    builds or runs: ARM64 Linux or lavapipe packaging for `linux-arm64`, Metal
    or Apple platform code for `macos`, Apple mobile/spatial targets or iOS
    simulator runs for `ios`, Android platform code or emulator runs for
    `android`, Direct3D 12, WGL, or Windows platform code for `windows-x64`,
    FreeBSD cross-compilation or platform code for `freebsd`, OpenHarmony or
    HarmonyOS platform code for `ohos`, the test packages for AWS Device Farm's
    phones for `android-device-farm` and `ios-device-farm`, browser builds or
    rendered web output for `web`, or Cargo manifests and file
    additions/deletions/renames for `package`.

    Changing a job's definition in `.github/workflows/ci.yml`,
    `tools/ci/jobs.json`, or `.github/actions/setup-ci-deps/` puts the units
    that run that job at risk. Release, sanitizer, and GitHub Pages workflows do
    not run on pull requests. The `main` branch runs every unit after merge, so
    a pull request only needs the coverage a reviewer would expect its change to
    put at risk.
  units:
    linux-x64:
      covers: >-
        Linux x64 workspace and render tests on WebGPU (lavapipe), backend-only
        tests on Vulkan (with validation) and OpenGL ES (EGL/llvmpipe), and the
        native C ABI suite, and the C library linked against glibc 2.17. This is
        the general correctness check for shared Rust crates, rendering, and the
        C library. Docs-only, browser-only, or macOS/Windows-only changes do not
        need it.
    linux-arm64:
      covers: >-
        Linux ARM64 workspace and render tests on WebGPU (lavapipe),
        backend-only tests on Vulkan (with validation) and OpenGL ES
        (EGL/llvmpipe), the native C ABI suite, and the C library linked against
        glibc 2.17. Catches ARM64 architecture, alignment/SIMD/char-signedness,
        and ARM64 Linux packaging or CI issues. Routine architecture-independent
        changes that `linux-x64` already covers do not need it.
      rules:
        - if:
            files:
              - .github/actions/lavapipe/**
          then: apply
    macos:
      covers: >-
        macOS ARM64 clippy, workspace and render tests on Metal (with API
        validation), and backend-only tests on WebGPU (wgpu on Metal). Catches
        Metal backend, Apple platform, shared GPU/shader abstraction, and macOS
        CI issues. Platform-independent or Linux-only changes that `linux-x64`
        already covers do not need it.
      rules:
        - if:
            files:
              - crates/mln_mtl/**
              - crates/mln_engine/src/**/msl.rs
              - crates/mln_engine/src/conformance.rs
              - crates/mln_engine/src/conformance/**
          then: apply
    android:
      covers: >-
        Android cross-target clippy for all four Android ABIs, and the workspace
        and render tests on Vulkan (SwiftShader) on an x86_64 Android emulator.
        Catches Android platform code, NDK/JNI/AHardwareBuffer integration,
        Vulkan backend portability, and Android CI setup issues. `main` also
        runs the tests on AWS Device Farm's phones, which pull requests don't.
        Platform-independent changes that `linux-x64` already covers do not need
        it.
      rules:
        - if:
            files:
              - .config/mise/*.target-android.*
              - tools/android-test-host/**
              - tools/ci/boot-android.sh
          then: apply
    android-device-farm:
      covers: >-
        Builds the Android tests into the test package for AWS Device Farm's
        phones (`mise run device-farm:package android`), as `main` does before
        the phones run them; pull requests don't run the phones. Catches
        breakage in the package's build and contents. Only changes to the
        packaging, the Android test host, or the phones' configuration need it.
      rules:
        - if:
            files:
              - .config/device-farm.toml
              - .config/mise/tasks/device-farm/**
              - tools/device-farm/*
              - tools/device-farm/android/**
              - tools/android-test-host/**
          then: apply
    ios:
      covers: >-
        Apple mobile/spatial clippy across iOS, iOS Simulator, Mac Catalyst,
        visionOS, and visionOS Simulator, and workspace and render tests on the
        iOS simulator with Metal API validation. Catches Apple mobile/spatial
        compilation, Metal backend, and `target-apple` CI issues. `main` also
        runs the tests on AWS Device Farm's iPhone, which pull requests don't.
        Platform-independent or Linux-only changes that `linux-x64` already
        covers do not need it.
      rules:
        - if:
            files:
              - crates/mln_mtl/**
              - crates/mln_engine/src/**/msl.rs
              - crates/mln_engine/src/conformance.rs
              - crates/mln_engine/src/conformance/**
              - .config/mise/*.target-apple.*
          then: apply
    ios-device-farm:
      covers: >-
        Builds the iOS tests into the test package and app for AWS Device Farm's
        iPhone (`mise run device-farm:package ios`), as `main` does before the
        iPhone runs them; pull requests don't run the iPhone. Catches breakage
        in the package's build and contents. Only changes to the packaging, the
        iOS test host, or the phones' configuration need it.
      rules:
        - if:
            files:
              - .config/device-farm.toml
              - .config/mise/tasks/device-farm/**
              - tools/device-farm/*
              - tools/device-farm/ios/**
              - tools/ios-test-host/**
          then: apply
    windows-x64:
      covers: >-
        Windows x64 clippy, workspace and render tests on Direct3D 12 (WARP with
        DXC), and backend-only tests on WebGPU, Vulkan (Lavapipe with
        validation), and OpenGL (WGL/llvmpipe). Catches Direct3D 12, WGL,
        Windows platform, shared GPU/shader abstraction, and Windows CI issues.
        Platform-independent or Linux/macOS-only changes that `linux-x64`
        already covers do not need it.
      rules:
        - if:
            files:
              - crates/mln_d3d12/**
              - crates/mln_engine/src/conformance.rs
              - crates/mln_engine/src/conformance/**
              - .github/actions/setup-windows-*/**
          then: apply
    freebsd:
      covers: >-
        FreeBSD x64 cross-target clippy and workspace and render tests on Vulkan
        (with validation) in a FreeBSD virtual machine. Catches FreeBSD
        platform, Unix/BSD portability, Zig cross-linking, and FreeBSD CI
        issues. Routine platform-independent changes that `linux-x64` already
        covers do not need it.
      rules:
        - if:
            files:
              - .config/mise/*.target-freebsd.*
              - tools/ci/boot-freebsd.sh
              - tools/zig-cc-freebsd.sh
          then: apply
    ohos:
      covers: >-
        OpenHarmony cross-target clippy (aarch64, armv7, x86_64) and workspace
        and render tests on the x86_64 OpenHarmony emulator with the OpenGL ES
        backend. Catches OpenHarmony/HarmonyOS platform, native window/VSync,
        OpenGL ES/EGL, and `target-ohos` CI issues. Platform-independent changes
        that `linux-x64` already covers do not need it.
      rules:
        - if:
            files:
              - .config/mise/*.target-ohos.*
          then: apply
    web:
      covers: >-
        Browser WASM builds (WebGPU and WebGL2) checked in headless Chromium
        against native renders, the C library's browser packages, TypeScript
        typechecking, and web unit tests. Catches wasm32, browser rendering,
        JS/TS integration, and shared map or renderer changes visible in the
        browser. Native-only backends, native C ABI tests, desktop-only code, or
        docs-only changes do not need it.
      rules:
        - if:
            files:
              - crates/mln_web_*/**
              - examples/web/**
          then: apply
    package:
      covers: >-
        Runs `cargo package --locked` for every publishable crate and builds all
        workspace test targets. Catches manifest errors, broken dependencies,
        and file additions, deletions, or renames that `crates.io` packaging
        would reject. Ordinary edits to existing source files that do not touch
        manifests or add, delete, or rename files do not need it.
      rules:
        - if:
            files:
              - Cargo.toml
              - Cargo.lock
              - "**/Cargo.toml"
          then: apply
