# cargo-nextest's configuration (https://nexte.st/docs/configuration/):
# `mise run test` and CI's `mise run ci:test` run the tests with it.

[profile.default]
# A test that runs for over a minute is reported as slow, and one still running after ten is ended
# as hung and fails. The slowest tests, the render suites, take a few minutes in CI.
slow-timeout = { period = "60s", terminate-after = 10 }

# The tests that depend on the backend: the packages whose tests render with the one that
# MLN_RENDER_BACKEND names, or make devices of each backend under its validation. CI's backend
# jobs run them (`mise run ci:test --backend-only`) on each backend other than the one its test
# jobs run every test on. A test in another package that renders runs on that one only. The
# render suite through the worker codec doesn't depend on the backend.
[profile.backend]
default-filter = """
(
    package(mln-rs-headless) | package(mln-rs-render-test) | package(mln-rs-engine)
    | package(mln-rs-runtime)
    | package(mln-rs-c) | package(mln-rs-gl) | package(mln-rs-vulkan) | package(mln-rs-mtl)
    | package(mln-rs-d3d12) | package(mln-rs-webgpu)
) & not test(=render_tests::render_tests_through_the_codec)
"""

# The tests that a target's device runs (`mise run ci:target`, tools/device-farm):
# every test but the render suite through the worker codec, which runs on Linux
# x64 only.
[profile.target]
default-filter = "not test(=render_tests::render_tests_through_the_codec)"

# Android's and OpenHarmony's devices run each test from a copy of its package,
# without the host's binaries: not the tests of proc-macro crates, which are
# built for the host, nor those of the render runner's worker processes, which
# run the render-test binary. The render suite runs in the test's process there
# (MLN_RENDER_TEST_JOBS), so it takes longer than the slow timeout allows
# elsewhere, and starts first, since it's the slowest.
[[profile.target.overrides]]
platform = 'cfg(any(target_os = "android", target_env = "ohos"))'
default-filter = """
platform(target)
& not test(=render_tests::render_tests_through_the_codec)
& not (package(mln-rs-render-test) & test(/^jobs::/))
"""

[[profile.target.overrides]]
platform = 'cfg(any(target_os = "android", target_env = "ohos"))'
filter = "test(=render_tests::render_tests)"
slow-timeout = { period = "60s", terminate-after = 45 }
priority = 100

# AWS Device Farm's phones (tools/device-farm), with a JUnit report among the
# run's artifacts. A phone's run is noisier than a runner's: a test that fails
# gets one more try, and passes as flaky.
[profile.device-farm]
inherits = "target"
fail-fast = false
retries = 1

[profile.device-farm.junit]
path = "junit.xml"
