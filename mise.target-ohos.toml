# Builds for OpenHarmony and HarmonyOS, and runs tests on a HarmonyOS
# emulator, as in `cargo nextest run --target aarch64-unknown-linux-ohos`, or
# on an OpenHarmony emulator in QEMU, which the host provides, as in
# `cargo nextest run --target x86_64-unknown-linux-ohos`.
# Select it with `mise -E target-ohos`, or in every command with
# `env = ["target-ohos"]` in an untracked .miserc.local.toml.

[plugins]
ohos-sdk = "https://github.com/sargunv/mise-ohos-sdk#v0.1.0"

[tools]
# The OpenHarmony SDK of API level 23. With DevEco Studio's SDK of that level
# installed, skip the download with `disable_tools = ["ohos-sdk"]` in
# mise.local.toml's [settings]: the compilers then come from DevEco's.
ohos-sdk = "6.1"
# devices-cli gives this checkout its own HarmonyOS emulator, from an image that
# DevEco Studio downloaded, and runs each test on it. The go backend builds it
# with this Go.
"core:go" = "1.27.3"
"go:github.com/sargunv/devices-cli" = "v0.0.0-20261124175957-b99ab1cc3bc6"
# The OpenHarmony emulator's image, of the SDK's release, which devices-cli
# boots in QEMU for the x86_64 target.
"http:oniro-emulator" = { version = "6.1", url = "https://github.com/eclipse-oniro4openharmony/device_board_oniro/releases/download/v{{ version }}/oniro_emulator.zip", checksum = "sha256:a30e01f1b161e0fdcd91263f30f29cc92bfa49c1776d5ee2c46caefef055b2da", bin_path = "." }

[env]
# The SDK's native toolchain: the plugin's, else DevEco Studio's on macOS.
MLN_OHOS_NATIVE = { value = "{% if env.OHOS_SDK_NATIVE is defined %}{{ env.OHOS_SDK_NATIVE }}{% else %}{{ env.HOME }}/Library/OpenHarmony/Sdk/23/native{% endif %}", tools = true }
CC_aarch64_unknown_linux_ohos = { value = "{{ env.MLN_OHOS_NATIVE }}/llvm/bin/aarch64-unknown-linux-ohos-clang", tools = true }
CC_armv7_unknown_linux_ohos = { value = "{{ env.MLN_OHOS_NATIVE }}/llvm/bin/armv7-unknown-linux-ohos-clang", tools = true }
CC_x86_64_unknown_linux_ohos = { value = "{{ env.MLN_OHOS_NATIVE }}/llvm/bin/x86_64-unknown-linux-ohos-clang", tools = true }
AR_aarch64_unknown_linux_ohos = { value = "{{ env.MLN_OHOS_NATIVE }}/llvm/bin/llvm-ar", tools = true }
AR_armv7_unknown_linux_ohos = { value = "{{ env.MLN_OHOS_NATIVE }}/llvm/bin/llvm-ar", tools = true }
AR_x86_64_unknown_linux_ohos = { value = "{{ env.MLN_OHOS_NATIVE }}/llvm/bin/llvm-ar", tools = true }
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER = { value = "{{ env.CC_aarch64_unknown_linux_ohos }}", tools = true }
CARGO_TARGET_ARMV7_UNKNOWN_LINUX_OHOS_LINKER = { value = "{{ env.CC_armv7_unknown_linux_ohos }}", tools = true }
CARGO_TARGET_X86_64_UNKNOWN_LINUX_OHOS_LINKER = { value = "{{ env.CC_x86_64_unknown_linux_ohos }}", tools = true }
# Cargo's runner for the arm64 target, on DevEco Studio's emulator (macOS): a
# test gets a copy of its package directory and the RUST_ and MLN_ variables.
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_RUNNER = "devices-cli exec harmonyos --sync-env CARGO_MANIFEST_DIR --env RUST_* --env MLN_* --"
# And for the x86_64 target, on the OpenHarmony emulator.
OHOS_EMULATOR_IMAGES = { value = "{{ tools['http:oniro-emulator'].path }}/images", tools = true }
CARGO_TARGET_X86_64_UNKNOWN_LINUX_OHOS_RUNNER = "devices-cli exec ohos --sync-env CARGO_MANIFEST_DIR --env RUST_* --env MLN_* --"
# A device runs a test from a copy of its package: nextest's target profile
# (.config/nextest.toml) and the render suite in the test's process.
NEXTEST_PROFILE = "target"
MLN_RENDER_TEST_JOBS = "1"

[hooks]
# The Rust targets. An inline script, since a hook's `mise run` would not see
# an environment selected with -E.
postinstall = "rustup target add aarch64-unknown-linux-ohos armv7-unknown-linux-ohos x86_64-unknown-linux-ohos"
